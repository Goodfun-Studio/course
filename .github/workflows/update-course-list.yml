name: 更新课程列表

# 往仓里加一门课（新建一个带 index.html 的文件夹）之后，这里自动把它加进首页列表。
# 课程想用自己的标题/简介，就在该课程目录下放一个 course.json：
#   { "title": "显示名", "desc": "一句话简介", "order": 1 }

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 重新生成课程列表
        run: python3 scripts/gen_courses.py
      - name: 有变化就提交
        run: |
          if git diff --quiet; then
            echo "列表无变化，跳过提交"
            exit 0
          fi
          git config user.name "goodfun-course-bot"
          git config user.email "ivy.wooo@goodfun.studio"
          git add index.html
          git commit -m "auto: 更新课程列表"
          git push

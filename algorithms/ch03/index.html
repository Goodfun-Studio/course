/* ---------- 辅助函数 ---------- */
function drawString(parent, str, x, y, spacing = 50) {
  const g = G(parent, { x, y, o: 0 });
  str.split('').forEach((ch, i) => {
    T(g, ch, { x: i * spacing, y: 0, size: 36, weight: 600, fill: PRIMARY });
  });
  return g;
}

function drawArrow(parent, x1, y1, x2, y2, color = PRIMARY) {
  const g = G(parent, { o: 0 });
  const dx = x2 - x1, dy = y2 - y1;
  const angle = Math.atan2(dy, dx);
  
  mk('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': 3 }, g);
  
  const arrowSize = 10;
  const x3 = x2 - arrowSize * Math.cos(angle - Math.PI / 6);
  const y3 = y2 - arrowSize * Math.sin(angle - Math.PI / 6);
  const x4 = x2 - arrowSize * Math.cos(angle + Math.PI / 6);
  const y4 = y2 - arrowSize * Math.sin(angle + Math.PI / 6);
  
  mk('line', { x1: x2, y1: y2, x2: x3, y2: y3, stroke: color, 'stroke-width': 3 }, g);
  mk('line', { x1: x2, y1: y2, x2: x4, y2: y4, stroke: color, 'stroke-width': 3 }, g);
  
  return g;
}

function drawTable(parent, rows, cols, cellSize = 60, x = 400, y = 200) {
  const g = G(parent, { x, y, o: 0 });
  
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      mk('rect', {
        x: c * cellSize,
        y: r * cellSize,
        width: cellSize,
        height: cellSize,
        fill: TABLE_BG,
        stroke: TABLE_BORDER,
        'stroke-width': 2,
      }, g);
    }
  }
  
  return g;
}

function setCellValue(parent, row, col, value, cellSize = 60) {
  const x = col * cellSize + cellSize / 2;
  const y = row * cellSize + cellSize / 2;
  const t = T(parent, String(value), { x, y, size: 24, weight: 600, fill: '#ecf0f1', anchor: 'middle', o: 0 });
  t.setAttribute('dominant-baseline', 'central');
  return t;
}

function highlightCell(parent, row, col, cellSize = 60, color = HIGHLIGHT) {
  const rect = mk('rect', {
    x: col * cellSize + 2,
    y: row * cellSize + 2,
    width: cellSize - 4,
    height: cellSize - 4,
    fill: 'none',
    stroke: color,
    'stroke-width': 4,
    opacity: 0,
  }, parent);
  return rect;
}

// beat 8: fill - 最关键，85.4s
['fill', '填充表格规则', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, '状态转移方程', { x: 800, y: 60, size: 38, weight: 600, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.5);
  
  const str1 = 'SUN';
  const str2 = 'SAT';
  
  const colLabels = G(p, { x: 260, y: 130, o: 1 });
  T(colLabels, 'ε', { x: 0, y: 0, size: 20, fill: COL.dim, anchor: 'middle' });
  str2.split('').forEach((ch, i) => {
    T(colLabels, ch, { x: (i + 1) * 50, y: 0, size: 20, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  const rowLabels = G(p, { x: 180, y: 180, o: 1 });
  T(rowLabels, 'ε', { x: 0, y: 0, size: 20, fill: COL.dim, anchor: 'middle' });
  str1.split('').forEach((ch, i) => {
    T(rowLabels, ch, { x: 0, y: (i + 1) * 50, size: 20, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  const table = drawTable(p, str1.length + 1, str2.length + 1, 50, 200, 160);
  put(table, { o: 1 });
  
  // 初始化边界
  for (let j = 0; j <= str2.length; j++) {
    const val = setCellValue(table, 0, j, j, 50);
    put(val, { o: 1 });
  }
  for (let i = 1; i <= str1.length; i++) {
    const val = setCellValue(table, i, 0, i, 50);
    put(val, { o: 1 });
  }
  
  // DP计算
  const dp = Array(str1.length + 1).fill(0).map(() => Array(str2.length + 1).fill(0));
  for (let i = 0; i <= str1.length; i++) dp[i][0] = i;
  for (let j = 0; j <= str2.length; j++) dp[0][j] = j;
  
  // 右侧说明区
  const ruleTitle = T(p, '每格看三个邻居：', { x: 550, y: 200, size: 24, fill: PRIMARY, weight: 600, o: 0 });
  tw(ruleTitle, { o: 1 }, 1.0, 0.5);
  
  // 7.6s: 三个邻居箭头（右侧说明区，箭头指示来源方向）
  const neighborG = G(p, { x: 650, y: 260, o: 0 });
  
  // 13.8s: 上方=删除（箭头向下，表示从上方来）
  const upArrow = drawArrow(neighborG, 20, 0, 20, 40, DELETE);
  const upLabel = T(neighborG, '上方 → 删除 (+1)', { x: 50, y: 20, size: 20, fill: DELETE });
  tw(upArrow, { o: 1 }, 13.8, 0.5);
  tw(upLabel, { o: 1 }, 14.0, 0.5);
  
  // 21.6s: 左方=插入（箭头向右，表示从左方来）
  const leftArrow = drawArrow(neighborG, 0, 80, 40, 80, INSERT);
  const leftLabel = T(neighborG, '左方 → 插入 (+1)', { x: 50, y: 70, size: 20, fill: INSERT });
  tw(leftArrow, { o: 1 }, 21.6, 0.5);
  tw(leftLabel, { o: 1 }, 21.8, 0.5);
  
  // 29.4s: 左上方=匹配/替换（对角箭头）
  const diagArrow = drawArrow(neighborG, 0, 120, 40, 160, MATCH);
  const diagLabel = T(neighborG, '左上 → 匹配/替换', { x: 50, y: 140, size: 20, fill: MATCH });
  tw(diagArrow, { o: 1 }, 29.4, 0.5);
  tw(diagLabel, { o: 1 }, 29.6, 0.5);
  
  tw(neighborG, { o: 1 }, 7.6, 0.4);
  
  // 34.0s: 相同则继承
  const matchRule = T(p, '字符相同 → 继承左上', { x: 550, y: 450, size: 22, fill: MATCH, o: 0 });
  tw(matchRule, { o: 1 }, 34.0, 0.5);
  
  // 41.6s: 不同则替换+1
  const replaceRule = T(p, '字符不同 → 左上+1', { x: 550, y: 490, size: 22, fill: REPLACE, o: 0 });
  tw(replaceRule, { o: 1 }, 41.6, 0.5);
  
  const minRule = T(p, '取三者最小值', { x: 550, y: 530, size: 22, fill: HIGHLIGHT, weight: 600, o: 0 });
  tw(minRule, { o: 1 }, 46.8, 0.5);
  
  // 52.2s 开始逐格填充，每格约 3s
  let fillTime = 52.2;
  for (let i = 1; i <= str1.length; i++) {
    for (let j = 1; j <= str2.length; j++) {
      const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
      
      const highlight = highlightCell(table, i, j, 50);
      tw(highlight, { opacity: 0.8 }, fillTime, 0.4);
      tw(highlight, { opacity: 0 }, fillTime + 2.0, 0.4);
      
      const val = setCellValue(table, i, j, dp[i][j], 50);
      tw(val, { o: 1 }, fillTime + 0.3, 0.5);
      
      // 59.2s: 比较 U 和 A
      if (i === 2 && j === 2) {
        const compLabel = T(p, `比较 ${str1[i-1]} ≠ ${str2[j-1]}`, 
          { x: 550, y: 580, size: 20, fill: '#ff6b6b', o: 0 });
        tw(compLabel, { o: 1 }, fillTime + 0.2, 0.5);
        tw(compLabel, { o: 0 }, fillTime + 2.5, 0.3);
      }
      
      fillTime += 3.2;
    }
  }
  
  // 75.8s: 右下角是二
  const finalBox = highlightCell(table, 3, 3, 50, HIGHLIGHT);
  tw(finalBox, { opacity: 1 }, 75.8, 0.6);
  
  const finalLabel = T(p, '右下角：答案 = 2', 
    { x: 550, y: 630, size: 26, fill: HIGHLIGHT, weight: 700, o: 0 });
  tw(finalLabel, { o: 1 }, 76.5, 0.7);
  
  // 80.8s: 局部最优→全局最优
  const conclusion = T(p, '每格局部最优 → 全局最优', 
    { x: 550, y: 675, size: 22, fill: INSERT, o: 0 });
  tw(conclusion, { o: 1 }, 80.8, 0.7);
  
  const status = T(p, '', { x: 550, y: 715, size: 18, fill: COL.dim, o: 0 });
  tw(status, { o: 0.6 }, 81.0, 0.4);
  
  // 持续闪烁最终答案+状态更新
  clockRun(t => {
    if (t > 76) {
      const pulse = 0.7 + Math.sin(t * 2.5) * 0.3;
      put(finalBox, { opacity: pulse });
    }
    if (t > 81) {
      status.textContent = `填表算法完成 (${Math.ceil(dur - t)}s)`;
    }
  }, dur, { tail: true });
}],

// beat 9: traceback
['traceback', '回溯找路径', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, '最优路径回溯', { x: 800, y: 80, size: 42, weight: 600, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.5);
  
  const str1 = 'SUN';
  const str2 = 'SAT';
  
  const colLabels = G(p, { x: 360, y: 160, o: 1 });
  T(colLabels, 'ε', { x: 0, y: 0, size: 24, fill: COL.dim, anchor: 'middle' });
  str2.split('').forEach((ch, i) => {
    T(colLabels, ch, { x: (i + 1) * 60, y: 0, size: 24, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  const rowLabels = G(p, { x: 260, y: 220, o: 1 });
  T(rowLabels, 'ε', { x: 0, y: 0, size: 24, fill: COL.dim, anchor: 'middle' });
  str1.split('').forEach((ch, i) => {
    T(rowLabels, ch, { x: 0, y: (i + 1) * 60, size: 24, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  const table = drawTable(p, str1.length + 1, str2.length + 1, 60, 300, 200);
  put(table, { o: 1 });
  
  const dp = Array(str1.length + 1).fill(0).map(() => Array(str2.length + 1).fill(0));
  for (let i = 0; i <= str1.length; i++) dp[i][0] = i;
  for (let j = 0; j <= str2.length; j++) dp[0][j] = j;
  
  for (let i = 0; i <= str1.length; i++) {
    for (let j = 0; j <= str2.length; j++) {
      if (i === 0 || j === 0) {
        const val = setCellValue(table, i, j, dp[i][j], 60);
        put(val, { o: 1 });
      }
    }
  }
  
  for (let i = 1; i <= str1.length; i++) {
    for (let j = 1; j <= str2.length; j++) {
      const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
      const val = setCellValue(table, i, j, dp[i][j], 60);
      put(val, { o: 1 });
    }
  }
  
  // 回溯路径
  const path = [];
  const ops = [];
  let i = str1.length, j = str2.length;
  while (i > 0 || j > 0) {
    path.push([i, j]);
    if (i === 0) { ops.push('插入'); j--; continue; }
    if (j === 0) { ops.push('删除'); i--; continue; }
    
    const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
    const diag = dp[i - 1][j - 1] + cost;
    const up = dp[i - 1][j] + 1;
    const left = dp[i][j - 1] + 1;
    
    if (diag <= up && diag <= left) { 
      ops.push(cost === 0 ? '匹配' : '替换');
      i--; j--;
    }
    else if (up <= left) { ops.push('删除'); i--; }
    else { ops.push('插入'); j--; }
  }
  path.push([0, 0]);
  path.reverse();
  ops.reverse();
  
  // 9.9s 开始逐步走路径
  let traceTime = 9.9;
  path.forEach(([r, c], idx) => {
    const highlight = highlightCell(table, r, c, 60, INSERT);
    tw(highlight, { opacity: 0.6 }, traceTime, 0.5);
    
    // 标注操作类型
    if (idx > 0 && idx < ops.length) {
      const op = ops[idx];
      let opColor = COL.dim;
      if (op === '删除') opColor = DELETE;
      else if (op === '插入') opColor = INSERT;
      else if (op === '替换') opColor = REPLACE;
      else if (op === '匹配') opColor = MATCH;
      
      const opLabel = T(table, op, { 
        x: c * 60 + 30, y: r * 60 + 2, 
        size: 13, fill: opColor, anchor: 'middle', weight: 600, o: 0 
      });
      tw(opLabel, { o: 1 }, traceTime + 0.3, 0.4);
      
      // 15.6s, 20.7s, 24.9s 对应旁白
      if (op === '替换' && traceTime < 16) traceTime = 15.6;
      else if (op === '删除' && traceTime < 21) traceTime = 20.7;
      else if (op === '插入' && traceTime < 25) traceTime = 24.9;
    }
    
    traceTime += 2.8;
  });
  
  // 34.8s: 总结
  const summary = T(p, 'S 不变，U→A，N→T，共两步', 
    { x: 800, y: 580, size: 30, fill: HIGHLIGHT, weight: 600, anchor: 'middle', o: 0 });
  tw(summary, { o: 1 }, 34.8, 0.7);
  
  const result = T(p, `最短编辑距离：${dp[str1.length][str2.length]}`, 
    { x: 800, y: 640, size: 32, fill: INSERT, anchor: 'middle', o: 0 });
  tw(result, { o: 1 }, 5.9, 0.6);
  
  // 44.3s: 路径可能不唯一
  const note = T(p, '注意：最优路径可能不唯一', 
    { x: 800, y: 700, size: 26, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(note, { o: 1 }, 44.3, 0.6);
  
  // 50.4s: 但代价都相同
  const sameCost = T(p, '但它们的代价都相同，都是最小的', 
    { x: 800, y: 750, size: 26, fill: INSERT, anchor: 'middle', o: 0 });
  tw(sameCost, { o: 1 }, 50.4, 0.7);
  
  clockRun(t => {
    if (t > 45) {
      const shift = Math.sin(t * 1.8) * 3;
      put(summary, { y: 580 + shift });
    }
  }, dur, { tail: true });
}],

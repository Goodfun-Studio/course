'use strict';
const CHAPTER = { number: 5, title: 'Dijkstra 最短路径算法', language: 'zh', minutes: 4 };

/* ---------- 颜色方案 ---------- */
const PRIMARY = '#667eea';
const SECONDARY = '#764ba2';
const UNVISITED = '#95a5a6';
const CURRENT = '#3498db';
const VISITED = '#2ecc71';
const EDGE_DEFAULT = '#7f8c8d';
const EDGE_ACTIVE = '#e74c3c';
const INF_COLOR = '#c0392b';

/* ---------- 辅助函数：绘制图 ---------- */
// 节点位置（6个节点，圆形布局）
const NODES = {
  A: { x: 400, y: 400, label: 'A' },
  B: { x: 650, y: 250, label: 'B' },
  C: { x: 850, y: 350, label: 'C' },
  D: { x: 850, y: 550, label: 'D' },
  E: { x: 650, y: 650, label: 'E' },
  F: { x: 450, y: 600, label: 'F' }
};

// 边（无向图）
const EDGES = [
  { from: 'A', to: 'B', weight: 4 },
  { from: 'A', to: 'C', weight: 2 },
  { from: 'B', to: 'C', weight: 1 },
  { from: 'B', to: 'D', weight: 5 },
  { from: 'C', to: 'D', weight: 8 },
  { from: 'C', to: 'E', weight: 10 },
  { from: 'D', to: 'E', weight: 2 },
  { from: 'D', to: 'F', weight: 6 },
  { from: 'E', to: 'F', weight: 3 }
];

function drawGraph(parent, showWeights = true) {
  const g = G(parent, { o: 0 });
  
  // 先画边（背景层）
  const edgeGroup = G(g);
  EDGES.forEach(edge => {
    const from = NODES[edge.from];
    const to = NODES[edge.to];
    
    // 边的线
    const line = mk('line', {
      x1: from.x, y1: from.y,
      x2: to.x, y2: to.y,
      stroke: EDGE_DEFAULT,
      'stroke-width': 3,
      opacity: 0.6
    }, edgeGroup);
    line.dataset.from = edge.from;
    line.dataset.to = edge.to;
    
    // 权重标签
    if (showWeights) {
      const mx = (from.x + to.x) / 2;
      const my = (from.y + to.y) / 2;
      T(edgeGroup, String(edge.weight), {
        x: mx, y: my,
        size: 20,
        fill: '#34495e',
        weight: 600,
        anchor: 'middle'
      });
    }
  });
  
  // 再画节点（前景层）
  const nodeGroup = G(g);
  Object.entries(NODES).forEach(([key, node]) => {
    const nodeG = G(nodeGroup, { x: node.x, y: node.y });
    nodeG.dataset.node = key;
    
    // 节点圆圈
    mk('circle', {
      r: 35,
      fill: UNVISITED,
      stroke: '#2c3e50',
      'stroke-width': 3
    }, nodeG);
    
    // 节点标签
    T(nodeG, node.label, {
      x: 0, y: 5,
      size: 28,
      fill: '#fff',
      weight: 700,
      anchor: 'middle'
    });
  });
  
  g._edges = edgeGroup;
  g._nodes = nodeGroup;
  
  return g;
}

function drawDistanceLabels(parent) {
  const g = G(parent, { o: 0 });
  
  Object.entries(NODES).forEach(([key, node]) => {
    const label = G(g, { x: node.x, y: node.y - 60 });
    label.dataset.node = key;
    
    // 背景框
    mk('rect', {
      x: -30, y: -15,
      width: 60, height: 30,
      fill: '#ecf0f1',
      stroke: '#bdc3c7',
      'stroke-width': 2,
      rx: 5
    }, label);
    
    // 距离文字
    const text = T(label, '∞', {
      x: 0, y: 5,
      size: 20,
      fill: INF_COLOR,
      weight: 600,
      anchor: 'middle'
    });
    
    label._text = text;
  });
  
  return g;
}

function updateNodeColor(nodeGroup, nodeKey, color, t0) {
  const node = nodeGroup.querySelector(`[data-node="${nodeKey}"]`);
  if (node) {
    const circle = node.querySelector('circle');
    tw(circle, { fill: color }, t0, 0.5, out);
  }
}

function updateDistance(labelGroup, nodeKey, distance, t0) {
  const label = labelGroup.querySelector(`[data-node="${nodeKey}"]`);
  if (label && label._text) {
    const text = label._text;
    const displayText = distance === Infinity ? '∞' : String(distance);
    const color = distance === Infinity ? INF_COLOR : PRIMARY;
    
    // 缩放动画
    tw(text, { s: 1.3 }, t0, 0.2, out);
    tw(text, { s: 1 }, t0 + 0.2, 0.3, io);
    
    // 更新文字
    setTimeout(() => {
      text.textContent = displayText;
      text.setAttribute('fill', color);
    }, t0 * 1000);
  }
}

function highlightEdge(edgeGroup, from, to, color, t0) {
  const edges = edgeGroup.querySelectorAll('line');
  for (const edge of edges) {
    const ef = edge.dataset.from;
    const et = edge.dataset.to;
    if ((ef === from && et === to) || (ef === to && et === from)) {
      tw(edge, { stroke: color, 'stroke-width': 5, opacity: 1 }, t0, 0.4, out);
    }
  }
}

  const constraint = T(p, '⚠️  限制：仅适用于非负权重图',

    { x: 800, y: 680, size: 26, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(alternative, { o: 1 }, 18.5, 0.5);
}],

// beat 10: applications
['applications', '应用场景', (m, dur) => {

}],

// beat 11: summary
['summary', '总结回顾', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, '算法步骤', { x: 800, y: 100, size: 48, weight: 600, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.5);
  
  const steps = [
    '1. 初始化：起点 = 0，其余 = ∞',
    '2. 贪心选择：取距离最小的未访问节点',
    '3. 松弛：更新邻居的距离',
    '4. 标记为已访问',
    '5. 重复 2-4，直到所有节点处理完'
  ];
  
  let t = 5.0;
  steps.forEach((step, i) => {
    const text = T(p, step, 
      { x: 350, y: 220 + i * 70, size: 28, fill: PRIMARY, o: 0, weight: 500 });
    tw(text, { o: 1 }, t, 0.6);
    t += 3.0;

  tw(beauty, { o: 1 }, 25.0, 0.7);
  
  clockRun(t => {
    if (t > 20) {
      const phase = Math.sin(t * 0.6) * 0.03 + 1;
      put(title, { s: phase });

  }, dur, { tail: true });
}]

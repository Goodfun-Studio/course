'use strict';
const CHAPTER = { number: 8, title: 'Bellman-Ford 负权边最短路径', language: 'zh', minutes: 10 };

/* ---------- 颜色方案 ---------- */
const PRIMARY = '#667eea';
const SECONDARY = '#764ba2';
const UNVISITED = '#95a5a6';
const VISITED = '#2ecc71';
const EDGE_DEFAULT = '#7f8c8d';
const EDGE_TRYING = '#f39c12';
const EDGE_SELECTED = '#2ecc71';
const EDGE_NEGATIVE = '#e74c3c';
const INF_COLOR = '#c0392b';

/* ---------- 辅助函数：绘制有向图 ---------- */
// 节点位置（6个节点）
const NODES = {
  A: { x: 300, y: 400, label: 'A' },
  B: { x: 550, y: 250, label: 'B' },
  C: { x: 550, y: 550, label: 'C' },
  D: { x: 800, y: 400, label: 'D' },
  E: { x: 1050, y: 300, label: 'E' },
  F: { x: 1050, y: 500, label: 'F' }
};

// 有向边（包含负权边）
const EDGES = [
  { from: 'A', to: 'B', weight: 4 },
  { from: 'A', to: 'C', weight: 2 },
  { from: 'B', to: 'D', weight: 3 },
  { from: 'C', to: 'D', weight: -5 },  // 负权边
  { from: 'B', to: 'E', weight: 2 },
  { from: 'D', to: 'E', weight: 1 },
  { from: 'D', to: 'F', weight: 4 },
  { from: 'E', to: 'F', weight: -1 }   // 负权边
];

function drawArrow(parent, x1, y1, x2, y2, color = EDGE_DEFAULT) {
  // 箭头终点缩短，避免覆盖节点
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ratio = (len - 40) / len;
  const ex = x1 + dx * ratio;
  const ey = y1 + dy * ratio;
  
  const line = mk('line', {
    x1, y1, x2: ex, y2: ey,
    stroke: color,
    'stroke-width': 3,
    'marker-end': 'url(#arrowhead)',
    opacity: 0.7
  }, parent);
  
  return line;
}

function drawGraph(parent, options = {}) {
  const g = G(parent, { o: 0 });
  
  // 定义箭头标记
  const defs = mk('defs', {}, g);
  const marker = mk('marker', {
    id: 'arrowhead',
    markerWidth: 10,
    markerHeight: 10,
    refX: 9,
    refY: 3,
    orient: 'auto',
    markerUnits: 'strokeWidth'
  }, defs);
  mk('path', {
    d: 'M0,0 L0,6 L9,3 z',
    fill: EDGE_DEFAULT
  }, marker);
  
  // 先画边
  const edgeGroup = G(g);
  const edgeElements = {};
  
  EDGES.forEach((edge, idx) => {
    const from = NODES[edge.from];
    const to = NODES[edge.to];
    
    const arrow = drawArrow(edgeGroup, from.x, from.y, to.x, to.y);
    arrow.dataset.from = edge.from;
    arrow.dataset.to = edge.to;
    arrow.dataset.weight = edge.weight;
    
    edgeElements[`${edge.from}-${edge.to}`] = arrow;
    
    // 权重标签
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    
    const labelColor = edge.weight < 0 ? EDGE_NEGATIVE : '#34495e';
    const labelBg = G(edgeGroup, { x: mx, y: my });
    mk('circle', { r: 18, fill: '#ecf0f1', stroke: '#bdc3c7', 'stroke-width': 2 }, labelBg);
    T(labelBg, String(edge.weight), {
      x: 0, y: 5,
      size: 18,
      fill: labelColor,
      weight: 700,
      anchor: 'middle'
    });
  });
  
  // 再画节点
  const nodeGroup = G(g);
  Object.entries(NODES).forEach(([key, node]) => {
    const nodeG = G(nodeGroup, { x: node.x, y: node.y });
    nodeG.dataset.node = key;
    
    mk('circle', {
      r: 35,
      fill: UNVISITED,
      stroke: '#2c3e50',
      'stroke-width': 3
    }, nodeG);
    
    T(nodeG, node.label, {
      x: 0, y: 5,
      size: 28,
      fill: '#fff',
      weight: 700,
      anchor: 'middle'
    });
  });
  
  g._edges = edgeGroup;
  g._edgeElements = edgeElements;
  g._nodes = nodeGroup;
  
  return g;
}

function drawDistanceLabels(parent) {
  const g = G(parent, { o: 0 });
  
  Object.entries(NODES).forEach(([key, node]) => {
    const label = G(g, { x: node.x, y: node.y - 70 });
    label.dataset.node = key;
    
    mk('rect', {
      x: -35, y: -18,
      width: 70, height: 36,
      fill: '#ecf0f1',
      stroke: '#bdc3c7',
      'stroke-width': 2,
      rx: 5
    }, label);
    
    const text = T(label, '∞', {
      x: 0, y: 6,
      size: 22,
      fill: INF_COLOR,
      weight: 600,
      anchor: 'middle'
    });
    
    label._text = text;
  });
  
  return g;
}

function updateDistance(labelGroup, nodeKey, distance, t0) {
  const label = labelGroup.querySelector(`[data-node="${nodeKey}"]`);
  if (label && label._text) {
    const text = label._text;
    const displayText = distance === Infinity ? '∞' : String(distance);
    const color = distance === Infinity ? INF_COLOR : PRIMARY;
    
    prog(q => {
      if (q >= 1) {
        text.textContent = displayText;
        text.setAttribute('fill', color);
      }
    }, t0, 0.001);
    
    tw(text, { s: 1.4 }, t0, 0.2, out);
    tw(text, { s: 1 }, t0 + 0.2, 0.3, io);
  }
}

function highlightEdge(edgeElements, fromKey, toKey, color, t0, duration = 0.4) {
  const key = `${fromKey}-${toKey}`;
  const edge = edgeElements[key];
  if (edge) {
    tw(edge, { stroke: color, 'stroke-width': 5, opacity: 1 }, t0, duration, out);
  }
}

function resetEdge(edgeElements, fromKey, toKey, t0) {
  const key = `${fromKey}-${toKey}`;
  const edge = edgeElements[key];
  if (edge) {
    tw(edge, { stroke: EDGE_DEFAULT, 'stroke-width': 3, opacity: 0.7 }, t0, 0.3);
  }
}

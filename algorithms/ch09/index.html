/* ---------- 颜色方案 ---------- */
const PRIMARY = '#667eea';
const SECONDARY = '#764ba2';
const UNVISITED = '#95a5a6';
const VISITED = '#2ecc71';
const CURRENT = '#f39c12';
const EDGE_DEFAULT = '#7f8c8d';
const EDGE_TRYING = '#f39c12';
const EDGE_SELECTED = '#2ecc71';
const EDGE_NEGATIVE = '#e74c3c';
const INF_COLOR = '#c0392b';
const CELL_INIT = '#ecf0f1';
const CELL_CHECKING = '#fff3cd';
const CELL_UPDATED = '#d4edda';
const CELL_FINAL = '#cfe2ff';

/* ---------- 辅助函数：绘制有向图 ---------- */
// 5个节点布局
const NODES = {
  A: { x: 200, y: 350, label: 'A' },
  B: { x: 400, y: 250, label: 'B' },
  C: { x: 400, y: 450, label: 'C' },
  D: { x: 600, y: 350, label: 'D' },
  E: { x: 800, y: 350, label: 'E' }
};

// 有向边（包含负权边）
const EDGES = [
  { from: 'A', to: 'B', weight: 4 },
  { from: 'A', to: 'D', weight: 7 },
  { from: 'B', to: 'C', weight: 8 },
  { from: 'B', to: 'D', weight: 3 },
  { from: 'C', to: 'E', weight: 6 },
  { from: 'D', to: 'C', weight: -5 },  // 负权边
  { from: 'D', to: 'E', weight: 3 }
];

function drawArrow(parent, x1, y1, x2, y2, color = EDGE_DEFAULT) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const shrink = Math.min(40, len * 0.4);
  const ratio = (len - shrink) / len;
  const ex = x1 + dx * ratio;
  const ey = y1 + dy * ratio;
  
  const line = mk('line', {
    x1, y1, x2: ex, y2: ey,
    stroke: color,
    'stroke-width': 3,
    'marker-end': 'url(#arrowhead)',
    opacity: 0.7
  }, parent);
  
  return line;
}

function drawGraph(parent, options = {}) {
  const g = G(parent, { o: 0 });
  
  // 定义箭头标记
  const defs = mk('defs', {}, g);
  const marker = mk('marker', {
    id: 'arrowhead',
    markerWidth: 10,
    markerHeight: 10,
    refX: 9,
    refY: 3,
    orient: 'auto',
    markerUnits: 'strokeWidth'
  }, defs);
  mk('path', {
    d: 'M0,0 L0,6 L9,3 z',
    fill: EDGE_DEFAULT
  }, marker);
  
  // 先画边
  const edgeGroup = G(g);
  const edgeElements = {};
  
  EDGES.forEach(edge => {
    const from = NODES[edge.from];
    const to = NODES[edge.to];
    
    const arrow = drawArrow(edgeGroup, from.x, from.y, to.x, to.y);
    arrow.dataset.from = edge.from;
    arrow.dataset.to = edge.to;
    arrow.dataset.weight = edge.weight;
    
    edgeElements[`${edge.from}-${edge.to}`] = arrow;
    
    // 权重标签
    const mx = (from.x + to.x) / 2;
    const my = (from.y + to.y) / 2;
    
    const labelColor = edge.weight < 0 ? EDGE_NEGATIVE : '#34495e';
    const labelBg = G(edgeGroup, { x: mx, y: my });
    mk('circle', { r: 16, fill: '#ecf0f1', stroke: '#bdc3c7', 'stroke-width': 2 }, labelBg);
    T(labelBg, String(edge.weight), {
      x: 0, y: 5,
      size: 16,
      fill: labelColor,
      weight: 700,
      anchor: 'middle'
    });
  });
  
  // 再画节点
  const nodeGroup = G(g);
  const nodeElements = {};
  
  Object.entries(NODES).forEach(([key, node]) => {
    const nodeG = G(nodeGroup, { x: node.x, y: node.y });
    nodeG.dataset.node = key;
    
    const circle = mk('circle', {
      r: 30,
      fill: UNVISITED,
      stroke: '#2c3e50',
      'stroke-width': 3
    }, nodeG);
    
    T(nodeG, node.label, {
      x: 0, y: 5,
      size: 24,
      fill: '#fff',
      weight: 700,
      anchor: 'middle'
    });
    
    nodeElements[key] = { group: nodeG, circle };
  });
  
  g._edges = edgeGroup;
  g._edgeElements = edgeElements;
  g._nodes = nodeGroup;
  g._nodeElements = nodeElements;
  
  return g;
}

// 绘制距离矩阵
function drawDistanceMatrix(parent, initialValues) {
  const g = G(parent, { o: 0 });
  const cellSize = 60;
  const startX = 950;
  const startY = 180;
  
  const nodeKeys = Object.keys(NODES);
  const n = nodeKeys.length;
  
  // 行列标签
  const headerY = startY - 35;
  nodeKeys.forEach((key, i) => {
    T(g, key, { x: startX + i * cellSize + cellSize/2, y: headerY, size: 18, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  const headerX = startX - 35;
  nodeKeys.forEach((key, i) => {
    T(g, key, { x: headerX, y: startY + i * cellSize + cellSize/2 + 5, size: 18, fill: PRIMARY, weight: 600, anchor: 'middle' });
  });
  
  // 矩阵单元格
  const cells = {};
  
  nodeKeys.forEach((rowKey, i) => {
    nodeKeys.forEach((colKey, j) => {
      const cellG = G(g, { x: startX + j * cellSize, y: startY + i * cellSize });
      
      const rect = mk('rect', {
        width: cellSize,
        height: cellSize,
        fill: CELL_INIT,
        stroke: '#bdc3c7',
        'stroke-width': 2
      }, cellG);
      
      let value = initialValues[rowKey][colKey];
      let displayText = value === Infinity ? '∞' : String(value);
      let textColor = value === Infinity ? INF_COLOR : '#2c3e50';
      
      const text = T(cellG, displayText, {
        x: cellSize / 2,
        y: cellSize / 2 + 5,
        size: 18,
        fill: textColor,
        weight: 600,
        anchor: 'middle'
      });
      
      cells[`${rowKey}-${colKey}`] = { group: cellG, rect, text, value };
    });
  });
  
  g._cells = cells;
  return g;
}

// 更新矩阵单元格
function updateMatrixCell(cells, rowKey, colKey, newValue, t0, options = {}) {
  const key = `${rowKey}-${colKey}`;
  const cell = cells[key];
  
  if (!cell) return;
  
  const { flashColor = CELL_CHECKING, finalColor = CELL_UPDATED } = options;
  
  // 高亮闪烁
  tw(cell.rect, { fill: flashColor }, t0, 0.3);
  tw(cell.rect, { fill: finalColor }, t0 + 0.3, 0.3);
  
  // 更新数值
  prog(q => {
    if (q >= 1) {
      const displayText = newValue === Infinity ? '∞' : String(newValue);
      const textColor = newValue === Infinity ? INF_COLOR : '#2c3e50';
      cell.text.textContent = displayText;
      cell.text.setAttribute('fill', textColor);
      cell.value = newValue;
    }
  }, t0 + 0.3, 0.001);
  
  // 数值缩放动画
  tw(cell.text, { s: 1.3 }, t0 + 0.3, 0.2, out);
  tw(cell.text, { s: 1 }, t0 + 0.5, 0.25, io);
}

    { i: 'D', j: 'B', comment: 'D→B: 直接∞ vs 经过A(7+4=11)，更新!' },
    { i: 'B', j: 'E', comment: 'B→E: 直接∞ vs 经过A(4+∞)，不更新' }
  ];
  
  updates.forEach((u, idx) => {
    const key = `${u.i}-${u.j}`;
    const cell = matrix._cells[key];
    
    // 高亮正在检查的单元格
    tw(cell.rect, { fill: CELL_CHECKING }, t, 0.3);
    tw(cell.rect, { stroke: PRIMARY, 'stroke-width': 3 }, t, 0.3);
    
    if (u.comment.includes('更新')) {
      // 计算新距离
      const newDist = dist[u.i]['A'] + dist['A'][u.j];
      if (newDist < dist[u.i][u.j]) {
        dist[u.i][u.j] = newDist;
        updateMatrixCell(matrix._cells, u.i, u.j, newDist, t + 0.5);
      }
      t += 1.2;
    } else {
      tw(cell.rect, { fill: CELL_INIT }, t + 0.5, 0.3);
      tw(cell.rect, { stroke: '#bdc3c7', 'stroke-width': 2 }, t + 0.5, 0.3);
      t += 1;
    }
  });
  
  // B→D 通过 A 可以更新
  const newDist_BD = 4 + 7; // B→A→D = 4+7=11
  if (newDist_BD < dist['B']['D']) {
    dist['B']['D'] = newDist_BD;
    updateMatrixCell(matrix._cells, 'B', 'D', newDist_BD, t);
    t += 1;
  }
  
  tw(nodeA.circle, { fill: VISITED }, t, 0.5);
  
  const hint = T(p, '第一轮结束：部分距离通过 A 更新', {
    x: 800, y: 650, size: 20, fill: PRIMARY, anchor: 'middle', o: 0
  });
  tw(hint, { o: 1 }, t, 0.7);
}],

  const updates = [

    { i: 'A', j: 'D', old: 7, via: 4 + 3, update: false },

    tw(cell.rect, { stroke: PRIMARY, 'stroke-width': 3 }, t, 0.3);
    
    if (u.update && u.via < (u.old === Infinity ? Infinity : u.old)) {
      dist[u.i][u.j] = u.via;
      updateMatrixCell(matrix._cells, u.i, u.j, u.via, t + 0.5);
      t += 1.3;
    } else {
      tw(cell.rect, { fill: CELL_INIT }, t + 0.5, 0.3);
      tw(cell.rect, { stroke: '#bdc3c7', 'stroke-width': 2 }, t + 0.5, 0.3);
      t += 1;
    }
  });

  const hint = T(p, 'A→C 和 C→D 通过 B 找到路径', {

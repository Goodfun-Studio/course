/* ---------- 辅助函数 ---------- */
function drawArray(parent, arr, x, y, width = 40, height = 50, spacing = 5) {
  const g = G(parent, { x, y, o: 0 });
  arr.forEach((val, i) => {
    const barX = i * (width + spacing);
    mk('rect', { 
      x: barX, y: 0, width, height, 
      fill: PRIMARY, stroke: '#fff', 'stroke-width': 2 
    }, g);
    const t = T(g, String(val), { 
      x: barX + width / 2, y: height / 2, 
      size: 20, weight: 600, fill: '#fff', anchor: 'middle' 
    });
    t.setAttribute('dominant-baseline', 'central');
  });
  return g;
}

function drawTreeNode(parent, arr, x, y, level = 0) {
  const g = G(parent, { x, y, o: 0 });
  const colors = [PRIMARY, SECONDARY, LEFT_COLOR, RIGHT_COLOR];
  const color = colors[level % colors.length];
  
  mk('rect', { 
    x: -60, y: -20, width: 120, height: 40, 
    fill: color, stroke: '#fff', 'stroke-width': 2, rx: 5 
  }, g);
  
  T(g, arr.join(','), { 
    x: 0, y: 0, 
    size: 16, weight: 600, fill: '#fff', anchor: 'middle' 
  }).setAttribute('dominant-baseline', 'central');
  
  return g;
}

function drawArrow(parent, x1, y1, x2, y2, color = PRIMARY) {
  const g = G(parent, { o: 0 });
  const dx = x2 - x1, dy = y2 - y1;
  const angle = Math.atan2(dy, dx);
  
  mk('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': 2 }, g);
  
  const arrowSize = 8;
  const x3 = x2 - arrowSize * Math.cos(angle - Math.PI / 6);
  const y3 = y2 - arrowSize * Math.sin(angle - Math.PI / 6);
  const x4 = x2 - arrowSize * Math.cos(angle + Math.PI / 6);
  const y4 = y2 - arrowSize * Math.sin(angle + Math.PI / 6);
  
  mk('line', { x1: x2, y1: y2, x2: x3, y2: y3, stroke: color, 'stroke-width': 2 }, g);
  mk('line', { x1: x2, y1: y2, x2: x4, y2: y4, stroke: color, 'stroke-width': 2 }, g);
  
  return g;
}

/* ---------- 辅助函数 ---------- */
function drawArrayElement(parent, value, x, y, width = 55, height = 55) {
  const g = G(parent, { x, y, o: 0 });
  
  const rect = mk('rect', { 
    x: 0, y: 0, width, height, 
    fill: PRIMARY, stroke: '#fff', 'stroke-width': 2, rx: 4 
  }, g);
  
  const text = T(g, String(value), { 
    x: width / 2, y: height / 2, 
    size: 20, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, rect, text };
}

function drawPointer(parent, label, x, y, color = HIGHLIGHT) {
  const g = G(parent, { x, y, o: 0 });
  
  // 箭头
  const arrowY = -15;
  mk('polygon', {
    points: `0,${arrowY} -8,${arrowY - 12} 8,${arrowY - 12}`,
    fill: color
  }, g);
  
  // 标签
  T(g, label, {
    x: 0, y: arrowY - 25,
    size: 18, weight: 600, fill: color, anchor: 'middle'
  });
  
  return g;
}

// beat 4: algorithm
['algorithm', '算法实现', () => {
  const p = panel(0);
  
  const title = T(p, '算法实现', { x: 800, y: 80, size: 44, weight: 600, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.5);
  
  const code = [
    'def binary_search(arr, target):',
    '    left, right = 0, len(arr) - 1',
    '    ',
    '    while left <= right:',
    '        mid = left + (right - left) // 2',
    '        ',
    '        if arr[mid] == target:',
    '            return mid',
    '        elif arr[mid] < target:',
    '            left = mid + 1',
    '        else:',
    '            right = mid - 1',
    '    ',
    '    return -1  # 未找到'
  ];
  
  const codeGroup = G(p, { x: 200, y: 150, o: 0 });
  code.forEach((line, i) => {
    let color = '#fff';
    if (line.includes('left') || line.includes('right') || line.includes('mid')) color = HIGHLIGHT;
    if (line.includes('return')) color = SECONDARY;
    if (line.includes('if') || line.includes('while')) color = PRIMARY;
    
    T(codeGroup, line, {
      x: 0, y: i * 32,
      size: 20, fill: color, family: 'Monaco, monospace'
    });
  });

    { text: '② left ≤ right 保证闭区间', y: 210, time: 13.0 },

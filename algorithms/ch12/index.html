/* ---------- 颜色方案 ---------- */
const PRIMARY = '#3498db';           // 主蓝色
const HEAPIFYING = '#f39c12';        // 橙色（正在堆化）
const COMPARING = '#3498db';         // 蓝色（比较中）
const SWAPPING = '#e74c3c';          // 红色（交换）
const SORTED = '#2ecc71';            // 绿色（已排序）
const NORMAL = '#95a5a6';            // 灰色（普通节点）
const HIGHLIGHT = '#f39c12';         // 高亮色
const DIM = '#95a5a6';               // 次要文字

/* ---------- 辅助函数 ---------- */
// 绘制树节点
function drawTreeNode(parent, value, x, y, r = 28, color = NORMAL) {
  const g = G(parent, { x, y, o: 0 });
  
  const circle = mk('circle', { 
    cx: 0, cy: 0, r, 
    fill: color, stroke: '#fff', 'stroke-width': 2.5 
  }, g);
  
  const text = T(g, String(value), { 
    x: 0, y: 0, 
    size: 20, weight: 700, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, circle, text };
}

// 绘制树的连线
function drawTreeEdge(parent, x1, y1, x2, y2, color = '#ddd') {
  return mk('line', {
    x1, y1, x2, y2,
    stroke: color, 'stroke-width': 2.5
  }, parent);
}

// 绘制数组元素
function drawArrayElement(parent, value, x, y, width = 50, height = 50) {
  const g = G(parent, { x, y, o: 0 });
  
  const rect = mk('rect', { 
    x: 0, y: 0, width, height, 
    fill: PRIMARY, stroke: '#fff', 'stroke-width': 2, rx: 4 
  }, g);
  
  const text = T(g, String(value), { 
    x: width / 2, y: height / 2, 
    size: 18, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, rect, text };
}

    # 构建最大堆
    for i in range(n//2 - 1, -1, -1):

const DONE_DARK = '#27ae60';       // 深绿（用于白背景文字）

/* ---------- 辅助函数 ---------- */
// 绘制图节点
function drawGraphNode(parent, label, x, y, r = 32, color = PENDING) {
  const g = G(parent, { x, y });
  
  const circle = mk('circle', { 
    cx: 0, cy: 0, r, 
    fill: color, stroke: '#fff', 'stroke-width': 2.5 
  }, g);
  
  const text = T(g, label, { 
    x: 0, y: 0, 
    size: 18, weight: 700, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, circle, text };
}

// 绘制有向边（带箭头）
function drawDirectedEdge(parent, x1, y1, x2, y2, color = EDGE_ACTIVE) {
  const g = G(parent, {});
  
  // 计算方向
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len;
  const uy = dy / len;
  
  // 缩短边，不覆盖节点（半径 32）
  const startX = x1 + ux * 35;
  const startY = y1 + uy * 35;
  const endX = x2 - ux * 35;
  const endY = y2 - uy * 35;
  
  const line = mk('line', {
    x1: startX, y1: startY, x2: endX, y2: endY,
    stroke: color, 'stroke-width': 2.5
  }, g);
  
  // 箭头
  const arrowSize = 10;
  const arrowX = endX - ux * arrowSize;
  const arrowY = endY - uy * arrowSize;
  const perpX = -uy * arrowSize * 0.4;
  const perpY = ux * arrowSize * 0.4;
  
  const arrow = mk('polygon', {
    points: `${endX},${endY} ${arrowX + perpX},${arrowY + perpY} ${arrowX - perpX},${arrowY - perpY}`,
    fill: color
  }, g);
  
  return { g, line, arrow };
}

// 绘制入度标签
function drawDegreeLabel(parent, degree, x, y) {
  const g = G(parent, { x, y });
  
  mk('rect', {
    x: -18, y: -15, width: 36, height: 30,
    fill: '#fff', stroke: PENDING, 'stroke-width': 2, rx: 4
  }, g);
  
  const text = T(g, String(degree), {
    x: 0, y: 0, size: 16, weight: 700, fill: PENDING, anchor: 'middle'
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, text };
}

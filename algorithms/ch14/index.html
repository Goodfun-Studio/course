['dp-demo', 'DP表格填充演示', () => {
  const p = panel(0);
  
  const title = T(p, 'DP 表格填充过程', { x: 800, y: 80, size: 46, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  // Items data
  const items = [
    { id: 1, weight: 2, value: 3 },
    { id: 2, weight: 3, value: 4 },
    { id: 3, weight: 4, value: 5 },
    { id: 4, weight: 5, value: 6 }
  ];
  const W = 7;
  
  // Display items
  const itemsTitle = T(p, '物品列表：', { x: 200, y: 140, size: 24, fill: COL.dim, o: 0 });
  tw(itemsTitle, { o: 1 }, 1, 0.4);
  
  items.forEach((item, i) => {
    const y = 170 + i * 30;
    const text = T(p, `物品${item.id}: w=${item.weight}, v=${item.value}`, { 
      x: 200, y, size: 20, fill: COL.chalk, o: 0 
    });
    tw(text, { o: 1 }, 1.5 + i * 0.3, 0.4);
  });
  
  // DP table
  const cellSize = 50;
  const tableX = 150;
  const tableY = 300;
  
  // Column headers (capacity 0-7)
  for (let w = 0; w <= W; w++) {
    const x = tableX + (w + 1) * cellSize + cellSize / 2;
    const header = T(p, w.toString(), { 
      x, y: tableY + 25, size: 18, fill: COL.dim, anchor: 'middle', baseline: 'middle', o: 0 
    });
    tw(header, { o: 1 }, 2, 0.4);
  }
  
  // Row headers (items 0-4)
  for (let i = 0; i <= 4; i++) {
    const y = tableY + (i + 1) * cellSize + cellSize / 2;
    const label = i === 0 ? '0' : `${i}`;
    const header = T(p, label, { 
      x: tableX + 25, y, size: 18, fill: COL.dim, anchor: 'middle', baseline: 'middle', o: 0 
    });
    tw(header, { o: 1 }, 2, 0.4);
  }
  
  // Create DP table
  const dp = Array(5).fill(0).map(() => Array(8).fill(0));
  const cells = {};
  const cellTexts = {};
  
  // Draw all cells (empty initially)
  for (let i = 0; i <= 4; i++) {
    for (let w = 0; w <= W; w++) {
      const x = tableX + (w + 1) * cellSize;
      const y = tableY + (i + 1) * cellSize;
      
      const cell = mk('rect', {
        x, y, width: cellSize, height: cellSize,
        fill: EMPTY, stroke: '#bdc3c7', 'stroke-width': 1, o: 0
      }, p);
      tw(cell, { o: 1 }, 2.5, 0.3);
      
      cells[`${i}-${w}`] = cell;
      
      const text = T(p, '0', {
        x: x + cellSize / 2, y: y + cellSize / 2,
        size: 18, fill: '#7f8c8d', anchor: 'middle', baseline: 'middle', o: 0
      });
      cellTexts[`${i}-${w}`] = text;
    }
  }
  
  // Fill first row (i=0, all zeros)
  for (let w = 0; w <= W; w++) {
    tw(cells[`0-${w}`], { fill: FILLED }, 3 + w * 0.1, 0.2);
    tw(cellTexts[`0-${w}`], { o: 1 }, 3 + w * 0.1, 0.2);
  }
  
  // Animate filling process for rows 1-2
  let time = 4.5;
  
  for (let i = 1; i <= 2; i++) {
    const item = items[i - 1];
    
    for (let w = 0; w <= W; w++) {
      // Calculate dp value
      let notTake = dp[i - 1][w];
      let take = 0;
      if (w >= item.weight) {
        take = dp[i - 1][w - item.weight] + item.value;
      }
      dp[i][w] = Math.max(notTake, take);
      
      // Highlight current cell
      tw(cells[`${i}-${w}`], { fill: CURRENT }, time, 0.2);
      
      // Show dependencies
      if (i > 0) {
        tw(cells[`${i-1}-${w}`], { fill: DEPEND }, time + 0.2, 0.2);
      }
      if (w >= item.weight) {
        tw(cells[`${i-1}-${w-item.weight}`], { fill: DEPEND }, time + 0.3, 0.2);
      }
      
      // Update value
      cellTexts[`${i}-${w}`].textContent = dp[i][w].toString();
      tw(cellTexts[`${i}-${w}`], { o: 1, fill: '#2c3e50' }, time + 0.4, 0.2);
      
      // Mark as filled
      tw(cells[`${i}-${w}`], { fill: FILLED }, time + 0.6, 0.2);
      
      // Reset dependencies
      if (i > 0) {
        tw(cells[`${i-1}-${w}`], { fill: FILLED }, time + 0.7, 0.2);
      }
      if (w >= item.weight) {
        tw(cells[`${i-1}-${w-item.weight}`], { fill: FILLED }, time + 0.7, 0.2);
      }
      
      time += 0.5;
    }
  }
  
  // Fill remaining rows quickly
  for (let i = 3; i <= 4; i++) {
    const item = items[i - 1];
    for (let w = 0; w <= W; w++) {
      let notTake = dp[i - 1][w];
      let take = 0;
      if (w >= item.weight) {
        take = dp[i - 1][w - item.weight] + item.value;
      }
      dp[i][w] = Math.max(notTake, take);
      
      cellTexts[`${i}-${w}`].textContent = dp[i][w].toString();
      tw(cellTexts[`${i}-${w}`], { o: 1, fill: '#2c3e50' }, time, 0.2);
      tw(cells[`${i}-${w}`], { fill: FILLED }, time, 0.2);
      
      time += 0.05;
    }
  }
  
  // Highlight final answer
  tw(cells[`4-${W}`], { fill: SELECTED }, time + 0.5, 0.3);
  
  const result = T(p, `最大价值：${dp[4][W]}`, { 
    x: 800, y: 700, size: 36, fill: SELECTED, anchor: 'middle', o: 0 
  });
  tw(result, { o: 1 }, time + 1, 0.5);
}],

['implementation', '算法实现', () => {
  const p = panel(0);
  
  const title = T(p, '代码实现', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const code = `def knapsack_01(weights, values, W):
    n = len(weights)
    dp = [[0] * (W + 1) for _ in range(n + 1)]
    
    for i in range(1, n + 1):
        for w in range(W + 1):
            # 不选第i个物品
            dp[i][w] = dp[i-1][w]
            
            # 如果能装下，考虑选第i个物品
            if w >= weights[i-1]:
                dp[i][w] = max(
                    dp[i][w],
                    dp[i-1][w - weights[i-1]] + values[i-1]
                )
    
    return dp[n][W]`;
  
  const codeLines = code.split('\n');
  codeLines.forEach((line, i) => {
    const y = 180 + i * 28;
    const text = T(p, line, { x: 300, y, size: 20, fill: COL.chalk, font: 'monospace', o: 0 });
    tw(text, { o: 1 }, 1 + i * 0.2, 0.3);
  });
  
  const complexity = T(p, '时间复杂度：O(n·W)', { x: 400, y: 640, size: 30, fill: CURRENT, o: 0 });
  tw(complexity, { o: 1 }, 8, 0.5);
  
  const space = T(p, '空间复杂度：O(n·W)', { x: 400, y: 700, size: 30, fill: DEPEND, o: 0 });
  tw(space, { o: 1 }, 9.5, 0.5);
}],

['space-opt', '空间优化', () => {
  const p = panel(0);
  
  const title = T(p, '空间优化', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const observation = T(p, '观察：dp[i][w] 只依赖 dp[i-1][...]', { x: 400, y: 180, size: 30, fill: COL.chalk, o: 0 });
  tw(observation, { o: 1 }, 1.5, 0.5);
  
  const idea = T(p, '优化：使用滚动数组，空间降到 O(W)', { x: 400, y: 240, size: 30, fill: FILLED, o: 0 });
  tw(idea, { o: 1 }, 3, 0.5);
  
  const key = T(p, '关键：内层循环必须逆序！', { x: 400, y: 310, size: 32, fill: CURRENT, o: 0 });
  tw(key, { o: 1 }, 5, 0.6);
  
  const code = `def knapsack_01_optimized(weights, values, W):
    dp = [0] * (W + 1)
    
    for i in range(len(weights)):
        for w in range(W, weights[i]-1, -1):  # 逆序！
            dp[w] = max(
                dp[w],
                dp[w-weights[i]] + values[i]
            )
    
    return dp[W]`;
  
  const codeLines = code.split('\n');
  codeLines.forEach((line, i) => {
    const y = 380 + i * 28;
    const text = T(p, line, { x: 300, y, size: 20, fill: COL.chalk, font: 'monospace', o: 0 });
    tw(text, { o: 1 }, 6 + i * 0.2, 0.3);
  });
  
  const why = T(p, '为什么逆序？避免同一轮重复使用', { x: 800, y: 670, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(why, { o: 1 }, 11, 0.5);
}],

['backtrack', '回溯路径', () => {
  const p = panel(0);
  
  const title = T(p, '找出选了哪些物品', { x: 800, y: 100, size: 48, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const method = T(p, '从 dp[n][W] 开始回溯：', { x: 400, y: 190, size: 32, fill: COL.chalk, o: 0 });
  tw(method, { o: 1 }, 1.5, 0.5);
  
  const step1 = T(p, '如果 dp[i][w] ≠ dp[i-1][w]：', { x: 450, y: 260, size: 28, fill: CURRENT, o: 0 });
  tw(step1, { o: 1 }, 3, 0.5);
  
  const step1b = T(p, '  → 说明选了第 i 个物品', { x: 500, y: 310, size: 26, fill: FILLED, o: 0 });
  tw(step1b, { o: 1 }, 4, 0.4);
  
  const step2 = T(p, '容量减去 weight[i]，继续往前', { x: 450, y: 370, size: 28, fill: DEPEND, o: 0 });
  tw(step2, { o: 1 }, 5.5, 0.5);
  
  const code = `def find_items(dp, weights, values, W):
    n = len(weights)
    w = W
    items = []
    
    for i in range(n, 0, -1):
        if dp[i][w] != dp[i-1][w]:  # 选了第i个
            items.append(i-1)
            w -= weights[i-1]
    
    return items[::-1]  # 反转得到正序`;
  
  const codeLines = code.split('\n');
  codeLines.forEach((line, i) => {
    const y = 440 + i * 26;
    const text = T(p, line, { x: 300, y, size: 19, fill: COL.chalk, font: 'monospace', o: 0 });
    tw(text, { o: 1 }, 7 + i * 0.2, 0.3);
  });
  
  const note = T(p, '这样就能输出完整的选择方案', { x: 800, y: 700, size: 30, fill: '#43e97b', anchor: 'middle', o: 0 });
  tw(note, { o: 1 }, 12, 0.5);
}],

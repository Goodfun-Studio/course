<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>广度优先搜索：BFS</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/math.js"></script>
<script src="audio/zh/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 15, title: '广度优先搜索：BFS', language: 'zh', minutes: 12 };

/* ---------- colours ---------- */
const UNVISITED = '#95a5a6';   // 灰色（未访问）
const CURRENT = '#f39c12';     // 橙色（当前处理）
const VISITED = '#2ecc71';     // 绿色（已访问）
const QUEUED = '#3498db';      // 蓝色（在队列中）
const PATH = '#e74c3c';        // 红色（路径标记）

/* ---------- beats ---------- */
let BEATS = [

['intro', '问题引入', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, '广度优先搜索', { x: 800, y: 100, size: 64, weight: 700, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  const subtitle = T(p, 'BFS - Breadth-First Search', { x: 800, y: 170, size: 32, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(subtitle, { o: 1 }, 0.5, 0.5);
  
  const t_bfs = m('bfs');
  
  const t_social = m('social');
  const scenario1 = T(p, '社交网络：找到你的二度好友', { x: 400, y: 260, size: 30, fill: COL.chalk, o: 0 });
  tw(scenario1, { o: 1 }, t_social, 0.5);
  
  const t_map = m('map');
  const scenario2 = T(p, '地图导航：找到最短路径', { x: 400, y: 330, size: 30, fill: COL.chalk, o: 0 });
  tw(scenario2, { o: 1 }, t_map, 0.5);
  
  const t_game = m('game');
  const scenario3 = T(p, '走迷宫：最少步数', { x: 400, y: 400, size: 30, fill: COL.chalk, o: 0 });
  tw(scenario3, { o: 1 }, t_game, 0.5);
  
  const t_core = m('core');
  const core = T(p, '核心问题：如何逐层遍历图的节点？', { x: 800, y: 520, size: 36, fill: VISITED, anchor: 'middle', o: 0 });
  tw(core, { o: 1 }, t_core, 0.7);
  
  // Wave effect illustration - extended to fill remaining time
  const center = { x: 800, y: 650 };
  for (let i = 0; i < 4; i++) {
    const circle = mk('circle', { 
      cx: center.x, cy: center.y, r: 40 + i * 30, 
      fill: 'none', stroke: QUEUED, 'stroke-width': 2, o: 0 
    }, p);
    tw(circle, { o: 0.6 }, t_core + 1 + i * 0.5, 0.6);
    tw(circle, { o: 0.3 }, t_core + 4 + i * 0.5, 0.6);
  }
  
  // Add pulsing effect to keep animation active until end
  tw(core, { s: 1.05 }, dur - 2, 1.0);
  tw(core, { s: 1.0 }, dur - 1, 1.0);
}],

['bfs-concept', 'BFS 核心思想', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, '层级遍历', { x: 800, y: 100, size: 56, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  const t_wave = m('wave');
  const concept = T(p, '像水波一样，一圈圈向外扩散', { x: 800, y: 190, size: 32, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(concept, { o: 1 }, t_wave, 0.6);
  
  // Center point
  const origin = mk('circle', { cx: 800, cy: 380, r: 15, fill: CURRENT, o: 0 }, p);
  tw(origin, { o: 1 }, t_wave + 0.5, 0.5);
  const originLabel = T(p, '起点', { x: 800, y: 350, size: 24, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(originLabel, { o: 1 }, t_wave + 0.5, 0.5);
  
  // Layer 1
  const t_first = m('first');
  const layer1Label = T(p, '第一层：邻居', { x: 400, y: 460, size: 28, fill: QUEUED, o: 0 });
  tw(layer1Label, { o: 1 }, t_first, 0.5);
  for (let i = 0; i < 4; i++) {
    const angle = i * Math.PI / 2;
    const x = 800 + Math.cos(angle) * 120;
    const y = 380 + Math.sin(angle) * 120;
    const node = mk('circle', { cx: x, cy: y, r: 12, fill: QUEUED, o: 0 }, p);
    tw(node, { o: 1 }, t_first + 0.3 + i * 0.1, 0.4);
  }
  
  // Layer 2
  const t_second = m('second');
  const layer2Label = T(p, '第二层：邻居的邻居', { x: 400, y: 530, size: 28, fill: VISITED, o: 0 });
  tw(layer2Label, { o: 1 }, t_second, 0.5);
  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI / 4;
    const x = 800 + Math.cos(angle) * 200;
    const y = 380 + Math.sin(angle) * 200;
    const node = mk('circle', { cx: x, cy: y, r: 10, fill: VISITED, o: 0 }, p);
    tw(node, { o: 1 }, t_second + 0.3 + i * 0.08, 0.4);
  }
  
  const t_level = m('level');
  const key = T(p, '同一层的节点，距离起点的步数相同', { x: 800, y: 680, size: 30, fill: PATH, anchor: 'middle', o: 0 });
  tw(key, { o: 1 }, t_level, 0.7);
  
  // Add subtle animations to extend to end
  tw(key, { s: 1.05 }, t_level + 5, 1.5);
  tw(key, { s: 1.0 }, t_level + 7, 1.5);
}],

['queue-structure', '队列：先进先出', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'Queue - 队列', { x: 800, y: 100, size: 56, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  const t_fifo = m('fifo');
  const fifo = T(p, 'FIFO: First In First Out', { x: 800, y: 180, size: 32, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(fifo, { o: 1 }, t_fifo, 0.5);
  
  const t_why = m('why');
  const why = T(p, '为什么用队列？', { x: 400, y: 260, size: 34, fill: CURRENT, o: 0 });
  tw(why, { o: 1 }, t_why, 0.5);
  
  const t_process = m('process');
  const reason = T(p, '→ 按发现顺序访问，保证层级顺序', { x: 450, y: 320, size: 28, fill: COL.chalk, o: 0 });
  tw(reason, { o: 1 }, t_process, 0.6);
  
  // Queue visualization
  const queueY = 450;
  const queueLabel = T(p, '队列操作：', { x: 400, y: queueY - 30, size: 28, fill: COL.chalk, o: 0 });
  tw(queueLabel, { o: 1 }, t_process + 1, 0.5);
  
  // Initial queue
  const items = ['A', 'B', 'C', 'D'];
  const boxes = [];
  for (let i = 0; i < items.length; i++) {
    const x = 500 + i * 90;
    const box = mk('rect', { x: x, y: queueY, width: 70, height: 70, rx: 5, fill: QUEUED, o: 0 }, p);
    tw(box, { o: 0.8 }, t_process + 1.5 + i * 0.15, 0.4);
    boxes.push(box);
    const label = T(p, items[i], { x: x + 35, y: queueY + 45, size: 32, fill: 'white', anchor: 'middle', o: 0 });
    tw(label, { o: 1 }, t_process + 1.5 + i * 0.15, 0.4);
  }
  
  // Enqueue arrow（队尾在右端，新元素从右侧向左进入队列）
  const t_enqueue = m('enqueue');
  const enqueueArrow = T(p, '← 入队（enqueue）', { x: 860, y: queueY + 45, size: 24, fill: VISITED, anchor: 'start', o: 0 });
  tw(enqueueArrow, { o: 1 }, t_enqueue, 0.5);
  
  // Dequeue arrow（队首在左端，元素向左离开队列）
  const t_dequeue = m('dequeue');
  const dequeueArrow = T(p, '← 出队（dequeue）', { x: 485, y: queueY + 45, size: 24, fill: PATH, anchor: 'end', o: 0 });
  tw(dequeueArrow, { o: 1 }, t_dequeue, 0.5);
  
  const t_order = m('order');
  const contrast = T(p, 'BFS 用队列 ≠ DFS 用栈', { x: 800, y: 620, size: 30, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(contrast, { o: 1 }, t_order, 0.6);
  
  // Add pulse animations to queue boxes to extend duration
  boxes.forEach((box, i) => {
    tw(box, { s: 1.1 }, t_order + 2 + i * 0.3, 0.4);
    tw(box, { s: 1.0 }, t_order + 2.5 + i * 0.3, 0.4);
  });
}],

['algorithm-steps', '算法步骤', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'BFS 算法步骤', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  const steps = [
    { text: '1. 起点加入队列，标记为已访问', mark: 'start' },
    { text: '2. 当队列不为空时，循环执行', mark: 'loop' },
    { text: '3. 从队列头部取出一个节点', mark: 'pop' },
    { text: '4. 处理这个节点（记录/输出）', mark: 'visit' },
    { text: '5. 访问它的所有邻居节点', mark: 'neighbors' },
    { text: '6. 未访问的邻居：标记 + 入队', mark: 'check' },
    { text: '7. 重复直到队列为空', mark: 'repeat' }
  ];
  
  let currentY = 220;
  steps.forEach((step, i) => {
    const t = m(step.mark);
    const text = T(p, step.text, { x: 400, y: currentY, size: 30, fill: COL.chalk, o: 0 });
    tw(text, { o: 1 }, t, 0.5);
    currentY += 70;
  });
  
  const t_done = m('done');
  const conclusion = T(p, '队列为空 → 所有可达节点已访问', { x: 800, y: 680, size: 32, fill: VISITED, anchor: 'middle', o: 0 });
  tw(conclusion, { o: 1 }, t_done, 0.7);
}],

['bfs-demo', 'BFS 演示动画', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'BFS 遍历演示', { x: 800, y: 80, size: 48, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  // Graph structure: tree with 7 nodes
  const nodes = {
    'A': { x: 800, y: 180 },
    'B': { x: 600, y: 300 },
    'C': { x: 1000, y: 300 },
    'D': { x: 500, y: 420 },
    'E': { x: 700, y: 420 },
    'F': { x: 900, y: 420 },
    'G': { x: 1100, y: 420 }
  };
  
  const edges = [
    ['A', 'B'], ['A', 'C'],
    ['B', 'D'], ['B', 'E'],
    ['C', 'F'], ['C', 'G']
  ];
  
  // Draw graph at the [[graph]] narration mark
  const tg = m('graph');
  edges.forEach(([from, to]) => {
    const line = mk('line', {
      x1: nodes[from].x, y1: nodes[from].y,
      x2: nodes[to].x, y2: nodes[to].y,
      stroke: COL.dim, 'stroke-width': 2, o: 0
    }, p);
    tw(line, { o: 0.4 }, tg, 0.5);
  });
  
  const nodeElements = {};
  Object.entries(nodes).forEach(([id, pos]) => {
    const circle = mk('circle', {
      cx: pos.x, cy: pos.y, r: 30,
      fill: UNVISITED, stroke: COL.dim, 'stroke-width': 2, o: 0
    }, p);
    tw(circle, { o: 1 }, tg + 0.6, 0.5);
    nodeElements[id] = circle;
    const label = T(p, id, {
      x: pos.x, y: pos.y + 8, size: 28, weight: 700,
      fill: 'white', anchor: 'middle', o: 0
    });
    tw(label, { o: 1 }, tg + 0.6, 0.5);
  });
  
  // Queue + result UI
  const queueY = 530;
  const queueLabel = T(p, '队列：', { x: 300, y: queueY, size: 26, fill: COL.chalk, o: 0 });
  tw(queueLabel, { o: 1 }, tg + 1, 0.5);
  const queueBox = mk('rect', {
    x: 380, y: queueY - 25, width: 840, height: 50,
    rx: 8, fill: 'none', stroke: COL.dim, 'stroke-width': 2, o: 0
  }, p);
  tw(queueBox, { o: 0.5 }, tg + 1, 0.5);
  
  const resultY = 610;
  const resultLabel = T(p, '遍历顺序：', { x: 300, y: resultY, size: 26, fill: COL.chalk, o: 0 });
  tw(resultLabel, { o: 1 }, tg + 1, 0.5);
  
  let queueState = [];
  let resultState = [];
  const queueTexts = [];
  const resultTexts = [];
  
  function updateQueue(t) {
    queueTexts.forEach(el => hide(el, t));
    queueTexts.length = 0;
    queueState.forEach((node, i) => {
      const text = T(p, node, {
        x: 420 + i * 80, y: queueY + 5, size: 28,
        fill: QUEUED, anchor: 'middle', weight: 700, o: 0
      });
      tw(text, { o: 1 }, t, 0.3);
      queueTexts.push(text);
    });
  }
  
  function updateResult(t) {
    const text = T(p, resultState.join(' → '), {
      x: 480, y: resultY, size: 28, fill: VISITED, weight: 600, o: 0
    });
    tw(text, { o: 1 }, t, 0.4);
    resultTexts.push(text);
  }
  
  // Node pulse: big for "process/visit", small for "enter queue"
  function pulse(el, t, big) {
    tw(el, { s: big ? 1.2 : 1.15 }, t, 0.4);
    tw(el, { s: 1.0 }, t + 0.45, 0.3);
  }
  
  // Dequeue: node leaves the queue (queue display updates immediately)
  function dequeueNode(name, t) {
    queueState = queueState.filter(n => n !== name);
    updateQueue(t);
  }
  
  // Enqueue: node enters the queue (colour + pulse + queue text, all at t)
  function enqueueNode(name, t) {
    queueState.push(name);
    tw(nodeElements[name], { fill: QUEUED }, t, 0.4);
    pulse(nodeElements[name], t, false);
    updateQueue(t);
  }
  
  // Visit complete: node turns green + pulse + joins the traversal order (all at t)
  function visitNode(name, t) {
    tw(nodeElements[name], { fill: VISITED }, t, 0.5);
    pulse(nodeElements[name], t, true);
    resultState.push(name);
    resultTexts.forEach(el => hide(el, t));
    updateResult(t);
  }
  
  // Highlight the edge being followed
  function flashEdge(from, to, t) {
    const e = mk('line', {
      x1: nodes[from].x, y1: nodes[from].y,
      x2: nodes[to].x, y2: nodes[to].y,
      stroke: CURRENT, 'stroke-width': 4, o: 0
    }, p);
    tw(e, { o: 1 }, t, 0.4);
    tw(e, { o: 0 }, t + 1, 0.4);
  }
  
  // ---- Timeline driven by narration marks ----
  // [[init]] A 入队，标记为已访问。队列：A。
  const tInit = m('init');
  tw(nodeElements['A'], { fill: QUEUED }, tInit, 0.4);
  pulse(nodeElements['A'], tInit, false);
  queueState = ['A'];
  updateQueue(tInit);
  
  // [[step1]] 取出 A，处理它。访问 A 的邻居 B 和 C。
  const t1 = m('step1');
  dequeueNode('A', t1);
  tw(nodeElements['A'], { fill: CURRENT }, t1, 0.4);
  visitNode('A', t1 + 1.0);
  flashEdge('A', 'B', t1 + 1.7);
  flashEdge('A', 'C', t1 + 1.9);
  
  // [[queue1]] B 和 C 入队。队列变成：B、C。
  const tq1 = m('queue1');
  enqueueNode('B', tq1);
  enqueueNode('C', tq1 + 0.25);
  
  // [[step2]] 取出 B，处理它。访问 B 的邻居 D 和 E。
  const t2 = m('step2');
  dequeueNode('B', t2);
  tw(nodeElements['B'], { fill: CURRENT }, t2, 0.4);
  visitNode('B', t2 + 1.0);
  flashEdge('B', 'D', t2 + 1.7);
  flashEdge('B', 'E', t2 + 1.9);
  
  // [[queue2]] D 和 E 入队。队列变成：C、D、E。
  const tq2 = m('queue2');
  enqueueNode('D', tq2);
  enqueueNode('E', tq2 + 0.25);
  
  // [[step3]] 取出 C，处理它。访问 C 的邻居 F 和 G。
  const t3 = m('step3');
  dequeueNode('C', t3);
  tw(nodeElements['C'], { fill: CURRENT }, t3, 0.4);
  visitNode('C', t3 + 1.0);
  flashEdge('C', 'F', t3 + 1.7);
  flashEdge('C', 'G', t3 + 1.9);
  
  // [[queue3]] F 和 G 入队。队列变成：D、E、F、G。
  const tq3 = m('queue3');
  enqueueNode('F', tq3);
  enqueueNode('G', tq3 + 0.25);
  
  // [[step4]]~[[step7]] 依次取出 D、E、F、G，处理它们。
  ['D', 'E', 'F', 'G'].forEach((name, i) => {
    const t0 = m('step' + (4 + i));
    dequeueNode(name, t0);
    tw(nodeElements[name], { fill: CURRENT }, t0, 0.4);
    visitNode(name, t0 + 1.0);
  });
  
  // [[complete]] 队列为空，遍历完成。
  const complete = T(p, '✓ 队列为空，遍历完成', {
    x: 800, y: 690, size: 30, fill: VISITED, anchor: 'middle', weight: 600, o: 0
  });
  tw(complete, { o: 1 }, m('complete'), 0.7);
  
  // [[result]] 遍历顺序：A、B、C、D、E、F、G。
  const finalMsg = T(p, '遍历顺序：A → B → C → D → E → F → G', {
    x: 800, y: 740, size: 26, fill: CURRENT, anchor: 'middle', weight: 600, o: 0
  });
  tw(finalMsg, { o: 1 }, m('result'), 0.7);
  
  // Final layer-by-layer wave over all nodes
  const twv = m('result') + 1.2;
  ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach((name, i) => {
    tw(nodeElements[name], { s: 1.15 }, twv + i * 0.12, 0.3);
    tw(nodeElements[name], { s: 1.0 }, twv + i * 0.12 + 0.3, 0.3);
  });
}],

['shortest-path', '最短路径应用', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'BFS 找最短路径', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  const t_why = m('why');
  const why = T(p, '为什么 BFS 能找到最短路径？', { x: 400, y: 200, size: 32, fill: CURRENT, o: 0 });
  tw(why, { o: 1 }, t_why, 0.6);
  
  const reason = T(p, '→ 按层遍历，第一次访问即最短', { x: 450, y: 270, size: 28, fill: COL.chalk, o: 0 });
  tw(reason, { o: 1 }, t_why + 1, 0.6);
  
  const t_record = m('record');
  const method = T(p, '记录路径的方法：', { x: 400, y: 360, size: 32, fill: COL.chalk, o: 0 });
  tw(method, { o: 1 }, t_record, 0.5);
  
  const t_parent = m('parent');
  const step1 = T(p, '1. 用 parent 数组记录父节点', { x: 450, y: 430, size: 28, fill: QUEUED, o: 0 });
  tw(step1, { o: 1 }, t_parent, 0.5);
  
  const t_backtrack = m('backtrack');
  const step2 = T(p, '2. 找到目标后，回溯 parent', { x: 450, y: 490, size: 28, fill: QUEUED, o: 0 });
  tw(step2, { o: 1 }, t_backtrack, 0.5);
  
  const t_path = m('path');
  
  const t_reverse = m('reverse');
  const step3 = T(p, '3. 反转得到完整路径', { x: 450, y: 550, size: 28, fill: QUEUED, o: 0 });
  tw(step3, { o: 1 }, t_reverse, 0.5);
  
  const t_unweighted = m('unweighted');
  const note = T(p, '⚠ 仅对无权图有效', { x: 800, y: 640, size: 30, fill: PATH, anchor: 'middle', o: 0 });
  tw(note, { o: 1 }, t_unweighted, 0.6);
  
  const dijkstra = T(p, '有权图需要用 Dijkstra 算法', { x: 800, y: 700, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(dijkstra, { o: 1 }, t_unweighted + 1, 0.5);
}],

['bfs-vs-dfs', 'BFS vs DFS', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'BFS vs DFS', { x: 800, y: 100, size: 56, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.6, out);
  
  // Table headers
  const headerY = 200;
  const header0 = T(p, '特性', { x: 400, y: headerY, size: 30, fill: COL.dim, weight: 600, o: 0 });
  tw(header0, { o: 1 }, 0.5, 0.5);
  const bfsHeader = T(p, 'BFS', { x: 800, y: headerY, size: 30, fill: QUEUED, weight: 600, anchor: 'middle', o: 0 });
  tw(bfsHeader, { o: 1 }, 0.5, 0.5);
  const dfsHeader = T(p, 'DFS', { x: 1100, y: headerY, size: 30, fill: PATH, weight: 600, anchor: 'middle', o: 0 });
  tw(dfsHeader, { o: 1 }, 0.5, 0.5);
  
  const t_structure = m('structure');
  const featureText1 = T(p, '数据结构', { x: 400, y: 280, size: 28, fill: COL.chalk, o: 0 });
  tw(featureText1, { o: 1 }, t_structure, 0.5);
  const bfsText1 = T(p, '队列（Queue）', { x: 800, y: 280, size: 26, fill: QUEUED, anchor: 'middle', o: 0 });
  tw(bfsText1, { o: 1 }, t_structure + 0.3, 0.5);
  const dfsText1 = T(p, '栈/递归', { x: 1100, y: 280, size: 26, fill: PATH, anchor: 'middle', o: 0 });
  tw(dfsText1, { o: 1 }, t_structure + 0.3, 0.5);
  
  const t_order = m('order');

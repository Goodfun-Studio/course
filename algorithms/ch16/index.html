/* ---------- 颜色方案 ---------- */
const UNVISITED = '#95a5a6';    // 灰色（未访问）
const VISITING = '#f39c12';     // 橙色（正在访问）
const VISITED = '#2ecc71';      // 绿色（已访问）
const BACKTRACK = '#f1c40f';    // 黄色（回溯）
const EDGE_ACTIVE = '#e74c3c';  // 红色（正在遍历的边）
const STACK_BG = '#3498db';     // 蓝色（栈背景）
const TEXT_COLOR = '#2c3e50';   // 深色文字

/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, color = UNVISITED) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { cx: 0, cy: 0, r: 35, fill: color, stroke: TEXT_COLOR, 'stroke-width': 3 }, g);
  const text = T(g, label, { x: 0, y: 0, size: 28, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, color = TEXT_COLOR) {
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': 3,
    opacity: 0 
  }, parent);
  return line;
}

function drawStack(parent, x, y, width = 120, height = 60) {
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', {
    x: 0, y: 0,
    width, height,
    fill: STACK_BG,
    stroke: TEXT_COLOR,
    'stroke-width': 3,
    rx: 8
  }, g);
  return { g, rect };
}

['iterative', '迭代实现', (m, dur) => {
  const p = panel(0);

  const title = T(p, '迭代实现（显式栈）', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, 0);
  
  const code = `def dfs_iterative(graph, start):
    visited = set()
    stack = [start]
    result = []
    
    while stack:
        node = stack.pop()  # 出栈
        
        if node not in visited:
            visited.add(node)
            result.append(node)
            
            # 将未访问的邻居入栈
            for neighbor in reversed(graph[node]):
                if neighbor not in visited:
                    stack.append(neighbor)
    
    return result`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 80, y: 140 + i * 26, size: 18, fill: TEXT_COLOR, family: 'monospace', o: 0 
    });
    tw(text, { o: 1 }, m('stack') + i * 0.08);
  });
  
  const complexity = T(p, '时间复杂度：O(V + E)    空间复杂度：O(V)', { 
    x: 400, y: 560, size: 26, weight: 600, fill: EDGE_ACTIVE, anchor: 'middle', o: 0 
  });
  tw(complexity, { o: 1 }, m('complexity'));
}, { audio: 'iterative' }],

['path-finding', '应用：路径查找', (m, dur) => {
  const p = panel(0);

  const title = T(p, '应用：路径查找', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, 0);
  
  const code = `def find_path(graph, start, target, path=None):
    if path is None:
        path = []
    path.append(start)
    
    if start == target:
        return path
    
    for neighbor in graph[start]:
        if neighbor not in path:  # 避免环
            result = find_path(graph, neighbor, 
                             target, path.copy())
            if result:
                return result
    
    return None`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 80, y: 140 + i * 26, size: 18, fill: TEXT_COLOR, family: 'monospace', o: 0 
    });
    tw(text, { o: 1 }, m('record') + i * 0.06);
  });
  
  const note = T(p, '找到从起点到目标的一条路径（不一定最短）', { 
    x: 400, y: 540, size: 26, weight: 600, fill: VISITING, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, m('feasible'));
}, { audio: 'path-finding' }],

['cycle-detection', '应用：环检测', (m, dur) => {
  const p = panel(0);

  const title = T(p, '应用：环检测', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, 0);
  
  const code = `def has_cycle(graph):
    visited = set()
    rec_stack = set()  # 递归栈
    
    def dfs(node):
        visited.add(node)
        rec_stack.add(node)
        
        for neighbor in graph[node]:
            if neighbor not in visited:
                if dfs(neighbor):
                    return True
            elif neighbor in rec_stack:
                return True  # 发现环
        
        rec_stack.remove(node)
        return False
    
    for node in graph:
        if node not in visited:
            if dfs(node):
                return True
    return False`;
  
  const lines = code.split('\n');

    x: 400, y: 560, size: 26, weight: 600, fill: EDGE_ACTIVE, anchor: 'middle', o: 0

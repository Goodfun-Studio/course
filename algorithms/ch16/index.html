/* ---------- 颜色方案 ---------- */
const UNVISITED = '#95a5a6';    // 灰色（未访问）
const VISITING = '#f39c12';     // 橙色（正在访问）
const VISITED = '#2ecc71';      // 绿色（已访问）
const BACKTRACK = '#f1c40f';    // 黄色（回溯）
const EDGE_ACTIVE = '#e74c3c';  // 红色（正在遍历的边）
const STACK_BG = '#3498db';     // 蓝色（栈背景）
const TEXT_COLOR = '#2c3e50';   // 深色文字

/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, color = UNVISITED) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { cx: 0, cy: 0, r: 35, fill: color, stroke: TEXT_COLOR, 'stroke-width': 3 }, g);
  const text = T(g, label, { x: 0, y: 0, size: 28, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, color = TEXT_COLOR) {
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': 3,
    opacity: 0 
  }, parent);
  return line;
}

function drawStack(parent, x, y, width = 120, height = 60) {
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', {
    x: 0, y: 0,
    width, height,
    fill: STACK_BG,
    stroke: TEXT_COLOR,
    'stroke-width': 3,
    rx: 8
  }, g);
  return { g, rect };
}

['iterative', '迭代实现', () => {
  const p = panel(0);

  T(p, '迭代实现（显式栈）', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const code = `def dfs_iterative(graph, start):
    visited = set()
    stack = [start]
    result = []
    
    while stack:
        node = stack.pop()  # 出栈
        
        if node not in visited:
            visited.add(node)
            result.append(node)
            
            # 将未访问的邻居入栈
            for neighbor in reversed(graph[node]):
                if neighbor not in visited:
                    stack.append(neighbor)
    
    return result`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 80, y: 140 + i * 26, size: 18, fill: TEXT_COLOR, family: 'monospace', o: 0

  const code = `def find_path(graph, start, target, path=None):
    if path is None:
        path = []
    path.append(start)
    
    if start == target:
        return path
    
    for neighbor in graph[start]:
        if neighbor not in path:  # 避免环
            result = find_path(graph, neighbor,

            if result:

    return None`;

['cycle-detection', '应用：环检测', () => {
  const p = panel(0);

  T(p, '应用：环检测', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const code = `def has_cycle(graph):
    visited = set()
    rec_stack = set()  # 递归栈
    
    def dfs(node):
        visited.add(node)
        rec_stack.add(node)
        
        for neighbor in graph[node]:
            if neighbor not in visited:
                if dfs(neighbor):
                    return True
            elif neighbor in rec_stack:
                return True  # 发现环
        
        rec_stack.remove(node)
        return False
    
    for node in graph:
        if node not in visited:
            if dfs(node):
                return True
    return False`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 70, y: 130 + i * 22, size: 17, fill: TEXT_COLOR, family: 'monospace', o: 0 
    });
    tw(text, { o: 1 }, 0.15 + i * 0.08);

  const code = `def count_components(graph):
    visited = set()
    count = 0
    
    def dfs(node):
        visited.add(node)
        for neighbor in graph[node]:
            if neighbor not in visited:
                dfs(neighbor)
    
    for node in graph:
        if node not in visited:
            dfs(node)
            count += 1
    
    return count`;

  const note = T(p, '按完成时间降序 = 拓扑排序', { 
    x: 400, y: 520, size: 28, weight: 600, fill: EDGE_ACTIVE, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, 2.5);
}, { audio: 'timestamps' }],

['tree-traversal', '树的遍历', () => {
  const p = panel(0);

  T(p, '树的遍历（DFS 变体）', { x: 400, y: 100, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const traversals = [
    { name: '前序遍历（Pre-order）', order: '根 → 左 → 右', color: VISITING, y: 210 },
    { name: '中序遍历（In-order）', order: '左 → 根 → 右', color: STACK_BG, y: 310 },
    { name: '后序遍历（Post-order）', order: '左 → 右 → 根', color: BACKTRACK, y: 410 }
  ];
  
  traversals.forEach(({ name, order, color, y }, i) => {
    const box = mk('rect', { 
      x: 100, y: y - 40, width: 600, height: 80, 
      fill: color, opacity: 0.2, rx: 10, o: 0 
    }, p);
    tw(box, { o: 1 }, 0.5 + i * 0.5);
    
    const nameText = T(p, name, { 
      x: 120, y: y - 10, size: 32, weight: 700, fill: color, o: 0 
    });
    tw(nameText, { o: 1 }, 0.7 + i * 0.5);
    
    const orderText = T(p, order, { 
      x: 120, y: y + 20, size: 26, fill: TEXT_COLOR, o: 0 
    });
    tw(orderText, { o: 1 }, 0.9 + i * 0.5);
  });
  
  const note = T(p, '后序遍历 = DFS 完成时间顺序', { 
    x: 400, y: 540, size: 26, weight: 600, fill: EDGE_ACTIVE, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, 2.5);
}, { audio: 'tree-traversal' }],

['techniques', '实现技巧', () => {
  const p = panel(0);

  T(p, '实现技巧', { x: 400, y: 100, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const tips = [
    '递归 vs 迭代：递归更简洁，迭代更灵活',
    '避免重复访问：用 visited 集合',
    '检测环：用递归栈（rec_stack）',
    '记录路径：传递 path 参数或用 parent 字典',
    '限制深度：防止栈溢出'
  ];
  
  tips.forEach((tip, i) => {
    const bullet = T(p, '●', { 
      x: 100, y: 200 + i * 70, size: 32, fill: VISITING, o: 0 
    });
    tw(bullet, { o: 1 }, 0.5 + i * 0.3);
    
    const text = T(p, tip, { 
      x: 140, y: 200 + i * 70, size: 26, fill: TEXT_COLOR, o: 0 
    });
    tw(text, { o: 1 }, 0.7 + i * 0.3);
  });
}, { audio: 'techniques' }],

['finish', '总结', () => {
  const p = panel(0);

  T(p, '深度优先搜索（DFS）', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const applications = [
    '🔍 拼写检查：岛屿数量问题',
    '🧩 数独求解：回溯法（DFS + 剪枝）',
    '👑 N 皇后：回溯法（见第二章）',
    '🔗 括号生成：DFS 生成所有有效组合',
    '📊 拓扑排序：DFS 后序遍历的逆序',
    '🔄 强连通分量：Kosaraju 算法'
  ];
  
  applications.forEach((app, i) => {
    const text = T(p, app, { 
      x: 120, y: 180 + i * 55, size: 26, fill: TEXT_COLOR, o: 0 
    });
    tw(text, { o: 1 }, 0.5 + i * 0.25);
  });
  
  const summary = T(p, '核心思想：深入探索 + 回溯 + 记忆化', { 
    x: 400, y: 520, size: 30, weight: 700, fill: VISITING, anchor: 'middle', o: 0 
  });
  tw(summary, { o: 1 }, 3.0);
  
  const complexity = T(p, '时间：O(V + E)    空间：O(V)', { 
    x: 400, y: 570, size: 26, weight: 600, fill: EDGE_ACTIVE, anchor: 'middle', o: 0 
  });
  tw(complexity, { o: 1 }, 3.5);
}, { audio: 'finish' }]

];

BEATS = BEATS.map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
if (typeof module !== 'undefined') module.exports = { CHAPTER, BEATS };

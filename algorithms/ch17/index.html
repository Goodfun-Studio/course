<script>
'use strict';
const CHAPTER = { number: 17, title: 'KMP 字符串匹配算法', language: 'zh', minutes: 14 };

/* ---------- 颜色方案 ---------- */
const MATCH_COLOR = '#2ecc71';      // 绿色（匹配成功）
const MISMATCH_COLOR = '#e74c3c';   // 红色（失配）
const CURRENT_COLOR = '#f39c12';    // 橙色（当前比较）
const PATTERN_COLOR = '#3498db';    // 蓝色（模式串）
const TEXT_COLOR = '#2c3e50';       // 深色文字
const NEXT_BG = '#9b59b6';          // 紫色（next数组）
const POINTER_COLOR = '#e67e22';    // 深橙色（指针）
const BG_GRAY = '#ecf0f1';          // 浅灰背景

/* ---------- 辅助函数 ---------- */
function drawChar(parent, x, y, char, bgColor = BG_GRAY, textColor = TEXT_COLOR) {
  const g = G(parent, { x, y, o: 0 });
  const box = mk('rect', {
    x: -20, y: -20,
    width: 40, height: 40,
    fill: bgColor,
    stroke: TEXT_COLOR,
    'stroke-width': 2,
    rx: 4
  }, g);
  const text = T(g, char, { x: 0, y: 0, size: 24, weight: 700, fill: textColor, anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, box, text };
}

function drawPointer(parent, x, y, label, color = POINTER_COLOR) {
  const g = G(parent, { x, y, o: 0 });
  const line = mk('line', { x1: 0, y1: -15, x2: 0, y2: 0, stroke: color, 'stroke-width': 3 }, g);
  const circle = mk('circle', { cx: 0, cy: -15, r: 5, fill: color }, g);
  const text = T(g, label, { x: 0, y: -25, size: 20, weight: 600, fill: color, anchor: 'middle' });
  return { g, line, circle, text };
}

function drawNextArray(parent, x, y, values) {
  const cells = [];
  values.forEach((val, i) => {
    const cellX = x + i * 45;
    const g = G(parent, { x: cellX, y, o: 0 });
    const box = mk('rect', {
      x: -20, y: -20,
      width: 40, height: 40,
      fill: NEXT_BG,
      stroke: TEXT_COLOR,
      'stroke-width': 2,
      rx: 4
    }, g);
    const text = T(g, val.toString(), { x: 0, y: 0, size: 22, weight: 700, fill: '#fff', anchor: 'middle' });
    text.setAttribute('dominant-baseline', 'central');
    cells.push({ g, box, text });
  });
  return cells;
}

let BEATS = [

['next-intro', 'next 数组介绍', () => {
  const p = panel(0);

  T(p, 'next 数组（部分匹配表）', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const definition = G(p, { x: 400, y: 170, o: 0 });

  });

}, { audio: 'next-intro' }],

['next-build', 'next 数组构建动画', () => {
  const p = panel(0);

  T(p, '构建 next 数组', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const pattern = 'ABABCABAA';
  const next = [0, 0, 1, 2, 0, 1, 2, 3, 1];
  
  // 绘制模式串
  const patternY = 140;
  const patternChars = [];
  for (let i = 0; i < pattern.length; i++) {
    const char = drawChar(p, 100 + i * 45, patternY, pattern[i], PATTERN_COLOR, '#fff');
    tw(char.g, { o: 1 }, 0.3 + i * 0.05);
    patternChars.push(char);
  }
  
  // 索引
  for (let i = 0; i < pattern.length; i++) {
    T(p, i.toString(), { 
      x: 100 + i * 45, y: 190, size: 18, fill: TEXT_COLOR, anchor: 'middle', o: 0 
    });
  }
  
  // next 数组
  const nextY = 240;
  const nextCells = [];
  for (let i = 0; i < pattern.length; i++) {
    const cell = drawChar(p, 100 + i * 45, nextY, '', NEXT_BG, '#fff');
    tw(cell.g, { o: 1 }, 0.8);
    nextCells.push(cell);
  }
  
  // 指针
  const iPtr = drawPointer(p, 100, patternY + 60, 'i', CURRENT_COLOR);
  tw(iPtr.g, { o: 1 }, 1.0);
  const jPtr = drawPointer(p, 100, patternY - 60, 'j', POINTER_COLOR);
  tw(jPtr.g, { o: 1 }, 1.0);
  
  // 说明区域
  const explainY = 320;
  const explain = T(p, '', { x: 400, y: explainY, size: 22, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  
  let time = 1.5;
  const step = 0.6;
  
  // 逐步计算
  const steps = [
    { i: 0, j: 0, nextVal: 0, desc: 'next[0] = 0 (第一个字符没有前缀)' },
    { i: 1, j: 0, nextVal: 0, desc: 'A ≠ B，next[1] = 0' },
    { i: 2, j: 0, nextVal: 1, desc: 'A = A，next[2] = j + 1 = 1, j++' },
    { i: 3, j: 1, nextVal: 2, desc: 'B = B，next[3] = j + 1 = 2, j++' },
    { i: 4, j: 2, nextVal: 0, desc: 'A ≠ C，j 回退到 0，next[4] = 0' },
    { i: 5, j: 0, nextVal: 1, desc: 'A = A，next[5] = 1, j++' },
    { i: 6, j: 1, nextVal: 2, desc: 'B = B，next[6] = 2, j++' },
    { i: 7, j: 2, nextVal: 3, desc: 'A = A，next[7] = 3, j++' },
    { i: 8, j: 3, nextVal: 1, desc: 'B ≠ A，j 回退到 1，A = A，next[8] = 1' }
  ];
  
  steps.forEach(({ i, j, nextVal, desc }, idx) => {
    // 移动指针
    tw(iPtr.g, { x: 100 + i * 45 }, time);
    tw(jPtr.g, { x: 100 + j * 45 }, time);
    
    // 高亮当前比较的字符
    tw(patternChars[i].box, { fill: CURRENT_COLOR }, time);
    if (j < pattern.length) {
      tw(patternChars[j].box, { fill: CURRENT_COLOR }, time);
    }
    
    time += step * 0.5;
    
    // 更新 next 值
    nextCells[i].text.textContent = nextVal.toString();
    tw(nextCells[i].g, { o: 1 }, time);
    tw(nextCells[i].box, { fill: MATCH_COLOR }, time);
    
    // 更新说明
    explain.textContent = desc;
    tw(explain, { o: 1 }, time);
    
    time += step;
    
    // 恢复颜色
    tw(patternChars[i].box, { fill: PATTERN_COLOR }, time);
    if (j < pattern.length && j !== i) {
      tw(patternChars[j].box, { fill: PATTERN_COLOR }, time);
    }
    tw(nextCells[i].box, { fill: NEXT_BG }, time);
    
    time += step * 0.3;
  });
  
  // 最终结果
  const result = T(p, `next = [${next.join(', ')}]`, { 
    x: 400, y: 480, size: 26, weight: 600, fill: MATCH_COLOR, anchor: 'middle', o: 0 
  });
  tw(result, { o: 1 }, time);
}, { audio: 'next-build' }],

    tw(titleText, { o: 1 }, 0.8 + i * 0.5);
    
    const descText = T(p, desc, { x: 400, y: y + 22, size: 22, fill: '#fff', anchor: 'middle', o: 0 });

['matching-demo', 'KMP 匹配演示', () => {
  const p = panel(0);

  T(p, 'KMP 匹配演示', { x: 400, y: 50, size: 40, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const text = 'ABABDABACDABABCABAA';
  const pattern = 'ABABCABAA';
  const next = [0, 0, 1, 2, 0, 1, 2, 3, 1];
  
  // 绘制文本
  const textY = 130;
  T(p, '文本:', { x: 50, y: textY, size: 20, fill: TEXT_COLOR, anchor: 'end', o: 0 });
  const textChars = [];
  for (let i = 0; i < text.length; i++) {
    const char = drawChar(p, 70 + i * 28, textY, text[i], BG_GRAY, TEXT_COLOR);
    tw(char.g, { o: 1 }, 0.3 + i * 0.03);
    textChars.push(char);
  }
  
  // 绘制模式串
  const patternY = 210;
  T(p, '模式:', { x: 50, y: patternY, size: 20, fill: TEXT_COLOR, anchor: 'end', o: 0 });
  const patternChars = [];
  for (let i = 0; i < pattern.length; i++) {
    const char = drawChar(p, 70 + i * 28, patternY, pattern[i], PATTERN_COLOR, '#fff');
    tw(char.g, { o: 1 }, 0.8 + i * 0.03);
    patternChars.push(char);
  }
  
  // 指针
  const iPtr = drawPointer(p, 70, textY + 50, 'i', CURRENT_COLOR);
  tw(iPtr.g, { o: 1 }, 1.2);
  const jPtr = drawPointer(p, 70, patternY + 50, 'j', POINTER_COLOR);
  tw(jPtr.g, { o: 1 }, 1.2);
  
  // 说明
  const explain = T(p, '', { x: 400, y: 310, size: 20, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  
  let time = 1.5;
  const step = 0.5;
  
  // 匹配过程
  let i = 0, j = 0;
  let matchStart = -1;
  
  while (i < text.length && time < 30) {
    if (j < pattern.length && text[i] === pattern[j]) {
      // 匹配
      tw(iPtr.g, { x: 70 + i * 28 }, time);
      tw(jPtr.g, { x: 70 + j * 28 }, time);
      tw(textChars[i].box, { fill: MATCH_COLOR }, time);
      tw(patternChars[j].box, { fill: MATCH_COLOR }, time);
      
      explain.textContent = `匹配成功：${text[i]} = ${pattern[j]}`;
      tw(explain, { o: 1 }, time);
      
      if (j === 0) matchStart = i;
      i++;
      j++;
      time += step;
      
      if (j === pattern.length) {
        // 找到完整匹配
        explain.textContent = `找到匹配！位置 ${matchStart}`;
        tw(explain, { o: 1, fill: MATCH_COLOR }, time);
        time += step * 2;
        break;
      }
    } else {
      // 失配
      if (j > 0) {
        tw(iPtr.g, { x: 70 + i * 28 }, time);
        tw(jPtr.g, { x: 70 + j * 28 }, time);
        tw(textChars[i].box, { fill: MISMATCH_COLOR }, time);
        tw(patternChars[j].box, { fill: MISMATCH_COLOR }, time);
        
        explain.textContent = `失配：${text[i]} ≠ ${pattern[j]}，j 跳到 next[${j-1}] = ${next[j-1]}`;
        tw(explain, { o: 1 }, time);
        time += step;
        
        // 恢复颜色
        tw(textChars[i].box, { fill: BG_GRAY }, time);
        tw(patternChars[j].box, { fill: PATTERN_COLOR }, time);
        
        // 移动模式串（视觉上）
        const oldJ = j;
        j = next[j - 1];
        const offset = (oldJ - j) * 28;
        patternChars.forEach((char, idx) => {
          tw(char.g, { x: 70 + idx * 28 + offset }, time);
        });
        tw(jPtr.g, { x: 70 + j * 28 + offset }, time);
        
        time += step;
      } else {
        // j = 0 且失配，i++
        tw(iPtr.g, { x: 70 + i * 28 }, time);
        tw(jPtr.g, { x: 70 }, time);
        tw(textChars[i].box, { fill: MISMATCH_COLOR }, time);
        tw(patternChars[0].box, { fill: MISMATCH_COLOR }, time);
        
        explain.textContent = `失配：${text[i]} ≠ ${pattern[0]}，i++`;
        tw(explain, { o: 1 }, time);
        time += step * 0.7;
        
        tw(textChars[i].box, { fill: BG_GRAY }, time);
        tw(patternChars[0].box, { fill: PATTERN_COLOR }, time);
        
        i++;
        
        // 移动模式串到新的起始位置
        const offset = i * 28;
        patternChars.forEach((char, idx) => {
          tw(char.g, { x: 70 + idx * 28 + offset }, time);
        });
        tw(jPtr.g, { x: 70 + offset }, time);
        
        time += step * 0.5;
      }
    }
  }
  
  // 最终总结
  const summary = T(p, '文本指针 i 从头到尾只遍历一次 → O(n) 时间', { 
    x: 400, y: 480, size: 24, weight: 600, fill: MATCH_COLOR, anchor: 'middle', o: 0 
  });
  tw(summary, { o: 1 }, time + 1);
}, { audio: 'matching-demo' }],

['code', '算法实现', () => {
  const p = panel(0);

  T(p, 'KMP 算法实现', { x: 400, y: 70, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const code1 = [
    'def compute_next(pattern):',
    '  next = [0] * len(pattern)',
    '  j = 0',
    '  for i in range(1, len(pattern)):',
    '    while j > 0 and pattern[i] != pattern[j]:',
    '      j = next[j - 1]',
    '    if pattern[i] == pattern[j]:',
    '      j += 1',
    '    next[i] = j',
    '  return next'
  ];
  
  const code2 = [
    'def kmp_search(text, pattern):',
    '  next = compute_next(pattern)',
    '  j = 0',
    '  for i in range(len(text)):',
    '    while j > 0 and text[i] != pattern[j]:',
    '      j = next[j - 1]',
    '    if text[i] == pattern[j]:',
    '      j += 1',
    '    if j == len(pattern):',
    '      return i - j + 1  # 找到匹配',
    '  return -1  # 未找到'
  ];
  
  const codeY = 150;
  const lineHeight = 25;
  
  T(p, '1. 计算 next 数组', { x: 120, y: codeY - 20, size: 24, weight: 600, fill: NEXT_BG, o: 0 });
  code1.forEach((line, i) => {
    const text = T(p, line, { 
      x: 120, y: codeY + i * lineHeight, 
      size: 16, fill: TEXT_COLOR, anchor: 'start', o: 0,
      family: 'monospace'
    });
    tw(text, { o: 1 }, 0.5 + i * 0.2);
  });
  
  T(p, '2. 执行匹配', { x: 480, y: codeY - 20, size: 24, weight: 600, fill: PATTERN_COLOR, o: 0 });
  code2.forEach((line, i) => {
    const text = T(p, line, { 
      x: 480, y: codeY + i * lineHeight, 
      size: 16, fill: TEXT_COLOR, anchor: 'start', o: 0,
      family: 'monospace'
    });
    tw(text, { o: 1 }, 2.5 + i * 0.2);
  });
}, { audio: 'code' }],

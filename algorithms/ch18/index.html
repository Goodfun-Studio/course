const PROOF_COLOR = '#1abc9c';   // 青色（证明）

/* ---------- 辅助函数 ---------- */
function drawActivity(parent, x, y, start, end, label, color = NEUTRAL, width = 500) {
  const g = G(parent, { x, y, o: 0 });
  
  // 活动矩形
  const actWidth = (end - start) / 24 * width;
  const actX = start / 24 * width;
  
  const rect = mk('rect', {
    x: actX, y: -20,
    width: actWidth, height: 40,
    fill: color,
    stroke: TEXT_COLOR,
    'stroke-width': 2,
    rx: 5
  }, g);
  
  // 标签
  const text = T(g, label, { 
    x: actX + actWidth / 2, y: 0, 
    size: 20, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  // 时间标注
  const timeText = T(g, `${start}-${end}`, { 
    x: actX + actWidth / 2, y: 30, 
    size: 14, fill: TEXT_COLOR, anchor: 'middle' 
  });
  
  return { g, rect, text, timeText };
}

function drawTimeline(parent, x, y, hours = 24, width = 500) {
  const g = G(parent, { x, y, o: 0 });
  
  // 时间轴线
  const line = mk('line', { 
    x1: 0, y1: 0, x2: width, y2: 0, 
    stroke: TEXT_COLOR, 'stroke-width': 3 
  }, g);
  
  // 时间刻度
  for (let i = 0; i <= hours; i += 4) {
    const tickX = i / hours * width;
    mk('line', { 
      x1: tickX, y1: -5, x2: tickX, y2: 5, 
      stroke: TEXT_COLOR, 'stroke-width': 2 
    }, g);
    
    T(g, `${i}:00`, { 
      x: tickX, y: 20, 
      size: 14, fill: TEXT_COLOR, anchor: 'middle' 
    });
  }
  
  return g;
}

function drawBox(parent, x, y, width, height, color, label) {
  const g = G(parent, { x, y, o: 0 });
  
  mk('rect', {
    x: 0, y: 0,
    width, height,
    fill: color,
    stroke: TEXT_COLOR,
    'stroke-width': 3,
    rx: 8
  }, g);
  
  const text = T(g, label, { 
    x: width / 2, y: height / 2, 
    size: 24, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return g;
}

['greedy-demo', '贪心选择过程动画', () => {
  const p = panel(0);

  T(p, '贪心算法演示', { x: 400, y: 50, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  // 时间轴
  const timeline = drawTimeline(p, 100, 140, 16, 600);
  tw(timeline, { o: 1 }, 0.5);
  
  // 10个活动
  const activities = [
    { id: 'A₁', start: 1, end: 4, y: 190 },
    { id: 'A₂', start: 3, end: 5, y: 240 },
    { id: 'A₃', start: 0, end: 6, y: 290 },
    { id: 'A₄', start: 5, end: 7, y: 340 },
    { id: 'A₅', start: 3, end: 9, y: 390 },
    { id: 'A₆', start: 5, end: 9, y: 440 },
    { id: 'A₇', start: 6, end: 10, y: 490 },
    { id: 'A₈', start: 8, end: 11, y: 540 },
    { id: 'A₉', start: 8, end: 12, y: 590 },
    { id: 'A₁₀', start: 2, end: 14, y: 640 }
  ];
  
  const actElements = {};
  activities.forEach((act, i) => {
    actElements[act.id] = drawActivity(p, 100, act.y, act.start, act.end, act.id, NEUTRAL, 600);
    tw(actElements[act.id].g, { o: 1 }, 0.8 + i * 0.15);
  });
  
  // 按结束时间排序展示
  const sorted = [...activities].sort((a, b) => a.end - b.end);
  
  T(p, '排序后（按结束时间）：', { x: 100, y: 700, size: 20, weight: 600, fill: TEXT_COLOR, o: 0 });
  const sortedText = T(p, '', { x: 310, y: 700, size: 20, fill: HIGHLIGHT, anchor: 'start', o: 0 });
  
  let time = 3.0;
  
  // 显示排序结果
  sortedText.textContent = sorted.map(a => a.id).join(' → ');
  tw(sortedText, { o: 1 }, time);
  time += 1.0;
  
  // 贪心选择过程
  let lastEnd = -1;
  let selectedCount = 0;
  
  sorted.forEach((act, i) => {
    // 考察当前活动
    tw(actElements[act.id].rect, { fill: CANDIDATE, 'stroke-width': 4 }, time);
    time += 0.5;
    
    if (act.start >= lastEnd) {
      // 选择这个活动
      tw(actElements[act.id].rect, { fill: SELECTED }, time);
      lastEnd = act.end;
      selectedCount++;
      time += 0.6;
    } else {
      // 拒绝这个活动
      tw(actElements[act.id].rect, { fill: REJECTED }, time);
      time += 0.5;
    }
    
    // 恢复边框
    tw(actElements[act.id].rect, { 'stroke-width': 2 }, time);
    time += 0.4;
  });
  
  // 最终结果
  const result = T(p, `共选择了 ${selectedCount} 个活动`, { 
    x: 400, y: 740, size: 28, weight: 700, fill: SELECTED, anchor: 'middle', o: 0 
  });
  tw(result, { o: 1 }, time);
}, { audio: 'greedy-demo' }],

    '    sort(activities, by endTime)',

    '    selected = []',
    '    lastEnd = -∞',
    '    ',
    '    for each activity in activities:',

    });

      icon: '📺', 
      title: '电视节目安排', 
      desc: '一个频道，多个节目，播放最多节目',
      color: HIGHLIGHT
    }
  ];
  
  apps.forEach(({ icon, title, desc, color }, i) => {
    const y = 180 + i * 120;
    
    const box = mk('rect', { 
      x: 80, y: y - 40, width: 640, height: 100, 
      fill: color, opacity: 0.15, 
      stroke: color, 'stroke-width': 3, rx: 8 
    }, p);
    tw(box, { opacity: 0.2 }, 0.5 + i * 0.4);
    
    const iconText = T(p, icon, { 
      x: 120, y: y, 
      size: 48, anchor: 'middle', o: 0 
    });
    tw(iconText, { o: 1 }, 0.6 + i * 0.4);
    
    const titleText = T(p, title, { 
      x: 180, y: y - 10, 
      size: 28, weight: 700, fill: color, anchor: 'start', o: 0 
    });
    tw(titleText, { o: 1 }, 0.7 + i * 0.4);
    
    const descText = T(p, desc, { 
      x: 180, y: y + 25, 
      size: 20, fill: TEXT_COLOR, anchor: 'start', o: 0 
    });
    tw(descText, { o: 1 }, 0.8 + i * 0.4);
  });
}, { audio: 'applications' }],

['greedy-vs-dp', '贪心 vs 动态规划', () => {
  const p = panel(0);

  T(p, '贪心算法 vs 动态规划', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  // 对比表格
  const headers = ['', '贪心算法', '动态规划'];
  const rows = [
    ['策略', '局部最优', '全局考虑'],
    ['选择', '不可撤销', '可以回溯'],
    ['子问题', '一个子问题', '多个重叠子问题'],
    ['时间', '通常更快', '通常更慢'],
    ['适用', '特殊问题', '更广泛']
  ];
  
  const colWidth = 200;
  const rowHeight = 60;
  const startX = 100;
  const startY = 150;
  
  // 表头
  headers.forEach((header, j) => {
    const x = startX + j * colWidth;
    const text = T(p, header, { 
      x: x + colWidth / 2, y: startY, 
      size: 24, weight: 700, fill: HIGHLIGHT, anchor: 'middle', o: 0 
    });
    tw(text, { o: 1 }, 0.5);
  });
  
  // 表格内容
  rows.forEach((row, i) => {
    row.forEach((cell, j) => {
      const x = startX + j * colWidth;
      const y = startY + (i + 1) * rowHeight + rowHeight / 2;
      
      // 背景
      if (j > 0) {
        const bg = mk('rect', {
          x: x, y: y - rowHeight / 2,
          width: colWidth, height: rowHeight,
          fill: j === 1 ? SELECTED : TIMELINE_BG,
          opacity: 0.1,
          stroke: TEXT_COLOR,
          'stroke-width': 1
        }, p);
        tw(bg, { opacity: 0.15 }, 1.0 + i * 0.3);
      }
      
      const text = T(p, cell, { 
        x: x + colWidth / 2, y, 
        size: j === 0 ? 22 : 20, 
        weight: j === 0 ? 600 : 400,
        fill: TEXT_COLOR, anchor: 'middle', o: 0 
      });
      text.setAttribute('dominant-baseline', 'central');
      tw(text, { o: 1 }, 1.0 + i * 0.3);
    });
  });
  
  // 关键提示
  const hint = T(p, '关键：贪心需要证明贪心选择性质和最优子结构', { 
    x: 400, y: 550, size: 24, weight: 600, fill: PROOF_COLOR, anchor: 'middle', o: 0 
  });
  tw(hint, { o: 1 }, 3.5);
}, { audio: 'greedy-vs-dp' }],

['variants', '变体问题', () => {
  const p = panel(0);

  T(p, '活动选择的变体', { x: 400, y: 70, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const variants = [
    {
      title: '带权重的活动选择',
      desc: '每个活动有价值，选择总价值最大的子集',
      solution: '需要用动态规划，贪心不再适用',
      color: REJECTED
    },
    {
      title: '多个会议室',
      desc: '给定k个会议室，安排所有活动需要几个？',
      solution: '贪心：按开始时间排序，用堆维护会议室',
      color: SELECTED
    },
    {
      title: '活动选择与任务调度',
      desc: '活动有依赖关系，某些活动必须在其他活动之后',
      solution: '拓扑排序 + 贪心/动态规划',
      color: CANDIDATE
    }
  ];
  
  variants.forEach(({ title, desc, solution, color }, i) => {
    const y = 160 + i * 160;
    
    const box = mk('rect', { 
      x: 60, y: y - 35, width: 680, height: 140, 
      fill: color, opacity: 0.12, 
      stroke: color, 'stroke-width': 3, rx: 10 
    }, p);
    tw(box, { opacity: 0.18 }, 0.5 + i * 0.5);
    
    const titleText = T(p, title, { 
      x: 400, y: y, 
      size: 30, weight: 700, fill: color, anchor: 'middle', o: 0 
    });
    tw(titleText, { o: 1 }, 0.6 + i * 0.5);
    
    const descText = T(p, desc, { 
      x: 400, y: y + 40, 
      size: 22, fill: TEXT_COLOR, anchor: 'middle', o: 0 
    });
    tw(descText, { o: 1 }, 0.7 + i * 0.5);
    
    const solutionText = T(p, `解法：${solution}`, { 
      x: 400, y: y + 75, 
      size: 20, fill: NEUTRAL, anchor: 'middle', o: 0 
    });
    tw(solutionText, { o: 1 }, 0.8 + i * 0.5);
  });
}, { audio: 'variants' }],

['summary', '总结', () => {
  const p = panel(0);

  T(p, '总结', { x: 400, y: 70, size: 48, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const points = [
    '✓ 活动选择：选择最多不冲突的活动',
    '✓ 贪心策略：按结束时间排序，依次选择',
    '✓ 关键性质：贪心选择性质 + 最优子结构',
    '✓ 时间复杂度：O(n log n)',
    '✓ 应用场景：资源调度、任务安排',
    '✓ 注意：并非所有问题都适合贪心',
    '✓ 变体：带权重需要动态规划'
  ];
  
  points.forEach((point, i) => {
    const text = T(p, point, { 
      x: 120, y: 170 + i * 60, 
      size: 28, weight: 500, fill: TEXT_COLOR, anchor: 'start', o: 0 
    });
    tw(text, { o: 1 }, 0.5 + i * 0.3);
  });
  
  // 关键takeaway
  const takeaway = T(p, '贪心算法：简单高效，但需要严格证明', { 
    x: 400, y: 650, size: 32, weight: 700, fill: SELECTED, anchor: 'middle', o: 0 
  });
  tw(takeaway, { o: 1 }, 3.5);
}, { audio: 'summary' }]

];

/* ---------- 启动 ---------- */
window.BEATS = BEATS;
window.SELECTED = SELECTED;
window.REJECTED = REJECTED;
window.CANDIDATE = CANDIDATE;
window.NEUTRAL = NEUTRAL;
window.TIMELINE_BG = TIMELINE_BG;
boot();
</script>
</body>
</html>

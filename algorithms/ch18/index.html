<script>
'use strict';
const CHAPTER = { number: 18, title: '活动选择问题（贪心算法）', language: 'zh', minutes: 12 };

/* ---------- 颜色方案 ---------- */
const SELECTED = '#2ecc71';      // 绿色（已选择）
const REJECTED = '#e74c3c';      // 红色（被拒绝）
const CANDIDATE = '#f39c12';     // 橙色（候选）
const NEUTRAL = '#95a5a6';       // 灰色（中性）
const TIMELINE_BG = '#3498db';   // 蓝色（时间轴）
const TEXT_COLOR = '#2c3e50';    // 深色文字
const HIGHLIGHT = '#9b59b6';     // 紫色（高亮）
const PROOF_COLOR = '#1abc9c';   // 青色（证明）

/* ---------- 辅助函数 ---------- */
function drawActivity(parent, x, y, start, end, label, color = NEUTRAL, width = 500) {
  const g = G(parent, { x, y, o: 0 });
  
  // 活动矩形
  const actWidth = (end - start) / 24 * width;
  const actX = start / 24 * width;
  
  const rect = mk('rect', {
    x: actX, y: -20,
    width: actWidth, height: 40,
    fill: color,
    stroke: TEXT_COLOR,
    'stroke-width': 2,
    rx: 5
  }, g);
  
  // 标签
  const text = T(g, label, { 
    x: actX + actWidth / 2, y: 0, 
    size: 20, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  // 时间标注
  const timeText = T(g, `${start}-${end}`, { 
    x: actX + actWidth / 2, y: 30, 
    size: 14, fill: TEXT_COLOR, anchor: 'middle' 
  });
  
  return { g, rect, text, timeText };
}

function drawTimeline(parent, x, y, hours = 24, width = 500) {
  const g = G(parent, { x, y, o: 0 });
  
  // 时间轴线
  const line = mk('line', { 
    x1: 0, y1: 0, x2: width, y2: 0, 
    stroke: TEXT_COLOR, 'stroke-width': 3 
  }, g);
  
  // 时间刻度
  for (let i = 0; i <= hours; i += 4) {
    const tickX = i / hours * width;
    mk('line', { 
      x1: tickX, y1: -5, x2: tickX, y2: 5, 
      stroke: TEXT_COLOR, 'stroke-width': 2 
    }, g);
    
    T(g, `${i}:00`, { 
      x: tickX, y: 20, 
      size: 14, fill: TEXT_COLOR, anchor: 'middle' 
    });
  }
  
  return g;
}

function drawBox(parent, x, y, width, height, color, label) {
  const g = G(parent, { x, y, o: 0 });
  
  mk('rect', {
    x: 0, y: 0,
    width, height,
    fill: color,
    stroke: TEXT_COLOR,
    'stroke-width': 3,
    rx: 8
  }, g);
  
  const text = T(g, label, { 
    x: width / 2, y: height / 2, 
    size: 24, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return g;
}

  T(p, '策略3：选择结束时间最早的', { x: 400, y: 60, size: 40, weight: 700, fill: TEXT_COLOR, o: 0 });

  // 按结束时间：A1(3) < A2(4) < A3(7) < A4(9)
  tw(act1.rect, { fill: SELECTED }, m('example'));
  tw(act2.rect, { fill: REJECTED }, m('first'));
  tw(act3.rect, { fill: SELECTED }, m('select_next'));

['greedy-demo', '贪心选择过程动画', (m, dur) => {
  const p = panel(0);

  T(p, '贪心算法演示', { x: 400, y: 50, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });

  const timeline = drawTimeline(p, 100, 140, 16, 600);
  tw(timeline, { o: 1 }, m('demo'));

  const activities = [
    { id: 'A₁', start: 1, end: 4, y: 190 },
    { id: 'A₂', start: 3, end: 5, y: 240 },
    { id: 'A₃', start: 0, end: 6, y: 290 },
    { id: 'A₄', start: 5, end: 7, y: 340 },
    { id: 'A₅', start: 3, end: 9, y: 390 },
    { id: 'A₆', start: 5, end: 9, y: 440 },
    { id: 'A₇', start: 6, end: 10, y: 490 },
    { id: 'A₈', start: 8, end: 11, y: 540 },
    { id: 'A₉', start: 8, end: 12, y: 590 },
    { id: 'A₁₀', start: 2, end: 14, y: 640 }
  ];

  const actElements = {};
  activities.forEach((act, i) => {
    actElements[act.id] = drawActivity(p, 100, act.y, act.start, act.end, act.id, NEUTRAL, 600);
    tw(actElements[act.id].g, { o: 1 }, m('ten') + i * 0.15);
  });

  const sorted = [...activities].sort((a, b) => a.end - b.end);

  T(p, '排序后（按结束时间）：', { x: 100, y: 700, size: 20, weight: 600, fill: TEXT_COLOR, o: 0 });
  const sortedText = T(p, '', { x: 310, y: 700, size: 20, fill: HIGHLIGHT, anchor: 'start', o: 0 });
  sortedText.textContent = sorted.map(a => a.id).join(' → ');
  tw(sortedText, { o: 1 }, m('order'));

  let time = m('select');
  let lastEnd = -1;
  let selectedCount = 0;

  sorted.forEach((act) => {
    tw(actElements[act.id].rect, { fill: CANDIDATE, 'stroke-width': 4 }, time);
    time += 0.5;

    if (act.start >= lastEnd) {
      tw(actElements[act.id].rect, { fill: SELECTED }, time);
      lastEnd = act.end;
      selectedCount++;
      time += 0.6;
    } else {
      tw(actElements[act.id].rect, { fill: REJECTED }, time);
      time += 0.5;
    }

    tw(actElements[act.id].rect, { 'stroke-width': 2 }, time);
    time += 0.4;
  });

  const result = T(p, `共选择了 ${selectedCount} 个活动`, {
    x: 400, y: 740, size: 28, weight: 700, fill: SELECTED, anchor: 'middle', o: 0
  });
  tw(result, { o: 1 }, m('result'));

  // 延伸到末尾
  tw(sortedText, { o: 1 }, m('efficient') - 0.2, 0, lin);
}, { audio: 'greedy-demo' }],

['algorithm', '算法实现', (m, dur) => {
  const p = panel(0);

  T(p, '算法实现', { x: 400, y: 60, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });

  const code = [
    'function activitySelection(activities):',
    '    // 按结束时间排序',
    '    sort(activities, by endTime)',
    '    ',
    '    selected = []',
    '    lastEnd = -∞',
    '    ',
    '    for each activity in activities:',
    '        if activity.start >= lastEnd:',
    '            selected.append(activity)',
    '            lastEnd = activity.end',
    '    ',
    '    return selected'
  ];

  const codeTexts = [];
  code.forEach((line, i) => {
    const indent = line.match(/^(\s*)/)[0].length;
    const text = T(p, line, {
      x: 80 + indent * 8, y: 140 + i * 32,
      size: 20, fill: TEXT_COLOR, anchor: 'start',
      family: 'Monaco, monospace', o: 0
    });
    tw(text, { o: 1 }, m('simple') + i * 0.15);
    codeTexts.push(text);
  });

  // 时间复杂度 @ time
  const yT = 580;
  const labelT = T(p, '时间复杂度：', { x: 100, y: yT, size: 26, weight: 600, fill: TEXT_COLOR, anchor: 'start', o: 0 });
  tw(labelT, { o: 1 }, m('time'));
  const valT = T(p, 'O(n log n)', { x: 320, y: yT, size: 28, weight: 700, fill: HIGHLIGHT, anchor: 'start', o: 0 });
  tw(valT, { o: 1 }, m('time'));
  const descT = T(p, '排序的时间', { x: 500, y: yT, size: 22, fill: NEUTRAL, anchor: 'start', o: 0 });
  tw(descT, { o: 1 }, m('time') + 0.2);

  // 空间复杂度 @ space
  const yS = 640;
  const labelS = T(p, '空间复杂度：', { x: 100, y: yS, size: 26, weight: 600, fill: TEXT_COLOR, anchor: 'start', o: 0 });
  tw(labelS, { o: 1 }, m('space'));
  const valS = T(p, 'O(1)', { x: 320, y: yS, size: 28, weight: 700, fill: HIGHLIGHT, anchor: 'start', o: 0 });
  tw(valS, { o: 1 }, m('space'));
  const descS = T(p, '只需常数空间', { x: 500, y: yS, size: 22, fill: NEUTRAL, anchor: 'start', o: 0 });
  tw(descS, { o: 1 }, m('space') + 0.2);

  // 延伸到末尾
  tw(valS, { o: 1 }, m('efficient') - 0.2, 0, lin);
}, { audio: 'algorithm' }],

['proof', '正确性证明', (m, dur) => {
  const p = panel(0);

  T(p, '正确性证明（交换论证）', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });

  const steps = [
    { text: '假设：最优解 OPT 不包含结束最早的活动 a₁', mark: 'assume' },
    { text: '', mark: 'assume' },
    { text: '设：OPT 中第一个活动是 aₖ', mark: 'first_optimal' },
    { text: '', mark: 'first_optimal' },
    { text: '因为：a₁ 结束最早，所以 f₁ ≤ fₖ', mark: 'earliest' },
    { text: '', mark: 'earliest' },
    { text: '构造：将 OPT 中的 aₖ 替换为 a₁', mark: 'replace' },
    { text: '', mark: 'no_conflict' },
    { text: '结果：新解仍然可行，且大小不变', mark: 'feasible' },
    { text: '', mark: 'feasible' },
    { text: '结论：包含 a₁ 的最优解一定存在', mark: 'exists' }
  ];

  steps.forEach(({ text, mark }, i) => {
    const isEmpty = text === '';
    const isConclusion = text.startsWith('结论');
    const isAssume = text.startsWith('假设');
    const size = isEmpty ? 10 : (isConclusion || isAssume) ? 26 : 24;
    const weight = (isConclusion || isAssume) ? 700 : 400;
    const color = isConclusion ? PROOF_COLOR : TEXT_COLOR;

    const t = T(p, text, {
      x: 100, y: 140 + i * 38,
      size, weight, fill: color, anchor: 'start', o: 0
    });
    tw(t, { o: 1 }, m(mark));
  });

  const insight = T(p, '💡 贪心选择性质：局部最优可以导致全局最优', {
    x: 400, y: 620, size: 26, weight: 600, fill: SELECTED, anchor: 'middle', o: 0
  });
  tw(insight, { o: 1 }, m('safe'));

  // 延伸到末尾
  tw(insight, { o: 1 }, m('safe'), 0, lin);
}, { audio: 'proof' }],

['greedy-vs-dp', '贪心 vs 动态规划', (m, dur) => {
  const p = panel(0);

  T(p, '贪心算法 vs 动态规划', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });

  const headers = ['', '贪心算法', '动态规划'];
  const rows = [
    { cells: ['策略', '局部最优', '全局考虑'], mark: 'strategy' },
    { cells: ['选择', '不可撤销', '可以回溯'], mark: 'irreversible' },
    { cells: ['子问题', '一个子问题', '多个重叠子问题'], mark: 'one_subproblem' },
    { cells: ['时间', '通常更快', '通常更慢'], mark: 'faster' },
    { cells: ['适用', '特殊问题', '更广泛'], mark: 'special' }
  ];

  const colWidth = 200;
  const rowHeight = 60;
  const startX = 100;
  const startY = 150;

  headers.forEach((header, j) => {
    const x = startX + j * colWidth;
    const text = T(p, header, {
      x: x + colWidth / 2, y: startY,
      size: 24, weight: 700, fill: HIGHLIGHT, anchor: 'middle', o: 0
    });
    tw(text, { o: 1 }, m('difference'));
  });

  rows.forEach(({ cells, mark }, i) => {
    cells.forEach((cell, j) => {
      const x = startX + j * colWidth;
      const y = startY + (i + 1) * rowHeight + rowHeight / 2;

      if (j > 0) {
        const bg = mk('rect', {
          x: x, y: y - rowHeight / 2,
          width: colWidth, height: rowHeight,
          fill: j === 1 ? SELECTED : TIMELINE_BG,
          opacity: 0.1,
          stroke: TEXT_COLOR,
          'stroke-width': 1
        }, p);
        tw(bg, { opacity: 0.15 }, m(mark));
      }

      const text = T(p, cell, {
        x: x + colWidth / 2, y,
        size: j === 0 ? 22 : 20,
        weight: j === 0 ? 600 : 400,
        fill: TEXT_COLOR, anchor: 'middle', o: 0
      });
      text.setAttribute('dominant-baseline', 'central');
      tw(text, { o: 1 }, m(mark));
    });
  });

  const hint = T(p, '关键：贪心需要证明贪心选择性质和最优子结构', {
    x: 400, y: 550, size: 24, weight: 600, fill: PROOF_COLOR, anchor: 'middle', o: 0
  });
  tw(hint, { o: 1 }, m('key'));

  // 延伸到末尾
  tw(hint, { o: 1 }, m('key'), 0, lin);
}, { audio: 'greedy-vs-dp' }],

  tw(so2, { o: 1 }, m('topo'));

  // 延伸到末尾

}, { audio: 'variants' }],

['summary', '总结', (m, dur) => {

  // 延伸到末尾

}, { audio: 'summary' }]

];

window.BEATS = BEATS;

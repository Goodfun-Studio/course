/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, color = NODE_COLOR, isRoot = false) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { 
    cx: 0, cy: 0, r: 30, 
    fill: isRoot ? ROOT_COLOR : color, 
    stroke: TEXT_COLOR, 
    'stroke-width': isRoot ? 4 : 2 
  }, g);
  const text = T(g, label, { x: 0, y: 0, size: 24, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, color = TEXT_COLOR, width = 2) {
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': width,
    'marker-end': 'url(#arrow)',
    opacity: 0 
  }, parent);
  return line;
}

function drawArrow(parent) {
  const defs = mk('defs', {}, parent);
  const marker = mk('marker', {
    id: 'arrow',
    markerWidth: 10,
    markerHeight: 10,
    refX: 9,
    refY: 3,
    orient: 'auto',
    markerUnits: 'strokeWidth'
  }, defs);
  mk('path', {
    d: 'M0,0 L0,6 L9,3 z',
    fill: TEXT_COLOR
  }, marker);
}

function drawRankLabel(parent, x, y, rank) {
  const text = T(parent, `秩=${rank}`, { 
    x, y, size: 18, weight: 600, fill: RANK_COLOR, anchor: 'middle', o: 0 
  });
  return text;
}

['implementation', '完整实现', () => {
  const p = panel(0);

  T(p, '并查集完整实现', { x: 400, y: 70, size: 42, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const code = `class UnionFind:
    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n
    
    def find(self, x):
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])  # 路径压缩
        return self.parent[x]
    
    def union(self, x, y):
        root_x = self.find(x)
        root_y = self.find(y)
        
        if root_x == root_y:
            return  # 已在同一集合
        
        # 按秩合并
        if self.rank[root_x] < self.rank[root_y]:
            self.parent[root_x] = root_y
        elif self.rank[root_x] > self.rank[root_y]:
            self.parent[root_y] = root_x
        else:
            self.parent[root_y] = root_x
            self.rank[root_x] += 1
    
    def connected(self, x, y):
        return self.find(x) == self.find(y)`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, {

    tw(text, { o: 1 }, 0.2 + i * 0.08);

}, { audio: 'implementation' }],

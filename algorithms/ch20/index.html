/* ---------- 颜色方案 ---------- */
const CURRENT = '#e74c3c';         // 红色（当前元素）
const HIGHLIGHT = '#f39c12';       // 橙色（高亮）
const SUCCESS = '#2ecc71';         // 绿色（成功）
const COMPARE = '#3498db';         // 蓝色（比较）
const DP_COLOR = '#9b59b6';        // 紫色（DP值）
const TAILS = '#1abc9c';           // 青色（tails数组）
const BACKGROUND = '#ecf0f1';      // 浅灰（背景）
const TEXT_COLOR = '#2c3e50';      // 深色文字

/* ---------- 辅助函数 ---------- */
function drawArray(parent, x, y, arr, label = '') {
  const g = G(parent, { x, y, o: 0 });
  if (label) {
    T(g, label, { x: -80, y: 25, size: 20, weight: 600, fill: TEXT_COLOR, anchor: 'end' });
  }
  const boxes = [];
  arr.forEach((val, i) => {
    const box = G(g, { x: i * 60, y: 0 });
    mk('rect', { x: 0, y: 0, width: 55, height: 50, fill: '#fff', stroke: TEXT_COLOR, 'stroke-width': 2 }, box);
    const text = T(box, val.toString(), { x: 27.5, y: 25, size: 22, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
    text.setAttribute('dominant-baseline', 'central');
    boxes.push(box);
  });
  return { g, boxes };
}

function drawDPTable(parent, x, y, nums, dp) {
  const g = G(parent, { x, y, o: 0 });
  
  // 绘制nums数组
  T(g, 'nums:', { x: 0, y: 25, size: 20, weight: 600, fill: TEXT_COLOR, anchor: 'start' });
  const numsBoxes = [];
  nums.forEach((val, i) => {
    const box = G(g, { x: 100 + i * 60, y: 0 });
    mk('rect', { x: 0, y: 0, width: 55, height: 50, fill: '#fff', stroke: TEXT_COLOR, 'stroke-width': 2 }, box);
    const text = T(box, val.toString(), { x: 27.5, y: 25, size: 20, weight: 600, fill: TEXT_COLOR, anchor: 'middle' });
    text.setAttribute('dominant-baseline', 'central');
    numsBoxes.push(box);
  });
  
  // 绘制dp数组
  T(g, 'dp:', { x: 0, y: 95, size: 20, weight: 600, fill: DP_COLOR, anchor: 'start' });
  const dpBoxes = [];
  dp.forEach((val, i) => {
    const box = G(g, { x: 100 + i * 60, y: 70 });
    mk('rect', { x: 0, y: 0, width: 55, height: 50, fill: '#fff', stroke: DP_COLOR, 'stroke-width': 2 }, box);
    const text = T(box, val.toString(), { x: 27.5, y: 25, size: 22, weight: 700, fill: DP_COLOR, anchor: 'middle' });
    text.setAttribute('dominant-baseline', 'central');
    dpBoxes.push(box);
  });
  
  return { g, numsBoxes, dpBoxes };
}

function highlightBox(box, color, duration = 0.5) {
  const rect = box.querySelector('rect');
  tw(rect, { fill: color }, duration);
}

function updateDPValue(box, value, duration = 0.5) {
  const text = box.querySelector('text');
  tw(text, { o: 0 }, duration / 2, () => {
    text.textContent = value.toString();
    tw(text, { o: 1 }, duration / 2);
  });
}

['dp-code', 'DP代码实现', () => {
  const p = panel(0);

  T(p, 'DP 代码实现', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
  
  const code = `def lengthOfLIS(nums):
    n = len(nums)
    dp = [1] * n  # 初始化
    
    for i in range(n):
        for j in range(i):
            if nums[j] < nums[i]:
                dp[i] = max(dp[i], dp[j] + 1)
    
    return max(dp)  # 返回最大值`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 100, y: 140 + i * 32, size: 18, weight: 500, fill: TEXT_COLOR, anchor: 'start', o: 0 
    });
    text.style.fontFamily = 'Monaco, Consolas, monospace';
    tw(text, { o: 1 }, 0.5 + i * 0.2);
  });
  
  const complexity = T(p, '时间复杂度：O(n²)  空间复杂度：O(n)', { 
    x: 400, y: 480, size: 24, weight: 600, fill: HIGHLIGHT, anchor: 'middle', o: 0 
  });
  tw(complexity, { o: 1 }, 3);
}],

['binary-code', '二分优化代码', () => {
  const p = panel(0);

  T(p, '二分优化代码', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
  
  const code = `def lengthOfLIS(nums):
    tails = []
    
    for num in nums:
        # 二分查找第一个 >= num 的位置
        left, right = 0, len(tails)
        while left < right:
            mid = (left + right) // 2
            if tails[mid] < num:
                left = mid + 1
            else:
                right = mid
        
        # 如果找到，替换；否则追加
        if left < len(tails):
            tails[left] = num
        else:
            tails.append(num)
    
    return len(tails)`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 80, y: 120 + i * 28, size: 16, weight: 500, fill: TEXT_COLOR, anchor: 'start', o: 0

    tw(text, { o: 1 }, 0.3 + i * 0.15);
  });

  tw(complexity, { o: 1 }, 4);
}],

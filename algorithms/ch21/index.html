/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, isEnd = false) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { 
    cx: 0, cy: 0, r: 25, 
    fill: isEnd ? END_NODE_COLOR : NODE_COLOR, 
    stroke: TEXT_COLOR, 
    'stroke-width': 2 
  }, g);
  const text = T(g, label, { x: 0, y: 0, size: 20, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, label, color = EDGE_COLOR) {
  const g = G(parent, { o: 0 });
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': 2
  }, g);
  
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  const text = T(g, label, { 
    x: midX, y: midY - 10, 
    size: 16, weight: 600, fill: color, anchor: 'middle' 
  });
  
  return { g, line, text };
}

['implementation', '代码实现', () => {
  const p = panel(0);
  
  T(p, '代码实现', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const code = `class TrieNode {
  constructor() {
    this.children = new Map();
    this.isEnd = false;
  }
}

class Trie {
  constructor() {
    this.root = new TrieNode();
  }
  
  insert(word) {
    let node = this.root;
    for (let char of word) {
      if (!node.children.has(char)) {
        node.children.set(char, new TrieNode());
      }
      node = node.children.get(char);
    }
    node.isEnd = true;
  }
  
  search(word) {
    let node = this.root;
    for (let char of word) {
      if (!node.children.has(char)) {
        return false;
      }
      node = node.children.get(char);
    }
    return node.isEnd;
  }
  
  startsWith(prefix) {
    let node = this.root;
    for (let char of prefix) {
      if (!node.children.has(char)) {
        return false;
      }
      node = node.children.get(char);
    }
    return true;
  }
}`;
  
  const lines = code.split('\n');
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 50, 
      y: 120 + i * 16, 
      size: 13, 
      fill: TEXT_COLOR, 
      family: 'monospace', 
      anchor: 'start',
      o: 0
    });
    tw(text, { o: 1 }, 0.5 + i * 0.1);
  });
}],

  tw(eapple.g, { o: 1 }, 4);
  
  const note1 = T(p, '5 个节点', { x: 200, y: 560, size: 18, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  tw(note1, { o: 1 }, 3.5);
  
  const note2 = T(p, '1 个节点（压缩）', { x: 600, y: 400, size: 18, fill: SUCCESS, anchor: 'middle', o: 0 });
  tw(note2, { o: 1 }, 4.5);
  
  const summary = T(p, '压缩只有单个子节点的路径，节省空间', { 
    x: 400, y: 560, size: 22, weight: 600, fill: PATH_COLOR, anchor: 'middle', o: 0 
  });
  tw(summary, { o: 1 }, 5);
}],

['autocomplete', '应用：自动补全', () => {
  const p = panel(0);
  
  T(p, '自动补全', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 搜索框
  const searchBox = mk('rect', { 
    x: 150, y: 100, width: 500, height: 50, 
    fill: '#fff', stroke: HIGHLIGHT, 'stroke-width': 3, rx: 5, o: 0 
  }, p);
  tw(searchBox, { o: 1 }, 0.5);
  
  const searchText = T(p, '🔍 app', { x: 180, y: 125, size: 24, anchor: 'start', o: 0 });
  tw(searchText, { o: 1 }, 1);
  
  // 补全建议
  const suggestions = [
    'apple',
    'app',
    'application',
    'apply'
  ];
  
  T(p, '补全建议：', { x: 170, y: 200, size: 22, weight: 600, fill: TEXT_COLOR, o: 0 });
  
  suggestions.forEach((word, i) => {
    const g = G(p, { x: 200, y: 240 + i * 50, o: 0 });
    
    const bg = mk('rect', { 
      x: -20, y: -20, width: 300, height: 40, 
      fill: BACKGROUND, rx: 5 
    }, g);
    
    T(g, word, { x: 0, y: 0, size: 22, fill: TEXT_COLOR, anchor: 'start' });
    
    tw(g, { o: 1 }, 2 + i * 0.3);
  });
  
  const process = T(p, '算法：① 找到前缀节点\n② DFS 遍历子树\n③ 收集所有 isEnd 节点', { 
    x: 550, y: 280, size: 18, fill: PATH_COLOR, o: 0 
  });
  process.style.whiteSpace = 'pre';
  tw(process, { o: 1 }, 3.5);
  
  const complexity = T(p, '时间：O(m + k)，m=前缀长度，k=结果数', { 
    x: 400, y: 500, size: 20, weight: 600, fill: SUCCESS, anchor: 'middle', o: 0 
  });
  tw(complexity, { o: 1 }, 4.5);
}],

['spellcheck', '应用：拼写检查', () => {
  const p = panel(0);
  
  T(p, '拼写检查与纠错', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 错误单词
  const wrong = T(p, '输入: aple', { x: 200, y: 140, size: 28, weight: 600, fill: END_NODE_COLOR, o: 0 });
  tw(wrong, { o: 1 }, 0.5);
  
  const line = mk('line', { 
    x1: 190, y1: 150, x2: 270, y2: 150, 
    stroke: END_NODE_COLOR, 'stroke-width': 3, 
    'stroke-dasharray': '5,5', o: 0 
  }, p);
  tw(line, { o: 1 }, 1);
  
  // 建议
  T(p, '可能的正确拼写：', { x: 150, y: 220, size: 24, weight: 600, fill: TEXT_COLOR, o: 0 });
  
  const corrections = [
    { word: 'apple', dist: 1, desc: '缺少一个 p' },
    { word: 'able', dist: 2, desc: '替换两个字符' }
  ];
  
  corrections.forEach(({ word, dist, desc }, i) => {
    const g = G(p, { x: 200, y: 280 + i * 80, o: 0 });
    
    T(g, word, { x: 0, y: 0, size: 26, weight: 700, fill: SUCCESS, anchor: 'start' });
    T(g, `编辑距离: ${dist}`, { x: 0, y: 35, size: 20, fill: HIGHLIGHT, anchor: 'start' });
    T(g, desc, { x: 200, y: 35, size: 18, fill: TEXT_COLOR, anchor: 'start' });
    
    tw(g, { o: 1 }, 2 + i * 0.5);
  });
  
  const algorithm = T(p, '算法：DFS + 编辑距离\n允许插入、删除、替换字符\n剪枝：距离超过阈值停止搜索', { 
    x: 150, y: 470, size: 18, fill: PATH_COLOR, o: 0 
  });
  algorithm.style.whiteSpace = 'pre';
  tw(algorithm, { o: 1 }, 3.5);
}],

['applications', '更多应用场景', () => {
  const p = panel(0);
  
  T(p, '字典树的应用', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const apps = [
    { icon: '🌐', title: 'IP 路由表', desc: '压缩 Trie 存储 IP 前缀，快速路由查找', y: 150 },
    { icon: '📊', title: '词频统计', desc: '每个节点记录单词出现次数', y: 240 },
    { icon: '🚫', title: '敏感词过滤', desc: 'AC 自动机：多模式串匹配', y: 330 },
    { icon: '🧬', title: 'DNA 序列', desc: '基因序列模式匹配与查找', y: 420 }
  ];
  
  apps.forEach(({ icon, title, desc, y }, i) => {
    const g = G(p, { x: 150, y, o: 0 });
    
    T(g, icon, { x: 0, y: 0, size: 40, anchor: 'middle' });
    T(g, title, { x: 80, y: -5, size: 28, weight: 700, fill: HIGHLIGHT, anchor: 'start' });
    T(g, desc, { x: 80, y: 25, size: 20, fill: TEXT_COLOR, anchor: 'start' });
    
    tw(g, { o: 1 }, 0.5 + i * 0.5);
  });
  
  const note = T(p, '核心优势：前缀匹配 + 路径共享', { 
    x: 400, y: 540, size: 24, weight: 600, fill: SUCCESS, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, 3);
}],

['comparison', 'Trie vs 哈希表', () => {
  const p = panel(0);
  
  T(p, '字典树 vs 哈希表', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 表头
  const headers = ['特性', '哈希表', '字典树'];
  headers.forEach((h, i) => {
    T(p, h, { 
      x: 200 + i * 200, y: 130, 
      size: 24, weight: 700, fill: HIGHLIGHT, anchor: 'middle' 
    });
  });
  
  // 对比项
  const rows = [
    { feature: '查找时间', hash: 'O(1) 平均', trie: 'O(m) m=长度' },
    { feature: '前缀搜索', hash: '✗ 不支持', trie: '✓ O(m)' },
    { feature: '有序输出', hash: '✗ 无序', trie: '✓ 字典序' },
    { feature: '空间占用', hash: '存完整串', trie: '共享前缀' },
    { feature: '哈希冲突', hash: '可能冲突', trie: '无冲突' }
  ];
  
  rows.forEach((row, i) => {
    const y = 180 + i * 60;
    
    T(p, row.feature, { 
      x: 200, y, size: 20, weight: 600, fill: TEXT_COLOR, anchor: 'middle', o: 0 
    });
    
    T(p, row.hash, { 
      x: 400, y, size: 18, fill: NODE_COLOR, anchor: 'middle', o: 0 
    });
    
    T(p, row.trie, { 
      x: 600, y, size: 18, fill: SUCCESS, anchor: 'middle', o: 0 
    });
    
    setTimeout(() => {
      const elements = p.querySelectorAll(`text[y="${y}"]`);
      elements.forEach(el => tw(el, { o: 1 }, 0.5 + i * 0.4));
    }, 10);
  });
  
  const conclusion = T(p, '精确查找用哈希表，前缀操作用字典树', { 
    x: 400, y: 520, size: 22, weight: 600, fill: PATH_COLOR, anchor: 'middle', o: 0 
  });
  tw(conclusion, { o: 1 }, 3.5);
}],

['variants', '高级变体', () => {
  const p = panel(0);
  
  T(p, '字典树的变体', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const variants = [
    { 
      name: '后缀树（Suffix Tree）', 
      desc: '存储字符串的所有后缀\nO(m) 时间查找任意子串',
      use: '字符串匹配、最长公共子串',
      y: 150 
    },
    { 
      name: '三向字典树（Ternary Trie）', 
      desc: '每个节点最多 3 个子节点\n比普通 Trie 省空间',
      use: '嵌入式系统、内存受限环境',
      y: 290 
    },
    { 
      name: 'AC 自动机（Aho-Corasick）', 
      desc: 'Trie + 失败指针\nO(n) 时间匹配多个模式',
      use: '多模式串匹配、敏感词过滤',
      y: 430 
    }
  ];
  
  variants.forEach(({ name, desc, use, y }, i) => {
    const g = G(p, { x: 100, y, o: 0 });
    
    T(g, name, { x: 0, y: 0, size: 26, weight: 700, fill: HIGHLIGHT, anchor: 'start' });
    
    const descText = T(g, desc, { x: 0, y: 40, size: 18, fill: TEXT_COLOR, anchor: 'start' });
    descText.style.whiteSpace = 'pre';
    
    T(g, `应用：${use}`, { x: 0, y: 95, size: 17, fill: PATH_COLOR, anchor: 'start' });
    
    tw(g, { o: 1 }, 0.5 + i * 0.8);
  });
}],

['finish', '总结', () => {
  const p = panel(0);
  
  T(p, '字典树（Trie）', { x: 400, y: 80, size: 42, weight: 700, fill: TEXT_COLOR });
  
  const points = [
    { icon: '🌳', text: '树形结构，边代表字符，共享公共前缀', y: 180 },
    { icon: '⚙️', text: 'insert、search、startsWith 三个核心操作', y: 260 },
    { icon: '⏱️', text: '时间复杂度 O(m)，m 是字符串长度', y: 340 },
    { icon: '🎯', text: '擅长前缀匹配、自动补全、拼写检查', y: 420 },
    { icon: '💡', text: '压缩 Trie 节省空间，后缀树、AC 自动机更强大', y: 500 }
  ];
  
  points.forEach(({ icon, text, y }, i) => {
    const g = G(p, { x: 100, y, o: 0 });
    T(g, icon, { x: 0, y: 0, size: 36, anchor: 'middle' });
    T(g, text, { x: 70, y: 0, size: 24, fill: TEXT_COLOR, anchor: 'start' });
    tw(g, { o: 1 }, 0.5 + i * 0.5);
  });
  
  const motto = T(p, '掌握字典树，轻松处理字符串前缀问题！', { 
    x: 400, y: 560, size: 26, weight: 700, fill: SUCCESS, anchor: 'middle', o: 0 
  });
  tw(motto, { o: 1 }, 3.5);
}]

];

/* ---------- 初始化 ---------- */
function boot() {
  const bg = mk('rect', { x: 0, y: 0, width: 800, height: 600, fill: BACKGROUND }, panel(0));
  bg.style.pointerEvents = 'none';
}

boot();
</script>

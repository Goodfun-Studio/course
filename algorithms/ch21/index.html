<script>
'use strict';
const CHAPTER = { number: 21, title: '字典树（Trie）', language: 'zh', minutes: 11 };

/* ---------- 颜色方案 ---------- */
const NODE_COLOR = '#3498db';      // 蓝色（普通节点）
const END_NODE_COLOR = '#e74c3c';  // 红色（单词结尾节点）
const EDGE_COLOR = '#2c3e50';      // 深色（边）
const HIGHLIGHT = '#f39c12';       // 橙色（高亮）
const SUCCESS = '#2ecc71';         // 绿色（成功）
const BACKGROUND = '#ecf0f1';      // 浅灰（背景）
const TEXT_COLOR = '#2c3e50';      // 深色文字
const PATH_COLOR = '#9b59b6';      // 紫色（路径）

/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, isEnd = false) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { 
    cx: 0, cy: 0, r: 25, 
    fill: isEnd ? END_NODE_COLOR : NODE_COLOR, 
    stroke: TEXT_COLOR, 
    'stroke-width': 2 
  }, g);
  const text = T(g, label, { x: 0, y: 0, size: 20, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, label, color = EDGE_COLOR) {
  const g = G(parent, { o: 0 });
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': 2
  }, g);
  
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2;
  const text = T(g, label, { 
    x: midX, y: midY - 10, 
    size: 16, weight: 600, fill: color, anchor: 'middle' 
  });
  
  return { g, line, text };
}

['implementation', '代码实现', (m, dur) => {
  const p = panel(0);
  
  T(p, '代码实现', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const code = `class TrieNode {
  constructor() {
    this.children = new Map();
    this.isEnd = false;
  }
}

class Trie {
  constructor() {
    this.root = new TrieNode();
  }
  
  insert(word) {
    let node = this.root;
    for (let char of word) {
      if (!node.children.has(char)) {
        node.children.set(char, new TrieNode());
      }
      node = node.children.get(char);
    }
    node.isEnd = true;
  }
  
  search(word) {
    let node = this.root;
    for (let char of word) {
      if (!node.children.has(char)) {
        return false;
      }
      node = node.children.get(char);
    }
    return node.isEnd;
  }
  
  startsWith(prefix) {
    let node = this.root;
    for (let char of prefix) {
      if (!node.children.has(char)) {
        return false;
      }
      node = node.children.get(char);
    }
    return true;
  }
}`;
  
  const lines = code.split('\n');
  const startTime = m('code');
  const timePerLine = (dur - startTime) / lines.length;
  
  lines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 50, 
      y: 120 + i * 16, 
      size: 13, 
      fill: TEXT_COLOR, 
      family: 'monospace', 
      anchor: 'start',
      o: 0
    });
    tw(text, { o: 1 }, startTime + i * timePerLine);
  });
}],

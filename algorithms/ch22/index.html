<script>
'use strict';
const CHAPTER = { number: 22, title: '霍夫曼编码（Huffman Coding）', language: 'zh', minutes: 12 };

/* ---------- 颜色方案 ---------- */
const NODE_LEAF     = '#2ecc71';
const NODE_INTERNAL = '#3498db';
const NODE_SELECTED = '#e74c3c';
const NODE_MERGED   = '#9b59b6';
const EDGE_COLOR    = '#34495e';
const CODE_0        = '#f39c12';
const CODE_1        = '#16a085';
const TEXT_COLOR    = '#2c3e50';
const BG_LIGHT      = '#ecf0f1';

/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, freq, color) {
  color = color || NODE_LEAF;
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { cx: 0, cy: 0, r: 30, fill: color, stroke: TEXT_COLOR, 'stroke-width': 3 }, g);
  const text1 = T(g, label, { x: 0, y: -5, size: 24, weight: 700, fill: '#fff', anchor: 'middle' });
  text1.setAttribute('dominant-baseline', 'central');
  const text2 = T(g, String(freq), { x: 0, y: 12, size: 18, weight: 600, fill: '#fff', anchor: 'middle' });
  text2.setAttribute('dominant-baseline', 'central');
  return { g, circle, text1, text2 };
}

function drawEdge(parent, x1, y1, x2, y2, label, color) {
  label = label || '';
  color = color || EDGE_COLOR;
  const g = G(parent, { o: 0 });
  const line = mk('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': 3 }, g);
  let labelText = null;
  if (label) {
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    labelText = T(g, label, { x: midX - 10, y: midY - 5, size: 20, weight: 700, fill: color, anchor: 'middle' });
  }
  return { g, line, labelText };
}

function drawCodeBox(parent, x, y, char, code, color) {
  const g = G(parent, { x, y, o: 0 });
  mk('rect', { x: 0, y: 0, width: 100, height: 50, fill: color, opacity: 0.2, rx: 5, stroke: color, 'stroke-width': 2 }, g);
  const charText = T(g, char, { x: 20, y: 25, size: 24, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
  charText.setAttribute('dominant-baseline', 'central');
  const codeText = T(g, code, { x: 65, y: 25, size: 20, weight: 600, fill: color, anchor: 'middle', family: 'monospace' });
  codeText.setAttribute('dominant-baseline', 'central');
  return { g, charText, codeText };
}

function drawBinaryBit(parent, x, y, bit, color) {
  const g = G(parent, { x, y, o: 0 });
  mk('rect', { x: 0, y: 0, width: 30, height: 40, fill: color, opacity: 0.3, rx: 3, stroke: color, 'stroke-width': 2 }, g);
  const text = T(g, bit, { x: 15, y: 20, size: 24, weight: 700, fill: color, anchor: 'middle', family: 'monospace' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, text };
}

/* ---------- Beats ---------- */
let BEATS = [

/* ── 1. intro ─────────────────────────────────────────────── */
['intro', '问题引入', (m, dur) => {
  const p = panel(0);

  T(p, '霍夫曼编码（Huffman Coding）', { x: 400, y: 100, size: 48, weight: 700, fill: TEXT_COLOR, o: 0 });
  // [[huffman]] 4.1s – 标题淡入
  tw(T(p, '霍夫曼编码（Huffman Coding）', { x: 400, y: 100, size: 48, weight: 700, fill: TEXT_COLOR, o: 0 }), { o: 1 }, m('huffman'));

  const scenarios = [
    { icon: '📦', text: 'ZIP 文件压缩',  y: 200, mark: 'compress' },
    { icon: '🖼️', text: 'JPEG 图像压缩', y: 270, mark: 'core'     },
    { icon: '🎵', text: 'MP3 音频压缩',  y: 340, mark: 'morse'    },
    { icon: '📡', text: '摩尔斯电码',    y: 410, mark: 'ratio'    },
    { icon: '🎥', text: 'H.264 视频压缩',y: 480, mark: 'today'    }
  ];

  scenarios.forEach(({ icon, text, y, mark }) => {
    const g = G(p, { x: 150, y, o: 0 });
    T(g, icon, { x: 0, y: 0, size: 40, anchor: 'middle' });
    T(g, text,  { x: 80, y: 0, size: 28, fill: TEXT_COLOR, anchor: 'start' });
    tw(g, { o: 1 }, m(mark));
  });

  // [[ratio]] 31.09s – 核心思想文字
  const question = T(p, '核心：高频字符短编码，低频字符长编码', {
    x: 400, y: 560, size: 30, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0
  });
  tw(question, { o: 1 }, m('ratio'));
}, { audio: 'intro' }],

/* ── 2. fixed-length ──────────────────────────────────────── */
['fixed-length', '固定长度编码', (m, dur) => {
  const p = panel(0);

  // [[fixed]] 2.49s
  const title = T(p, '固定长度编码的问题', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('fixed'));

  const chars = ['A','B','C','D','E','F'];
  const codes = ['000','001','010','011','100','101'];
  const freqs = [45, 13, 12, 16, 9, 5];
  const rowMarks = ['six','three','abc','waste','same','reduce'];

  // [[six]] 7.05s – 标签
  const label = T(p, '6个字符，固定3位编码：', { x: 100, y: 150, size: 28, weight: 600, fill: TEXT_COLOR, o: 0 });
  tw(label, { o: 1 }, m('six'));

  chars.forEach((char, i) => {
    const y = 200 + i * 60;
    const g = G(p, { x: 100, y, o: 0 });
    T(g, char,               { x: 0,   y: 0, size: 32, weight: 700, fill: NODE_LEAF, anchor: 'start' });
    T(g, '→',                { x: 50,  y: 0, size: 28, fill: TEXT_COLOR, anchor: 'middle' });
    T(g, codes[i],           { x: 120, y: 0, size: 28, weight: 600, fill: CODE_1, anchor: 'start', family: 'monospace' });
    T(g, `频率: ${freqs[i]}`,{ x: 250, y: 0, size: 24, fill: TEXT_COLOR, anchor: 'start' });
    tw(g, { o: 1 }, m(rowMarks[i] || 'reduce'));
  });

  // [[same]] 33.39s – 问题说明
  const problem = T(p, '问题：A 出现45次，F 出现5次，编码长度却一样！', {
    x: 400, y: 540, size: 28, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0
  });
  tw(problem, { o: 1 }, m('same'));

  // [[reduce]] 40.03s
  const hint = T(p, '让高频字符用更短编码，总体长度大幅减少', {
    x: 400, y: 590, size: 24, weight: 500, fill: NODE_LEAF, anchor: 'middle', o: 0
  });
  tw(hint, { o: 1 }, m('reduce'));
}, { audio: 'fixed-length' }],

/* ── 3. variable-length ───────────────────────────────────── */
['variable-length', '变长编码', (m, dur) => {
  const p = panel(0);

  const title = T(p, '变长编码：频率决定长度', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('variable'));

  // [[freq]] 8.29s – 核心思想
  const idea = T(p, '高频字符用短编码：', { x: 100, y: 160, size: 32, weight: 600, fill: NODE_LEAF, o: 0 });
  tw(idea, { o: 1 }, m('freq'));

  const chars   = ['A',  'B',  'C'  ];
  const codes   = ['0',  '10', '110'];
  const freqs   = [45,   13,   12   ];
  const rowMks  = ['example','short','ambiguity'];

  chars.forEach((char, i) => {
    const y = 230 + i * 70;
    const g = G(p, { x: 150, y, o: 0 });
    const box = mk('rect', { x: 0, y: -30, width: 500, height: 60, fill: NODE_LEAF, opacity: 0.1, rx: 8 }, g);
    T(g, char,               { x:  20, y: 0, size: 36, weight: 700, fill: NODE_LEAF, anchor: 'start' });
    T(g, '→',               { x:  90, y: 0, size: 32, fill: TEXT_COLOR, anchor: 'middle' });
    T(g, codes[i],           { x: 180, y: 0, size: 32, weight: 700, fill: CODE_1, anchor: 'start', family: 'monospace' });
    T(g, `(频率: ${freqs[i]})`,{ x: 320, y: 0, size: 26, fill: TEXT_COLOR, anchor: 'start' });
    tw(g, { o: 1 }, m(rowMks[i]));
  });

  // [[ambiguity]] 20.19s – 问题
  const problem = T(p, '❌ 问题：01 可能是 "A,B" 或其他组合 → 歧义！', {
    x: 400, y: 480, size: 30, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0
  });
  tw(problem, { o: 1 }, m('ambiguity'));

  // [[prefix]] 29.11s
  const solution = T(p, '✅ 解决：前缀编码（Prefix Code）', {
    x: 400, y: 550, size: 32, weight: 700, fill: NODE_LEAF, anchor: 'middle', o: 0
  });
  tw(solution, { o: 1 }, m('prefix'));
}, { audio: 'variable-length' }],

/* ── 4. prefix-code ───────────────────────────────────────── */
['prefix-code', '前缀编码', (m, dur) => {
  const p = panel(0);

  const title = T(p, '前缀编码（Prefix Code）', { x: 400, y: 80, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('definition'));

  // [[definition]] 5.22s
  const defn = T(p, '定义：任何编码都不是另一个编码的前缀', {
    x: 400, y: 150, size: 30, weight: 600, fill: NODE_INTERNAL, anchor: 'middle', o: 0
  });
  tw(defn, { o: 1 }, m('definition'));

  // [[example]] 12.37s – 示例
  const examples = [
    { label: '✅ 合法前缀编码', codes: ['0','10','110','111'], valid: true,  y: 230 },
    { label: '❌ 非法（0 是 01 的前缀）', codes: ['0','01','10','11'], valid: false, y: 350 }
  ];

  const exMks = ['example','benefit'];

  examples.forEach(({ label, codes, valid, y }, i) => {
    const color = valid ? NODE_LEAF : NODE_SELECTED;
    const lbl = T(p, label, { x: 120, y: y - 20, size: 28, weight: 600, fill: color, o: 0 });
    tw(lbl, { o: 1 }, m(exMks[i]));

    codes.forEach((code, j) => {
      const box = mk('rect', {
        x: 100 + j * 140, y: y + 10, width: 120, height: 50,
        fill: color, opacity: 0.2, rx: 5, stroke: color, 'stroke-width': 2, o: 0
      }, p);
      tw(box, { o: 1 }, m(exMks[i]) + 0.15 * j);

      const text = T(p, code, {
        x: 160 + j * 140, y: y + 35, size: 28, weight: 700, fill: color,
        anchor: 'middle', family: 'monospace', o: 0
      });
      text.setAttribute('dominant-baseline', 'central');
      tw(text, { o: 1 }, m(exMks[i]) + 0.15 * j + 0.1);
    });
  });

  // [[scan]] 22.99s
  const benefit = T(p, '优点：解码无歧义，不需要分隔符', {
    x: 400, y: 500, size: 30, weight: 600, fill: NODE_LEAF, anchor: 'middle', o: 0
  });
  tw(benefit, { o: 1 }, m('scan'));

  // [[optimal]] 30.72s
  const opt = T(p, '霍夫曼编码 = 最优前缀编码', {
    x: 400, y: 560, size: 30, weight: 700, fill: NODE_MERGED, anchor: 'middle', o: 0
  });
  tw(opt, { o: 1 }, m('optimal'));
}, { audio: 'prefix-code' }],

/* ── 5. huffman-tree-demo ─────────────────────────────────── */
['huffman-tree-demo', '构建霍夫曼树（核心动画）', (m, dur) => {
  const p = panel(0);

  const title = T(p, '构建霍夫曼树：贪心合并', { x: 400, y: 50, size: 40, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('build'));

  // [[build]] 2.63s – 初始节点
  const initNodes = [
    { char: 'A', freq: 45, x: 100, y: 150 },
    { char: 'B', freq: 13, x: 220, y: 150 },
    { char: 'C', freq: 12, x: 340, y: 150 },
    { char: 'D', freq: 16, x: 460, y: 150 },
    { char: 'E', freq:  9, x: 580, y: 150 },
    { char: 'F', freq:  5, x: 700, y: 150 }
  ];

  const nodes = {};
  initNodes.forEach((n, i) => {
    nodes[n.char] = drawNode(p, n.x, n.y, n.char, n.freq, NODE_LEAF);
    tw(nodes[n.char].g, { o: 1 }, m('build') + i * 0.2);
  });

  // [[freq]] 14.19s – 频率标签
  const freqLabel = T(p, '六个字符及频率，放入优先队列', { x: 400, y: 220, size: 24, weight: 600, fill: NODE_INTERNAL, anchor: 'middle', o: 0 });
  tw(freqLabel, { o: 1 }, m('freq'));

  // [[queue]] 22.49s – 队列说明
  const queueLabel = T(p, '优先队列（最小堆）：每次取最小两个合并', { x: 400, y: 255, size: 22, weight: 600, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  tw(queueLabel, { o: 1 }, m('queue'));

  // [[step1]] 29.38s – 合并 F(5) + E(9) = 14
  const step1Label = T(p, 'Step 1：F(5) + E(9) = 14', { x: 400, y: 290, size: 26, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0 });
  tw(step1Label, { o: 1 }, m('step1'));
  tw(nodes['F'].circle, { fill: NODE_SELECTED }, m('step1'));
  tw(nodes['E'].circle, { fill: NODE_SELECTED }, m('step1') + 0.3);
  const node_FE = drawNode(p, 640, 330, 'FE', 14, NODE_INTERNAL);
  tw(node_FE.g,  { o: 1 }, m('step1') + 0.6);
  const edge_F  = drawEdge(p, 700, 180, 665, 300, '0', CODE_0);
  tw(edge_F.g,  { o: 1 }, m('step1') + 0.8);
  const edge_E  = drawEdge(p, 580, 180, 615, 300, '1', CODE_1);
  tw(edge_E.g,  { o: 1 }, m('step1') + 1.0);

  // [[back]] 31.0s – 新节点入队
  const backLabel = T(p, '新节点 FE(14) 放回队列', { x: 400, y: 325, size: 22, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  tw(backLabel, { o: 1 }, m('back'));

  // [[step2]] 37.89s – 合并 C(12) + B(13) = 25
  const step2Label = T(p, 'Step 2：C(12) + B(13) = 25', { x: 400, y: 355, size: 26, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0 });
  tw(step2Label, { o: 1 }, m('step2'));
  tw(nodes['C'].circle, { fill: NODE_SELECTED }, m('step2'));
  tw(nodes['B'].circle, { fill: NODE_SELECTED }, m('step2') + 0.3);
  const node_CB = drawNode(p, 280, 330, 'CB', 25, NODE_INTERNAL);
  tw(node_CB.g,  { o: 1 }, m('step2') + 0.6);
  const edge_C  = drawEdge(p, 340, 180, 305, 300, '0', CODE_0);
  tw(edge_C.g,  { o: 1 }, m('step2') + 0.8);
  const edge_B  = drawEdge(p, 220, 180, 255, 300, '1', CODE_1);
  tw(edge_B.g,  { o: 1 }, m('step2') + 1.0);

  // [[step3]] 45.19s – 合并 FE(14) + D(16) = 30
  const step3Label = T(p, 'Step 3：FE(14) + D(16) = 30', { x: 400, y: 390, size: 26, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0 });
  tw(step3Label, { o: 1 }, m('step3'));
  tw(node_FE.circle, { fill: NODE_SELECTED }, m('step3'));
  tw(nodes['D'].circle, { fill: NODE_SELECTED }, m('step3') + 0.3);
  const node_FED = drawNode(p, 550, 450, '30', 30, NODE_INTERNAL);
  tw(node_FED.g,  { o: 1 }, m('step3') + 0.6);
  const edge_FE = drawEdge(p, 640, 360, 575, 420, '0', CODE_0);
  tw(edge_FE.g,  { o: 1 }, m('step3') + 0.8);
  const edge_D  = drawEdge(p, 460, 180, 525, 420, '1', CODE_1);
  tw(edge_D.g,  { o: 1 }, m('step3') + 1.0);

  // [[step4]] 53.3s – 合并 CB(25) + FED(30) = 55
  const step4Label = T(p, 'Step 4：CB(25) + FED(30) = 55', { x: 400, y: 425, size: 26, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0 });
  tw(step4Label, { o: 1 }, m('step4'));
  tw(node_CB.circle,  { fill: NODE_SELECTED }, m('step4'));
  tw(node_FED.circle, { fill: NODE_SELECTED }, m('step4') + 0.3);
  const node_CBFED = drawNode(p, 415, 530, '55', 55, NODE_INTERNAL);
  tw(node_CBFED.g,   { o: 1 }, m('step4') + 0.6);
  const edge_CB  = drawEdge(p, 280, 360, 390, 500, '0', CODE_0);
  tw(edge_CB.g,  { o: 1 }, m('step4') + 0.8);
  const edge_FED = drawEdge(p, 550, 480, 440, 500, '1', CODE_1);
  tw(edge_FED.g, { o: 1 }, m('step4') + 1.0);

  // [[final]] 61.81s – 最终合并 A(45) + 55 = 100
  const finalLabel = T(p, 'Step 5：A(45) + 55 = 100（根节点）', { x: 400, y: 460, size: 26, weight: 600, fill: NODE_MERGED, anchor: 'middle', o: 0 });
  tw(finalLabel, { o: 1 }, m('final'));
  tw(nodes['A'].circle,  { fill: NODE_MERGED }, m('final'));
  tw(node_CBFED.circle,  { fill: NODE_MERGED }, m('final') + 0.3);
  const root = drawNode(p, 250, 570, 'Root', 100, NODE_MERGED);
  tw(root.g,    { o: 1 }, m('final') + 0.6);
  const edge_A  = drawEdge(p, 100, 180, 225, 540, '0', CODE_0);
  tw(edge_A.g,  { o: 1 }, m('final') + 0.8);
  const edge_55 = drawEdge(p, 415, 560, 275, 540, '1', CODE_1);
  tw(edge_55.g, { o: 1 }, m('final') + 1.0);

  // [[done]] 63.63s
  const done = T(p, '✅ 霍夫曼树构建完成！', {
    x: 400, y: 620, size: 32, weight: 700, fill: NODE_LEAF, anchor: 'middle', o: 0
  });
  tw(done, { o: 1 }, m('done'));

  // [[tree]] 66.67s
  const treeNote = T(p, '这棵树就是最优前缀编码的基础', {
    x: 400, y: 660, size: 26, weight: 500, fill: TEXT_COLOR, anchor: 'middle', o: 0
  });
  tw(treeNote, { o: 1 }, m('tree'));
}, { audio: 'huffman-tree-demo' }],

/* ── 6. tree-to-code ──────────────────────────────────────── */
['tree-to-code', '从树到编码', (m, dur) => {
  const p = panel(0);

  const title = T(p, '生成霍夫曼编码', { x: 400, y: 70, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('simple'));

  // [[rule]] 7.44s – 规则
  const rule = T(p, '规则：左子树 = 0，右子树 = 1', { x: 400, y: 140, size: 28, weight: 600, fill: NODE_INTERNAL, anchor: 'middle', o: 0 });
  tw(rule, { o: 1 }, m('rule'));

  // [[path]] 11.26s – 根节点
  const rootX = 400, rootY = 220;
  const root = drawNode(p, rootX, rootY, '', 100, NODE_MERGED);
  tw(root.g, { o: 1 }, m('path'));

  // [[a]] 14.88s – A
  const nodeA = drawNode(p, 200, 320, 'A', 45, NODE_LEAF);
  tw(nodeA.g, { o: 1 }, m('a'));
  const edgeA = drawEdge(p, rootX, rootY + 30, 200, 290, '0', CODE_0);
  tw(edgeA.g, { o: 1 }, m('a') + 0.2);

  // 右子树节点55 – 随 A 一起出现
  const node55 = drawNode(p, 600, 320, '', 55, NODE_INTERNAL);
  tw(node55.g, { o: 1 }, m('a') + 0.4);
  const edge55 = drawEdge(p, rootX, rootY + 30, 600, 290, '1', CODE_1);
  tw(edge55.g, { o: 1 }, m('a') + 0.5);

  // [[f]] 20.11s – F 路径
  const nodeCB = drawNode(p, 480, 420, '', 25, NODE_INTERNAL);
  tw(nodeCB.g, { o: 1 }, m('f'));
  const edgeCB = drawEdge(p, 600, 350, 505, 390, '0', CODE_0);
  tw(edgeCB.g, { o: 1 }, m('f') + 0.2);

  const nodeC = drawNode(p, 420, 520, 'C', 12, NODE_LEAF);
  tw(nodeC.g, { o: 1 }, m('f') + 0.4);
  const edgeC = drawEdge(p, 480, 450, 445, 490, '0', CODE_0);
  tw(edgeC.g, { o: 1 }, m('f') + 0.5);

  const nodeB = drawNode(p, 540, 520, 'B', 13, NODE_LEAF);
  tw(nodeB.g, { o: 1 }, m('f') + 0.7);
  const edgeB = drawEdge(p, 480, 450, 515, 490, '1', CODE_1);
  tw(edgeB.g, { o: 1 }, m('f') + 0.8);

  const nodeFED = drawNode(p, 720, 420, '', 30, NODE_INTERNAL);
  tw(nodeFED.g, { o: 1 }, m('f') + 1.0);
  const edgeFED = drawEdge(p, 600, 350, 695, 390, '1', CODE_1);
  tw(edgeFED.g, { o: 1 }, m('f') + 1.1);

  const nodeD = drawNode(p, 660, 520, 'D', 16, NODE_LEAF);
  tw(nodeD.g, { o: 1 }, m('f') + 1.3);
  const edgeD = drawEdge(p, 720, 450, 685, 490, '0', CODE_0);
  tw(edgeD.g, { o: 1 }, m('f') + 1.4);

  // [[codes]] 26.95s – 编码表
  const codesData = [
    { char: 'A', code: '0',    y: 200, color: NODE_LEAF     },
    { char: 'C', code: '100',  y: 260, color: NODE_LEAF     },
    { char: 'B', code: '101',  y: 320, color: NODE_LEAF     },
    { char: 'D', code: '110',  y: 380, color: NODE_LEAF     },
    { char: 'E', code: '1111', y: 440, color: NODE_LEAF     },
    { char: 'F', code: '1110', y: 500, color: NODE_LEAF     }
  ];

  const tblLbl = T(p, '编码表：', { x: 50, y: 150, size: 28, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(tblLbl, { o: 1 }, m('codes'));

  codesData.forEach(({ char, code, y, color }, i) => {
    const box = drawCodeBox(p, 50, y, char, code, color);
    tw(box.g, { o: 1 }, m('codes') + i * 0.3);
  });

  // [[length]] 32.98s
  const lengthNote = T(p, '高频 A 只用1位；低频 F/E 用4位', { x: 400, y: 580, size: 26, weight: 600, fill: NODE_SELECTED, anchor: 'middle', o: 0 });

/* ── 7. encode-decode-demo ────────────────────────────────── */
['encode-decode-demo', '编码解码演示（核心动画）', (m, dur) => {
  const p = panel(0);

  const title = T(p, '编码与解码过程', { x: 400, y: 50, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(title, { o: 1 }, m('demo'));

  // [[text]] 7.08s – 原始文本
  const textLabel = T(p, '原始文本：', { x: 50, y: 120, size: 28, weight: 600, fill: TEXT_COLOR, o: 0 });
  tw(textLabel, { o: 1 }, m('text'));

  const textChars = ['A','A','B','D','A','C'];
  textChars.forEach((char, i) => {
    const box = mk('rect', {
      x: 200 + i * 80, y: 95, width: 60, height: 50,
      fill: NODE_LEAF, opacity: 0.2, rx: 5, stroke: NODE_LEAF, 'stroke-width': 2, o: 0
    }, p);
    tw(box, { o: 1 }, m('text') + i * 0.15);
    const charText = T(p, char, { x: 230 + i * 80, y: 120, size: 32, weight: 700, fill: NODE_LEAF, anchor: 'middle', o: 0 });
    charText.setAttribute('dominant-baseline', 'central');
    tw(charText, { o: 1 }, m('text') + i * 0.15 + 0.1);
  });

  // [[lookup]] 14.56s – 编码表
  const codeMap = { 'A': '0', 'B': '101', 'C': '100', 'D': '110' };
  const tableLabel = T(p, '编码表：A→0, B→101, C→100, D→110', { x: 400, y: 190, size: 24, weight: 600, fill: NODE_INTERNAL, anchor: 'middle', o: 0 });
  tw(tableLabel, { o: 1 }, m('lookup'));

  // [[encode]] 19.22s – 编码过程
  const encLabel = T(p, '编码过程：', { x: 50, y: 240, size: 28, weight: 600, fill: TEXT_COLOR, o: 0 });
  tw(encLabel, { o: 1 }, m('encode'));

  // Spread 6 encoding rows evenly from encode(19.22) to concat(23.06) ≈ 0.64s each
  const encodeSpan = m('concat') - m('encode');
  let xOffset = 200;
  textChars.forEach((char, i) => {
    const code = codeMap[char];
    const t = m('encode') + (encodeSpan / textChars.length) * i;
    const arrow = T(p, `${char} →`, { x: xOffset - 40, y: 265 + i * 38, size: 24, weight: 600, fill: TEXT_COLOR, o: 0 });
    tw(arrow, { o: 1 }, t);
    code.split('').forEach((bit, j) => {
      const bitBox = drawBinaryBit(p, xOffset + j * 35, 245 + i * 38, bit, bit === '0' ? CODE_0 : CODE_1);
      tw(bitBox.g, { o: 1 }, t + 0.1 + j * 0.08);
    });
    xOffset += code.length * 35 + 20;
  });

  // [[concat]] 23.06s – 拼接结果
  const concatLabel = T(p, '最终编码：', { x: 50, y: 490, size: 28, weight: 700, fill: NODE_SELECTED, o: 0 });
  tw(concatLabel, { o: 1 }, m('concat'));
  const finalBin = T(p, '0 0 101 110 0 100', { x: 220, y: 490, size: 28, weight: 700, fill: CODE_1, anchor: 'start', family: 'monospace', o: 0 });
  tw(finalBin, { o: 1 }, m('concat') + 0.3);

  // [[compare]] 30.14s – 比较
  const compare = T(p, '11位 vs 固定编码18位', { x: 400, y: 535, size: 26, weight: 600, fill: NODE_INTERNAL, anchor: 'middle', o: 0 });
  tw(compare, { o: 1 }, m('compare'));

  // [[save]] 32.37s
  const save = T(p, '节省了将近40%！', { x: 400, y: 575, size: 30, weight: 700, fill: NODE_LEAF, anchor: 'middle', o: 0 });
  tw(save, { o: 1 }, m('save'));

  // [[decode]] 34.19s – 切解码面板
  const p2 = panel(1);
  const decTitle = T(p2, '解码过程', { x: 400, y: 50, size: 44, weight: 700, fill: TEXT_COLOR, o: 0 });
  tw(decTitle, { o: 1 }, m('decode'));

  const binInput = T(p2, '输入：00101110100', { x: 400, y: 120, size: 28, weight: 600, fill: CODE_1, anchor: 'middle', family: 'monospace', o: 0 });
  tw(binInput, { o: 1 }, m('decode') + 0.3);

  // [[scan]] 37.83s
  const scanLabel = T(p2, '从左到右扫描，从根走树：', { x: 50, y: 170, size: 26, weight: 600, fill: TEXT_COLOR, o: 0 });
  tw(scanLabel, { o: 1 }, m('scan'));

  // [[walk]] 41.47s – 遍历说明
  const walkLabel = T(p2, '0→左，1→右，到叶子输出字符，回根', { x: 400, y: 210, size: 24, weight: 500, fill: NODE_INTERNAL, anchor: 'middle', o: 0 });
  tw(walkLabel, { o: 1 }, m('walk'));

  // [[output]] 45.72s – 解码步骤出现
  const decodeSteps = [
    { bits: '0',   char: 'A', desc: '读 0 → A',   mark: 'first'  },
    { bits: '0',   char: 'A', desc: '读 0 → A',   mark: 'second' },
    { bits: '101', char: 'B', desc: '读 101 → B', mark: 'third'  },
    { bits: '110', char: 'D', desc: '读 110 → D', mark: 'rest'   },
    { bits: '0',   char: 'A', desc: '读 0 → A',   mark: 'rest'   },
    { bits: '100', char: 'C', desc: '读 100 → C', mark: 'rest'   }
  ];

  decodeSteps.forEach(({ desc, char, mark }, i) => {
    const stepG = G(p2, { x: 80, y: 250 + i * 50, o: 0 });
    T(stepG, desc, { x: 0, y: 0, size: 24, weight: 600, fill: NODE_INTERNAL, anchor: 'start' });
    T(stepG, '→',  { x: 180, y: 0, size: 24, fill: TEXT_COLOR, anchor: 'middle' });
    mk('rect', { x: 220, y: -20, width: 50, height: 40, fill: NODE_LEAF, opacity: 0.3, rx: 5, stroke: NODE_LEAF, 'stroke-width': 2 }, stepG);
    const ct = T(stepG, char, { x: 245, y: 0, size: 28, weight: 700, fill: NODE_LEAF, anchor: 'middle' });
    ct.setAttribute('dominant-baseline', 'central');
    // stagger within the mark window
    const delay = (mark === 'rest') ? (i - 3) * 0.4 : 0;
    tw(stepG, { o: 1 }, m(mark) + delay);
  });

  // [[done]] 65.54s
  const result = T(p2, '解码结果：A A B D A C ✅', {
    x: 400, y: 580, size: 32, weight: 700, fill: NODE_LEAF, anchor: 'middle', o: 0
  });
  tw(result, { o: 1 }, m('done'));
}, { audio: 'encode-decode-demo' }],

/* ── 8. implementation ────────────────────────────────────── */
['implementation', '算法实现', (m, dur) => {

    { title: 'Step 3: 贪心合并',  code: 'while len(heap) > 1:\n  f1, n1 = heappop(heap)\n  f2, n2 = heappop(heap)\n  merged = Node(n1,n2,f1+f2)\n  heappush(heap,(f1+f2,merged))', y: 370, color: NODE_MERGED,   mark: 'merge'    },
    { title: 'Step 4: 生成编码表', code: 'def dfs(node, code):\n  if node.is_leaf:\n    table[node.char] = code\n  else:\n    dfs(node.left, code+"0")\n    dfs(node.right, code+"1")',  y: 510, color: CODE_1,        mark: 'generate' }
  ];

/* ── 9. complexity ────────────────────────────────────────── */

    { step: '贪心',   text: '霍夫曼每次合并最小两个节点，保证低频在深层',       y: 455, color: CODE_1,        mark: 'greedy'    },
    { step: '归纳',   text: '归纳法证明：霍夫曼编码平均长度最短',               y: 530, color: NODE_LEAF,     mark: 'induction' }

const NODE_SCC3 = '#1abc9c';        // 青色（SCC3）
const NODE_SCC4 = '#e67e22';        // 深橙色（SCC4）
const EDGE_DEFAULT = '#7f8c8d';     // 灰色（默认边）
const EDGE_ACTIVE = '#e74c3c';      // 红色（活跃边）
const EDGE_BACK = '#f39c12';        // 橙色（回边）

const BG_LIGHT = '#ecf0f1';         // 浅灰背景
const STACK_COLOR = '#34495e';      // 深灰（栈）

/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, color = NODE_DEFAULT) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { cx: 0, cy: 0, r: 28, fill: color, stroke: TEXT_COLOR, 'stroke-width': 3 }, g);
  const text = T(g, label, { x: 0, y: 0, size: 24, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, circle, text };
}

function drawEdge(parent, x1, y1, x2, y2, color = EDGE_DEFAULT) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const endX = x2 - 28 * Math.cos(angle);
  const endY = y2 - 28 * Math.sin(angle);
  
  const g = G(parent, { o: 0 });
  const line = mk('line', { x1, y1, x2: endX, y2: endY, stroke: color, 'stroke-width': 3 }, g);
  
  // Arrow head
  const arrowSize = 10;
  const arrowX = endX - arrowSize * Math.cos(angle - Math.PI / 6);
  const arrowY = endY - arrowSize * Math.sin(angle - Math.PI / 6);
  const arrowX2 = endX - arrowSize * Math.cos(angle + Math.PI / 6);
  const arrowY2 = endY - arrowSize * Math.sin(angle + Math.PI / 6);
  
  const arrow = mk('polygon', { 
    points: `${endX},${endY} ${arrowX},${arrowY} ${arrowX2},${arrowY2}`, 
    fill: color 
  }, g);
  
  return { g, line, arrow };
}

function drawStackBox(parent, x, y, label, color = STACK_COLOR) {
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', { x: 0, y: 0, width: 60, height: 40, fill: color, opacity: 0.2, rx: 5, stroke: color, 'stroke-width': 2 }, g);
  const text = T(g, label, { x: 30, y: 20, size: 20, weight: 700, fill: color, anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return { g, rect, text };
}

function drawInfoBox(parent, x, y, label, value) {
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', { x: 0, y: 0, width: 140, height: 35, fill: BG_LIGHT, rx: 5, stroke: TEXT_COLOR, 'stroke-width': 2 }, g);
  const labelText = T(g, label, { x: 10, y: 17, size: 16, weight: 600, fill: TEXT_COLOR, anchor: 'start' });
  labelText.setAttribute('dominant-baseline', 'central');
  const valueText = T(g, value, { x: 130, y: 17, size: 18, weight: 700, fill: NODE_CURRENT, anchor: 'end', family: 'monospace' });
  valueText.setAttribute('dominant-baseline', 'central');
  return { g, rect, labelText, valueText };
}

  const code = `function kosaraju(graph) {
  const stack = [];
  const visited = new Set();
  
  // 第一次DFS：记录完成时间
  for (let v of graph.vertices) {
    if (!visited.has(v)) {
      dfs1(v, graph, visited, stack);
    }
  }
  
  // 构建反向图
  const reversed = reverseGraph(graph);
  
  // 第二次DFS：识别SCC
  visited.clear();
  const sccs = [];
  while (stack.length > 0) {
    const v = stack.pop();
    if (!visited.has(v)) {
      const scc = [];
      dfs2(v, reversed, visited, scc);
      sccs.push(scc);

['tarjan-impl', 'Tarjan实现', (m, dur) => {
  const p = panel(0);
  
  const title = T(p, 'Tarjan实现', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0, 0.3);
  
  const code = `function tarjan(graph) {
  let time = 0;
  const dfn = {}, low = {}, inStack = {};
  const stack = [], sccs = [];
  
  function dfs(v) {
    dfn[v] = low[v] = time++;
    stack.push(v);
    inStack[v] = true;
    
    for (let u of graph.neighbors(v)) {
      if (!dfn[u]) {
        dfs(u);
        low[v] = Math.min(low[v], low[u]);
      } else if (inStack[u]) {
        low[v] = Math.min(low[v], dfn[u]);
      }
    }
    
    if (low[v] === dfn[v]) {
      const scc = [];
      let u;
      do {
        u = stack.pop();
        inStack[u] = false;
        scc.push(u);
      } while (u !== v);
      sccs.push(scc);
    }
  }
  
  for (let v of graph.vertices) {
    if (!dfn[v]) dfs(v);
  }
  return sccs;
}`;
  
  const codeLines = code.split('\n');
  const lineMarks = [
    { range: [0, 3], mark: 'complex' },
    { range: [5, 8], mark: 'dfs-num' },
    { range: [10, 16], mark: 'two-cases' },
    { range: [18, 27], mark: 'root' },
    { range: [29, 32], mark: 'complexity' }
  ];
  
  codeLines.forEach((line, i) => {
    const lineMarkObj = lineMarks.find(lm => i >= lm.range[0] && i <= lm.range[1]);
    const mark = lineMarkObj ? lineMarkObj.mark : 'complex';
    const t = T(p, line, { x: 30, y: 110 + i * 16, size: 13.5, fill: TEXT_COLOR, anchor: 'start', family: 'monospace', o: 0 });
    tw(t, { o: 1 }, 0.3, m(mark) + (i - (lineMarkObj ? lineMarkObj.range[0] : 0)) * 0.03);
  });
  
  const complexity = T(p, '时间：O(V+E)，空间：O(V)', { x: 400, y: 550, size: 24, weight: 600, fill: NODE_SCC2, anchor: 'middle', o: 0 });
  tw(complexity, { o: 1 }, m('complexity'), 0.5);
}, { audio: 'tarjan-impl' }],

<script>
// Test function to get correct animation ratios
window.testBeatRatios = function() {
  const results = [];
  BEATS.forEach((b, i) => {
    const timing = TIMINGS[b.id];
    if (!timing) return;
    P.i = i;
    runBeat(i);
    const animEnd = Math.max(0, ...TW.map(w => w.t0 + w.dur));
    const ratio = animEnd / timing.dur;
    results.push({
      id: b.id,
      animEnd: animEnd.toFixed(2),
      dur: timing.dur.toFixed(2),
      ratio: ratio.toFixed(2),
      pass: ratio >= 0.8 && ratio <= 1.2
    });
  });
  return results;
};
</script>

<script>
// Test function for content coverage
window.testContentCoverage = function() {
  const results = [];
  
  BEATS.forEach((beat, i) => {
    const beatId = beat.id;
    const timing = TIMINGS[beatId];
    if (!timing) return;
    
    try {
      P.i = i;
      runBeat(i);
      
      // Metric 1: Animation end ratio
      const animEnd = Math.max(0, ...TW.map(w => w.t0 + w.dur));
      const ratio = animEnd / timing.dur;
      
      // Metric 2: Content coverage - sample every 0.5s
      let lastChangeTime = 0;
      const sampleInterval = 0.5;
      let prevSignature = '';
      
      for (let t = 0; t <= timing.dur; t += sampleInterval) {
        const visibleElements = [];
        
        TW.forEach(w => {
          if (w.t0 <= t && t < w.t0 + w.dur) {
            const elem = w.e;
            if (elem && elem.textContent) {
              visibleElements.push({
                text: elem.textContent,
                opacity: w.to.o !== undefined ? w.to.o : 1,
                fill: w.to.fill || ''
              });
            }
          }
        });
        
        const signature = JSON.stringify(visibleElements.sort((a,b) => 
          a.text.localeCompare(b.text)
        ));
        
        if (signature !== prevSignature && signature !== '[]') {
          lastChangeTime = t;
          prevSignature = signature;
        }
      }
      
      const coverage = lastChangeTime / timing.dur;
      
      results.push({
        id: beatId,
        animEnd: animEnd.toFixed(2),
        dur: timing.dur.toFixed(2),
        ratio: ratio.toFixed(2),
        lastChange: lastChangeTime.toFixed(2),
        coverage: coverage.toFixed(2),
        ratioPass: ratio >= 0.8 && ratio <= 1.2,
        coveragePass: coverage >= 0.7
      });
    } catch(e) {
      results.push({ id: beatId, error: true, msg: e.message });
    }
  });
  
  return results;
};
</script>

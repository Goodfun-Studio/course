/* ---------- 辅助函数 ---------- */
function drawNode(parent, x, y, label, color = '#fff') {
  const g = G(parent, { x, y, o: 0 });
  mk('circle', { cx: 0, cy: 0, r: 30, fill: color, stroke: TEXT_COLOR, 'stroke-width': 3 }, g);
  const text = T(g, label, { x: 0, y: 0, size: 24, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  return g;
}

function drawEdge(parent, x1, y1, x2, y2, capacity, flow = 0, showArrow = true) {
  const g = G(parent, { o: 0 });
  
  // 计算箭头位置（留出节点半径30）
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const nx = dx / len;
  const ny = dy / len;
  
  const startX = x1 + nx * 30;
  const startY = y1 + ny * 30;
  const endX = x2 - nx * 30;
  const endY = y2 - ny * 30;
  
  // 边
  const line = mk('line', { 
    x1: startX, y1: startY, x2: endX, y2: endY,
    stroke: TEXT_COLOR, 'stroke-width': 3
  }, g);
  
  // 箭头
  if (showArrow) {
    const angle = Math.atan2(dy, dx);
    const arrowSize = 10;
    const arrowX = endX;
    const arrowY = endY;
    const arrow = mk('polygon', {
      points: `${arrowX},${arrowY} ${arrowX - arrowSize * Math.cos(angle - Math.PI / 6)},${arrowY - arrowSize * Math.sin(angle - Math.PI / 6)} ${arrowX - arrowSize * Math.cos(angle + Math.PI / 6)},${arrowY - arrowSize * Math.sin(angle + Math.PI / 6)}`,
      fill: TEXT_COLOR
    }, g);
  }
  
  // 标签位置（中点偏移）
  const midX = (startX + endX) / 2;
  const midY = (startY + endY) / 2;
  const offsetX = -ny * 15;
  const offsetY = nx * 15;
  
  const label = T(g, `${flow}/${capacity}`, { 
    x: midX + offsetX, 
    y: midY + offsetY, 
    size: 18, 
    weight: 600, 
    fill: FLOW, 
    anchor: 'middle' 
  });
  
  return { g, line, label };
}

function drawNetwork(parent, edges, flows = {}) {
  const g = G(parent, { o: 0 });
  
  // 节点位置
  const positions = {
    'S': { x: 100, y: 250 },
    'A': { x: 250, y: 150 },
    'B': { x: 250, y: 350 },
    'C': { x: 450, y: 150 },
    'D': { x: 450, y: 350 },
    'T': { x: 600, y: 250 }
  };
  
  // 绘制边
  const edgeElements = {};
  edges.forEach(({ from, to, capacity, id }) => {
    const flow = flows[id] || 0;
    const p1 = positions[from];
    const p2 = positions[to];
    edgeElements[id] = drawEdge(g, p1.x, p1.y, p2.x, p2.y, capacity, flow);
  });
  
  // 绘制节点
  const nodes = {};
  nodes['S'] = drawNode(g, positions['S'].x, positions['S'].y, 'S', SOURCE);
  nodes['A'] = drawNode(g, positions['A'].x, positions['A'].y, 'A', '#fff');
  nodes['B'] = drawNode(g, positions['B'].x, positions['B'].y, 'B', '#fff');
  nodes['C'] = drawNode(g, positions['C'].x, positions['C'].y, 'C', '#fff');
  nodes['D'] = drawNode(g, positions['D'].x, positions['D'].y, 'D', '#fff');
  nodes['T'] = drawNode(g, positions['T'].x, positions['T'].y, 'T', SINK);
  
  return { g, nodes, edges: edgeElements, positions };
}

function updateEdgeLabel(edge, flow, capacity) {
  const label = edge.label;
  tw(label, { o: 0 }, 0.3, () => {
    label.textContent = `${flow}/${capacity}`;
    tw(label, { o: 1 }, 0.3);
  });
}

function highlightPath(network, path, duration = 0.5) {
  path.forEach(edgeId => {
    const edge = network.edges[edgeId];
    tw(edge.line, { stroke: PATH, 'stroke-width': 5 }, duration);
  });
}

function resetPath(network, path, duration = 0.5) {
  path.forEach(edgeId => {
    const edge = network.edges[edgeId];
    tw(edge.line, { stroke: TEXT_COLOR, 'stroke-width': 3 }, duration);
  });
}

['implementation', '算法实现', () => {
  const p = panel(0);
  
  T(p, 'Edmonds-Karp 实现', { x: 400, y: 60, size: 40, weight: 700, fill: TEXT_COLOR, o: 0 });
  
  const code = `function maxFlow(graph, source, sink) {
  let totalFlow = 0;
  
  while (true) {
    // BFS查找增广路径
    const path = bfs(graph, source, sink);
    if (!path) break;  // 无增广路径
    
    // 找瓶颈容量
    let bottleneck = Infinity;
    for (let edge of path) {
      bottleneck = Math.min(bottleneck, 
                           edge.capacity - edge.flow);
    }
    
    // 更新流量
    for (let edge of path) {
      edge.flow += bottleneck;
      edge.reverse.flow -= bottleneck;
    }
    
    totalFlow += bottleneck;
  }
  
  return totalFlow;
}`;
  
  const codeLines = code.split('\n');
  let y = 140;
  codeLines.forEach((line, i) => {
    const t = T(p, line, { x: 80, y: y, size: 16, weight: 500, fill: TEXT_COLOR, o: 0, family: 'monospace' });

  tw(note, { o: 1 }, 0.5, null, 2);
}],

    { x: 450, y: 80, label: 'T', color: SINK }
  ];
  
  nodes.forEach(({ x, y, label, color }) => {
    drawNode(cutG, x, y, label, color);
  });
  
  // 割线
  const cutLine = mk('line', { x1: 270, y1: 20, x2: 270, y2: 140, stroke: HIGHLIGHT, 'stroke-width': 5, 'stroke-dasharray': '10,5' }, cutG);
  T(cutG, '最小割', { x: 275, y: 0, size: 20, weight: 700, fill: HIGHLIGHT });
  
  tw(example, { o: 1 }, 0.5, null, 0.5);
  
  const note = T(p, '这个定理保证了Ford-Fulkerson算法的正确性', { x: 400, y: 520, size: 20, weight: 600, fill: HIGHLIGHT, o: 0, anchor: 'middle' });
  tw(note, { o: 1 }, 0.5, null, 1);
}],

/* ---------- 辅助函数 ---------- */
function drawSegmentTree(parent, data, options = {}) {
  const g = G(parent, { o: 0 });
  const n = data.length;
  
  // 构建线段树结构（数组存储）
  const tree = new Array(4 * n);
  const nodeElements = [];
  
  // 计算树节点位置（层级布局）
  function getNodePosition(index, level, posInLevel, nodesInLevel) {
    const baseY = 100 + level * 120;
    const spacing = 1000 / (nodesInLevel + 1);
    const baseX = spacing * (posInLevel + 1);
    return { x: baseX, y: baseY };
  }
  
  return { g, tree, nodeElements };
}

function drawArray(parent, arr, x, y, options = {}) {
  const g = G(parent, { o: 0 });
  const cellWidth = 60;
  const cellHeight = 50;
  
  const cells = [];
  arr.forEach((val, i) => {
    const cx = x + i * cellWidth;
    const rect = mk('rect', {
      x: cx, y: y, width: cellWidth, height: cellHeight,
      fill: options.colors?.[i] || COLOR_ARRAY,
      stroke: COLOR_TEXT,
      'stroke-width': 2,
      o: 0
    }, g);
    
    const text = T(g, val, { x: cx + cellWidth/2, y: y + cellHeight/2, fill: COLOR_TEXT,
      'font-size': 20,
      'font-weight': 'bold',
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      o: 0 });
    
    cells.push({ rect, text, x: cx, y });
  });
  
  return { g, cells };
}

function drawTreeNode(parent, x, y, range, value, options = {}) {
  const g = G(parent, { o: 0 });
  const width = 80;
  const height = 70;
  
  const rect = mk('rect', {
    x: x - width/2, y: y - height/2, width, height,
    fill: options.fill || COLOR_NODE,
    stroke: COLOR_TEXT,
    'stroke-width': 2,
    rx: 5,
    o: 0
  }, g);
  
  const rangeText = T(g, `[${range[0]},${range[1]}]`, { x: x, y: y - 15, fill: 'white',
    'font-size': 14,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    o: 0 });
  
  const valueText = T(g, value !== undefined ? value : '?', { x: x, y: y + 10,
    fill: 'white',
    'font-size': 18,
    'font-weight': 'bold',
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    o: 0
  });
  
  return { g, rect, rangeText, valueText, x, y };
}

/* ---------- 时间轴桥接 ----------
   本章 beat 用 GSAP 风格：tl(elem, position, props [, ease])
   position = 秒数 | '<'(与前一个同时) | '>偏移'(前一个结束后偏移)
   引擎签名是 tw(elem, props, t0, dur, ease)。 */
let _tlStart = 0, _tlEnd = 0;
function tl(e, a, b, c, d) {
  const isPos = (typeof a === 'number') || (typeof a === 'string' && (a === '<' || a.charAt(0) === '>'));
  if (isPos) {
    let t0;
    if (typeof a === 'number') t0 = a;
    else if (a === '<') t0 = _tlStart;
    else t0 = _tlEnd + (parseFloat(a.slice(1)) || 0);
    const to = b || {};
    const ease = typeof c === 'function' ? c : (typeof d === 'function' ? d : undefined);
    _tlStart = t0;
    _tlEnd = Math.max(_tlEnd, t0 + 0.6);
    return ease ? tw(e, to, t0, 0.6, ease) : tw(e, to, t0, 0.6);
  }
  return tw(e, a, b, c, d);
}

/* L/C/PO 容忍 parent 在最后 */
function L_(first, ...rest) {
  if (first && typeof first.appendChild === 'function') {
    const [x1, y1, x2, y2, attrs = {}] = rest;
    return mk('line', Object.assign({ x1, y1, x2, y2 }, attrs), first);
  }
  const [y1, x2, y2, attrs = {}] = rest.length === 5 ? rest.slice(1) : rest;
  return mk('line', Object.assign({ x1: first, y1: rest[0], x2: rest[1], y2: rest[2] }, rest[3] || {}), rest[4]);
}
function C_(first, ...rest) {
  if (first && typeof first.appendChild === 'function') {
    const [x, y, r, attrs = {}] = rest;
    return mk('circle', Object.assign({ cx: x, cy: y, r }, attrs), first);
  }
  const [y, r, attrs = {}, p] = rest;
  return mk('circle', Object.assign({ cx: first, cy: y, r }, attrs), p);
}
function PO_(first, ...rest) {
  let pts, attrs, p;
  if (first && typeof first.appendChild === 'function') { p = first; pts = rest[0]; attrs = rest[1] || {}; }
  else { pts = first; attrs = rest[0] || {}; p = rest[1]; }
  const points = [];
  for (let i = 0; i < pts.length; i += 2) points.push(`${pts[i]},${pts[i+1]}`);
  return mk('polygon', Object.assign({ points: points.join(' ') }, attrs), p);
}
const Poly_ = PO_;

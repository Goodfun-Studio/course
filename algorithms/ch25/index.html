/* ---------- 辅助函数 ---------- */
function drawSegmentTree(parent, data, options = {}) {
  const g = G(parent, { o: 0 });
  const n = data.length;
  
  // 构建线段树结构（数组存储）
  const tree = new Array(4 * n);
  const nodeElements = [];
  
  // 计算树节点位置（层级布局）
  function getNodePosition(index, level, posInLevel, nodesInLevel) {
    const baseY = 100 + level * 120;
    const spacing = 1000 / (nodesInLevel + 1);
    const baseX = spacing * (posInLevel + 1);
    return { x: baseX, y: baseY };
  }
  
  return { g, tree, nodeElements };
}

function drawArray(parent, arr, x, y, options = {}) {
  const g = G(parent, { o: 0 });
  const cellWidth = 60;
  const cellHeight = 50;
  
  const cells = [];
  arr.forEach((val, i) => {
    const cx = x + i * cellWidth;
    const rect = R(cx, y, cellWidth, cellHeight, {
      fill: options.colors?.[i] || COLOR_ARRAY,
      stroke: COLOR_TEXT,
      'stroke-width': 2,
      o: 0
    }, g);
    
    const text = T(cx + cellWidth/2, y + cellHeight/2, val, {
      fill: COLOR_TEXT,
      'font-size': 20,
      'font-weight': 'bold',
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      o: 0
    }, g);
    
    cells.push({ rect, text, x: cx, y });
  });
  
  return { g, cells };
}

function drawTreeNode(parent, x, y, range, value, options = {}) {
  const g = G(parent, { o: 0 });
  const width = 80;
  const height = 70;
  
  const rect = R(x - width/2, y - height/2, width, height, {
    fill: options.fill || COLOR_NODE,
    stroke: COLOR_TEXT,
    'stroke-width': 2,
    rx: 5,
    o: 0
  }, g);
  
  const rangeText = T(x, y - 15, `[${range[0]},${range[1]}]`, {
    fill: 'white',
    'font-size': 14,
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    o: 0
  }, g);
  
  const valueText = T(x, y + 10, value !== undefined ? value : '?', {
    fill: 'white',
    'font-size': 18,
    'font-weight': 'bold',
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
    o: 0
  }, g);
  
  return { g, rect, rangeText, valueText, x, y };
}

  tw(header1, 0.5, { o: 1 }, '>0.3');
  tw(header2, 0.5, { o: 1 }, '>0');
  
  // 对比项
  const items = [
    { aspect: '功能', seg: '支持任意区间操作', fen: '只能前缀和类问题', y: 230 },
    { aspect: '懒惰标记', seg: '支持区间更新', fen: '不支持', y: 310 },
    { aspect: '效率', seg: '常数较大', fen: '常数更小', y: 390 },
    { aspect: '空间', seg: '4n', fen: 'n', y: 470 },
    { aspect: '实现', seg: '代码较长', fen: '代码简洁', y: 550 }
  ];
  
  items.forEach((item, i) => {
    const aspectText = T(100, item.y, item.aspect, {
      fill: COLOR_TEXT,
      'font-size': 24,
      'font-weight': 'bold',
      'text-anchor': 'start',
      o: 0
    }, p);
    tw(aspectText, 0.4, { o: 1 }, `>0.2+${i * 0.15}`);
    
    const segText = T(250, item.y, item.seg, {
      fill: COLOR_TEXT,
      'font-size': 22,
      'text-anchor': 'middle',
      o: 0
    }, p);
    tw(segText, 0.4, { o: 1 }, '>0.1');
    
    const fenText = T(750, item.y, item.fen, {
      fill: COLOR_TEXT,
      'font-size': 22,
      'text-anchor': 'middle',
      o: 0
    }, p);
    tw(fenText, 0.4, { o: 1 }, '>0.1');
  });
  
  // 建议
  const suggestion = T(500, 650, '选择建议：能用树状数组就用，', {
    fill: COLOR_TEXT,
    'font-size': 26,
    'text-anchor': 'middle',
    o: 0
  }, p);
  tw(suggestion, 0.5, { o: 1 }, '>0.8');
  
  const suggestion2 = T(500, 700, '否则上线段树！', {
    fill: COLOR_NODE_VISITED,
    'font-size': 28,
    'font-weight': 'bold',
    'text-anchor': 'middle',
    o: 0
  }, p);
  tw(suggestion2, 0.6, { o: 1 }, '>0.3');
}

function summary() {
  const p = panel(0);
  
  const title = T(500, 80, '总结', {
    fill: COLOR_PRIMARY,
    'font-size': 40,
    'font-weight': 'bold',
    'text-anchor': 'middle',
    o: 0
  }, p);
  tw(title, 0.6, { o: 1 }, '<');
  
  const points = [
    '完全二叉树维护区间信息',
    '构建 O(n)，查询更新 O(log n)',
    '懒惰标记处理区间更新',
    '应用广泛：RMQ、在线算法、区间统计',
    '平衡了查询和更新效率'
  ];
  
  points.forEach((point, i) => {
    const text = T(150, 220 + i * 80, `• ${point}`, {
      fill: COLOR_TEXT,
      'font-size': 28,
      'text-anchor': 'start',
      o: 0
    }, p);
    tw(text, 0.5, { o: 1 }, `>0.3+${i * 0.2}`);
  });
  
  const conclusion = T(500, 660, '线段树 = 算法竞赛 & 工程利器！', {
    fill: COLOR_NODE_VISITED,
    'font-size': 32,
    'font-weight': 'bold',
    'text-anchor': 'middle',
    o: 0
  }, p);
  tw(conclusion, 0.7, { o: 1 }, '>1.2');
}

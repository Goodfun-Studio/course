'use strict';
const CHAPTER = { number: 26, title: '树状数组（Fenwick Tree）', language: 'zh', minutes: 11 };

/* ---------- 颜色方案 ---------- */
const PRIMARY_COLOR = '#3498db';      // 蓝色（主色）
const HIGHLIGHT_COLOR = '#e74c3c';    // 红色（高亮）
const SUCCESS_COLOR = '#2ecc71';      // 绿色（成功）
const WARNING_COLOR = '#f39c12';      // 橙色（警告）
const PURPLE_COLOR = '#9b59b6';       // 紫色（辅助）
const DARK_COLOR = '#2c3e50';         // 深色（文字）
const LIGHT_BG = '#ecf0f1';           // 浅灰（背景）
const PROCESS_COLOR = '#f1c40f';      // 黄色（处理中）

/* ---------- 辅助函数 ---------- */
function drawBITNode(parent, x, y, index, value, color = PRIMARY_COLOR) {
  const g = G(parent, { x, y, o: 0 });
  
  // 矩形框
  const rect = mk('rect', {
    x: -30, y: -25, width: 60, height: 50,
    fill: color, stroke: DARK_COLOR, 'stroke-width': 2, rx: 5
  }, g);
  
  // 索引
  const indexText = T(g, `[${index}]`, { 
    x: 0, y: -8, size: 16, weight: 600, fill: '#fff', anchor: 'middle' 
  });
  
  // 值
  const valueText = T(g, value.toString(), { 
    x: 0, y: 12, size: 18, weight: 700, fill: '#fff', anchor: 'middle' 
  });
  
  return { g, rect, indexText, valueText };
}

function drawArrow(parent, x1, y1, x2, y2, color = DARK_COLOR, label = '') {
  const g = G(parent, { o: 0 });
  
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len;
  const uy = dy / len;
  
  // 缩短箭头，避免覆盖节点
  const startX = x1 + ux * 35;
  const startY = y1 + uy * 35;
  const endX = x2 - ux * 35;
  const endY = y2 - uy * 35;
  
  // 线
  const line = mk('line', {
    x1: startX, y1: startY, x2: endX, y2: endY,
    stroke: color, 'stroke-width': 3, 'marker-end': 'url(#arrowhead)'
  }, g);
  
  // 标签
  let text = null;
  if (label) {
    const midX = (startX + endX) / 2;
    const midY = (startY + endY) / 2;
    text = T(g, label, {
      x: midX + 15, y: midY - 10, size: 16, weight: 600, fill: color, anchor: 'middle'
    });
  }
  
  return { g, line, text };
}

function createArrowMarker(parent) {
  const defs = mk('defs', {}, parent);
  const marker = mk('marker', {
    id: 'arrowhead',
    markerWidth: 10,
    markerHeight: 10,
    refX: 9,
    refY: 3,
    orient: 'auto'
  }, defs);
  mk('polygon', {
    points: '0 0, 10 3, 0 6',
    fill: DARK_COLOR
  }, marker);
}

}],

['definition', '数据结构定义', () => {

['lowbit', 'lowbit 函数', () => {
  const p = panel(0);
  
  T(p, 'lowbit 函数：树状数组的灵魂', { 
    x: 400, y: 50, size: 32, weight: 700, fill: DARK_COLOR, anchor: 'middle' 
  });
  
  // 公式
  const formulaG = G(p, { x: 400, y: 120, o: 0 });

  T(formulaG, 'lowbit(x) = x & (-x)', { x: 0, y: 5, size: 32, weight: 700, fill: '#fff', anchor: 'middle' });

  // 示例
  const examples = [
    { x: 6, binary: '110', result: 2, resultBinary: '010' },
    { x: 12, binary: '1100', result: 4, resultBinary: '0100' },

  examples.forEach((ex, i) => {

  });

}],

['structure', '树状数组结构', () => {
  const p = panel(0);
  
  T(p, '树状数组的存储结构', { 
    x: 400, y: 50, size: 32, weight: 700, fill: DARK_COLOR, anchor: 'middle' 
  });
  
  createArrowMarker(p);
  
  // 绘制8个位置的树状数组
  const positions = [
    { index: 1, range: '[1,1]', x: 100, y: 450, level: 0 },
    { index: 2, range: '[1,2]', x: 220, y: 350, level: 1 },
    { index: 3, range: '[3,3]', x: 340, y: 450, level: 0 },
    { index: 4, range: '[1,4]', x: 460, y: 250, level: 2 },
    { index: 5, range: '[5,5]', x: 100, y: 450, level: 0 },
    { index: 6, range: '[5,6]', x: 220, y: 350, level: 1 },
    { index: 7, range: '[7,7]', x: 340, y: 450, level: 0 },
    { index: 8, range: '[1,8]', x: 580, y: 150, level: 3 }
  ];
  
  // 调整位置以适应画布
  const adjustedPos = [
    { index: 1, range: '[1,1]', x: 150, y: 400 },
    { index: 2, range: '[1,2]', x: 250, y: 320 },
    { index: 3, range: '[3,3]', x: 350, y: 400 },
    { index: 4, range: '[1,4]', x: 400, y: 220 },
    { index: 5, range: '[5,5]', x: 500, y: 400 },
    { index: 6, range: '[5,6]', x: 550, y: 320 },
    { index: 7, range: '[7,7]', x: 650, y: 400 },
    { index: 8, range: '[1,8]', x: 500, y: 120 }
  ];
  
  const nodes = [];
  
  // 绘制节点
  adjustedPos.forEach((pos, i) => {
    const node = drawBITNode(p, pos.x, pos.y, pos.index, pos.range);
    nodes.push(node);
    tw(node.g, { o: 1 }, 1 + i * 0.3, 0.4);
  });
  
  // 绘制边（父子关系）
  const edges = [
    [0, 1], // 1 -> 2
    [2, 1], // 3 -> 2
    [1, 3], // 2 -> 4
    [4, 5], // 5 -> 6
    [6, 5], // 7 -> 6
    [5, 7], // 6 -> 8
    [3, 7]  // 4 -> 8
  ];
  
  edges.forEach(([from, to], i) => {
    const arrow = drawArrow(p, adjustedPos[from].x, adjustedPos[from].y, 
                            adjustedPos[to].x, adjustedPos[to].y, PURPLE_COLOR);
    tw(arrow.g, { o: 1 }, 4 + i * 0.3, 0.4);
  });
  
  const hint = T(p, '每个节点管理一段区间，lowbit 值决定区间长度', { 
    x: 400, y: 520, size: 20, weight: 600, fill: HIGHLIGHT_COLOR, anchor: 'middle', o: 0 
  });
  tw(hint, { o: 1 }, 7, 0.8);
}],

['update-demo', '单点更新演示', () => {
  const p = panel(0);
  
  T(p, '单点更新：更新位置 3，增加 +5', { 
    x: 400, y: 50, size: 32, weight: 700, fill: DARK_COLOR, anchor: 'middle' 
  });
  
  createArrowMarker(p);
  
  // 树状数组节点
  const positions = [
    { index: 1, x: 150, y: 380 },
    { index: 2, x: 250, y: 300 },
    { index: 3, x: 350, y: 380 },
    { index: 4, x: 400, y: 200 },
    { index: 5, x: 500, y: 380 },
    { index: 6, x: 550, y: 300 },
    { index: 7, x: 650, y: 380 },
    { index: 8, x: 500, y: 100 }
  ];
  
  const nodes = [];
  positions.forEach((pos, i) => {
    const node = drawBITNode(p, pos.x, pos.y, pos.index, '0');
    nodes.push(node);
    tw(node.g, { o: 1 }, 0.5, 0.4);
  });
  
  let t = 2;
  
  // 步骤1：更新位置3
  const step1 = T(p, '步骤1：更新 tree[3] += 5', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step1, { o: 1 }, t, 0.4);
  tw(nodes[2].rect, { fill: PROCESS_COLOR }, t, 0.3);
  tw(nodes[2].valueText, { o: 0 }, t + 0.3, 0.2);
  tw(step1, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  nodes[2].valueText.textContent = '5';
  tw(nodes[2].valueText, { o: 1 }, t, 0.3);
  tw(nodes[2].rect, { fill: SUCCESS_COLOR }, t + 0.3, 0.3);
  t += 1.2;
  
  // 箭头3 -> 4
  const arrow1 = drawArrow(p, positions[2].x, positions[2].y, positions[3].x, positions[3].y, HIGHLIGHT_COLOR, 'i += lowbit(i)');
  tw(arrow1.g, { o: 1 }, t, 0.4);
  t += 0.8;
  
  // 步骤2：更新位置4
  const step2 = T(p, '步骤2：更新 tree[4] += 5', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step2, { o: 1 }, t, 0.4);
  tw(nodes[3].rect, { fill: PROCESS_COLOR }, t, 0.3);
  tw(nodes[3].valueText, { o: 0 }, t + 0.3, 0.2);
  tw(step2, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  nodes[3].valueText.textContent = '5';
  tw(nodes[3].valueText, { o: 1 }, t, 0.3);
  tw(nodes[3].rect, { fill: SUCCESS_COLOR }, t + 0.3, 0.3);
  t += 1.2;
  
  // 箭头4 -> 8
  const arrow2 = drawArrow(p, positions[3].x, positions[3].y, positions[7].x, positions[7].y, HIGHLIGHT_COLOR, 'i += lowbit(i)');
  tw(arrow2.g, { o: 1 }, t, 0.4);
  t += 0.8;
  
  // 步骤3：更新位置8
  const step3 = T(p, '步骤3：更新 tree[8] += 5', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step3, { o: 1 }, t, 0.4);
  tw(nodes[7].rect, { fill: PROCESS_COLOR }, t, 0.3);
  tw(nodes[7].valueText, { o: 0 }, t + 0.3, 0.2);
  tw(step3, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  nodes[7].valueText.textContent = '5';
  tw(nodes[7].valueText, { o: 1 }, t, 0.3);
  tw(nodes[7].rect, { fill: SUCCESS_COLOR }, t + 0.3, 0.3);
  t += 1.2;
  
  const done = T(p, '完成：沿树向上更新所有受影响的节点', { 
    x: 400, y: 520, size: 24, weight: 600, fill: HIGHLIGHT_COLOR, anchor: 'middle', o: 0 
  });
  tw(done, { o: 1 }, t, 0.8);
}],

['update-code', '单点更新代码', () => {
  const p = panel(0);
  
  T(p, '单点更新的代码实现', { 
    x: 400, y: 50, size: 32, weight: 700, fill: DARK_COLOR, anchor: 'middle' 
  });
  
  const codeLines = [
    'function update(i, delta) {',
    '  while (i <= n) {',
    '    tree[i] += delta;',
    '    i += lowbit(i);  // 跳到父节点',
    '  }',
    '}',
    '',
    'function lowbit(x) {',
    '  return x & (-x);',
    '}'
  ];
  
  const codeG = G(p, { x: 150, y: 130, o: 0 });
  mk('rect', { x: -20, y: -20, width: 500, height: 320, fill: '#2d2d2d', stroke: PRIMARY_COLOR, 'stroke-width': 2, rx: 8 }, codeG);
  
  codeLines.forEach((line, i) => {
    const text = T(codeG, line, { 
      x: 10, y: 10 + i * 30, size: 18, fill: '#f8f8f2', family: 'Monaco, monospace', o: 0 
    });
    tw(text, { o: 1 }, 1 + i * 0.3, 0.4);
  });
  
  tw(codeG, { o: 1 }, 0.5, 0.6);
  
  const highlights = [
    { text: '时间复杂度：O(log n)', y: 490, color: SUCCESS_COLOR },
    { text: '代码简洁：仅需几行', y: 530, color: PRIMARY_COLOR }
  ];
  
  highlights.forEach((h, i) => {
    const t = T(p, h.text, { 
      x: 400, y: h.y, size: 24, weight: 600, fill: h.color, anchor: 'middle', o: 0 
    });
    tw(t, { o: 1 }, 5 + i * 0.5, 0.6);
  });
}],

['query-demo', '区间查询演示', () => {
  const p = panel(0);
  
  T(p, '区间查询：查询 sum(1 到 7)', { 
    x: 400, y: 50, size: 32, weight: 700, fill: DARK_COLOR, anchor: 'middle' 
  });
  
  createArrowMarker(p);
  
  // 树状数组节点（带值）
  const positions = [
    { index: 1, value: '1', x: 150, y: 380 },
    { index: 2, value: '3', x: 250, y: 300 },
    { index: 3, value: '3', x: 350, y: 380 },
    { index: 4, value: '10', x: 400, y: 200 },
    { index: 5, value: '5', x: 500, y: 380 },
    { index: 6, value: '11', x: 550, y: 300 },
    { index: 7, value: '7', x: 650, y: 380 },
    { index: 8, value: '36', x: 500, y: 100 }
  ];
  
  const nodes = [];
  positions.forEach((pos, i) => {
    const node = drawBITNode(p, pos.x, pos.y, pos.index, pos.value);
    nodes.push(node);
    tw(node.g, { o: 1 }, 0.5, 0.4);
  });
  
  let t = 2;
  let sum = 0;
  
  // 步骤1：访问位置7
  const step1 = T(p, '步骤1：sum += tree[7] = 7', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step1, { o: 1 }, t, 0.4);
  tw(nodes[6].rect, { fill: PROCESS_COLOR }, t, 0.3);
  sum += 7;
  tw(step1, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  tw(nodes[6].rect, { fill: SUCCESS_COLOR }, t, 0.3);
  t += 1;
  
  // 箭头7 -> 6
  const arrow1 = drawArrow(p, positions[6].x, positions[6].y, positions[5].x, positions[5].y, HIGHLIGHT_COLOR, 'i -= lowbit(i)');
  tw(arrow1.g, { o: 1 }, t, 0.4);
  t += 0.8;
  
  // 步骤2：访问位置6
  const step2 = T(p, '步骤2：sum += tree[6] = 7+11', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step2, { o: 1 }, t, 0.4);
  tw(nodes[5].rect, { fill: PROCESS_COLOR }, t, 0.3);
  sum += 11;
  tw(step2, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  tw(nodes[5].rect, { fill: SUCCESS_COLOR }, t, 0.3);
  t += 1;
  
  // 箭头6 -> 4
  const arrow2 = drawArrow(p, positions[5].x, positions[5].y, positions[3].x, positions[3].y, HIGHLIGHT_COLOR, 'i -= lowbit(i)');
  tw(arrow2.g, { o: 1 }, t, 0.4);
  t += 0.8;
  
  // 步骤3：访问位置4
  const step3 = T(p, '步骤3：sum += tree[4] = 18+10', { 
    x: 100, y: 480, size: 22, weight: 600, fill: PROCESS_COLOR, o: 0 
  });
  tw(step3, { o: 1 }, t, 0.4);
  tw(nodes[3].rect, { fill: PROCESS_COLOR }, t, 0.3);
  sum += 10;
  tw(step3, { o: 0 }, t + 2, 0.3);
  t += 0.6;
  
  tw(nodes[3].rect, { fill: SUCCESS_COLOR }, t, 0.3);
  t += 1;
  
  const result = T(p, `结果：sum(1 到 7) = ${sum}`, { 
    x: 400, y: 520, size: 28, weight: 700, fill: HIGHLIGHT_COLOR, anchor: 'middle', o: 0 
  });
  tw(result, { o: 1 }, t, 0.8);
}],

    '  let sum = 0;',
    '  while (i > 0) {',

    '  }',
    '  return sum;',
    '}',
    '',
    '// 区间求和 [left, right]',

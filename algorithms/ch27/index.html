/* ---------- 颜色方案 ---------- */
const START_COLOR = '#2ecc71';        // 绿色（起点）
const END_COLOR = '#e74c3c';          // 红色（终点）
const OBSTACLE_COLOR = '#95a5a6';     // 灰色（障碍物）
const VISITED_COLOR = '#3498db';      // 蓝色（已访问）
const OPEN_COLOR = '#f39c12';         // 橙色（待访问）
const PATH_COLOR = '#e74c3c';         // 红色（最优路径）
const GRID_COLOR = '#ecf0f1';         // 浅灰（网格背景）
const TEXT_COLOR = '#2c3e50';         // 深色文字
const HIGHLIGHT = '#9b59b6';          // 紫色（高亮）
const BFS_COLOR = '#1abc9c';          // 青色（BFS对比）

/* ---------- 辅助函数 ---------- */
function drawGrid(parent, startX, startY, rows, cols, cellSize, obstacles = []) {
  const grid = [];
  for (let i = 0; i < rows; i++) {
    grid[i] = [];
    for (let j = 0; j < cols; j++) {
      const x = startX + j * cellSize;
      const y = startY + i * cellSize;
      const isObstacle = obstacles.some(obs => obs.row === i && obs.col === j);
      
      const cell = G(parent, { x, y, o: 0 });
      const rect = mk('rect', {
        x: 0, y: 0, width: cellSize - 2, height: cellSize - 2,
        fill: isObstacle ? OBSTACLE_COLOR : GRID_COLOR,
        stroke: '#bdc3c7',
        'stroke-width': 1
      }, cell);
      
      grid[i][j] = { cell, rect, x, y, isObstacle };
    }
  }
  return grid;
}

function drawCell(parent, x, y, size, color, label = '') {
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', {
    x: 0, y: 0, width: size - 2, height: size - 2,
    fill: color,
    stroke: '#2c3e50',
    'stroke-width': 2
  }, g);
  
  if (label) {
    const text = T(g, label, { x: size/2, y: size/2, size: 14, weight: 600, fill: '#fff', anchor: 'middle' });
    text.setAttribute('dominant-baseline', 'central');
  }
  
  return { g, rect };
}

function drawNodeValues(parent, x, y, g, h, f) {
  const group = G(parent, { x, y, o: 0 });
  T(group, `g:${g}`, { x: 2, y: 10, size: 10, fill: TEXT_COLOR, weight: 600 });
  T(group, `h:${h}`, { x: 2, y: 22, size: 10, fill: TEXT_COLOR, weight: 600 });
  T(group, `f:${f}`, { x: 2, y: 34, size: 10, fill: HIGHLIGHT, weight: 700 });
  return group;
}

function manhattanDistance(row1, col1, row2, col2) {
  return Math.abs(row1 - row2) + Math.abs(col1 - col2);
}

['bfs-limitation', 'BFS 的局限', () => {
  const p = panel(0);

  // 绘制简单网格展示BFS扩展
  const cellSize = 50;
  const startX = 150;
  const startY = 150;
  
  const grid = [];
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 6; j++) {
      const x = startX + j * cellSize;
      const y = startY + i * cellSize;
      const cell = drawCell(p, x, y, cellSize, GRID_COLOR);
      tw(cell.g, { o: 1 }, 0.2);
      grid.push({ cell, i, j, x, y });
    }
  }
  
  // 起点和终点
  const start = drawCell(p, startX, startY, cellSize, START_COLOR, 'S');
  tw(start.g, { o: 1 }, 0.5);
  
  const end = drawCell(p, startX + 5 * cellSize, startY + 5 * cellSize, cellSize, END_COLOR, 'E');
  tw(end.g, { o: 1 }, 0.8);
  
  // BFS波浪式扩展
  const layers = [
    [{ i: 0, j: 1 }, { i: 1, j: 0 }],
    [{ i: 0, j: 2 }, { i: 1, j: 1 }, { i: 2, j: 0 }],
    [{ i: 0, j: 3 }, { i: 1, j: 2 }, { i: 2, j: 1 }, { i: 3, j: 0 }],
    [{ i: 0, j: 4 }, { i: 1, j: 3 }, { i: 2, j: 2 }, { i: 3, j: 1 }, { i: 4, j: 0 }]
  ];
  
  let time = 1.5;
  layers.forEach(layer => {
    layer.forEach(pos => {
      const cell = grid.find(c => c.i === pos.i && c.j === pos.j);

}],

  tw(legend, { o: 1 }, 1.5);
  
  // A*搜索过程
  const searchPath = [
    { row: 0, col: 0, g: 0, h: 14, parent: null },  // 起点
    { row: 0, col: 1, g: 1, h: 13, parent: [0,0] },
    { row: 1, col: 0, g: 1, h: 13, parent: [0,0] },
    { row: 1, col: 1, g: 2, h: 12, parent: [0,1] },

    { row: 0, col: 3, g: 4, h: 10, parent: [0,2] },
    { row: 2, col: 0, g: 3, h: 11, parent: [1,0] },
    { row: 3, col: 1, g: 4, h: 10, parent: [2,1] },
    { row: 3, col: 0, g: 4, h: 10, parent: [2,0] },
    { row: 1, col: 4, g: 5, h: 9, parent: [1,3] },
    { row: 0, col: 4, g: 5, h: 9, parent: [0,3] },
    { row: 1, col: 5, g: 6, h: 8, parent: [1,4] },
    { row: 2, col: 5, g: 7, h: 7, parent: [1,5] },
    { row: 3, col: 5, g: 8, h: 6, parent: [2,5] },
    { row: 4, col: 5, g: 9, h: 5, parent: [3,5] },

['implementation', '算法实现', () => {
  const p = panel(0);
  
  T(p, 'A* 算法实现', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const code = `function aStar(grid, start, end) {
  const openSet = new PriorityQueue();  // 优先队列
  const closedSet = new Set();          // 已访问集合
  
  start.g = 0;
  start.h = heuristic(start, end);
  start.f = start.g + start.h;
  openSet.enqueue(start, start.f);
  
  while (!openSet.isEmpty()) {
    const current = openSet.dequeue();  // 取f值最小的节点
    
    if (current === end) {
      return reconstructPath(current);  // 找到终点
    }
    
    closedSet.add(current);
    
    for (const neighbor of getNeighbors(current)) {
      if (closedSet.has(neighbor)) continue;
      
      const tentativeG = current.g + 1;
      
      if (!openSet.contains(neighbor)) {
        neighbor.g = tentativeG;
        neighbor.h = heuristic(neighbor, end);
        neighbor.f = neighbor.g + neighbor.h;
        neighbor.parent = current;
        openSet.enqueue(neighbor, neighbor.f);
      } else if (tentativeG < neighbor.g) {
        neighbor.g = tentativeG;
        neighbor.f = neighbor.g + neighbor.h;
        neighbor.parent = current;
        openSet.updatePriority(neighbor, neighbor.f);
      }
    }
  }
  
  return null;  // 未找到路径
}`;
  
  const codeLines = code.split('\n');
  let y = 100;
  
  codeLines.forEach((line, i) => {
    const text = T(p, line, { 
      x: 50, y, size: 13, fill: TEXT_COLOR, 
      family: 'Monaco, Consolas, monospace', o: 0 
    });
    tw(text, { o: 1 }, 0.05 + i * 0.1);
    y += 16;
  });
}],

  T(dijkstra, '实际代价', { x: 0, y: 110, size: 18, fill: '#fff', anchor: 'middle' });
  T(dijkstra, '保证最优解', { x: 0, y: 160, size: 18, fill: '#fff', anchor: 'middle', weight: 600 });
  T(dijkstra, '但访问节点多', { x: 0, y: 190, size: 18, fill: '#fff', anchor: 'middle' });
  tw(dijkstra, { o: 1 }, 0.5);
  
  // A*
  const astar = G(p, { x: 600, y: 180, o: 0 });
  mk('rect', { x: -120, y: -40, width: 240, height: 280, fill: PATH_COLOR, rx: 10 }, astar);
  T(astar, 'A*', { x: 0, y: -10, size: 28, weight: 700, fill: '#fff', anchor: 'middle' });
  T(astar, 'g(n) + h(n)', { x: 0, y: 40, size: 20, fill: '#fff', anchor: 'middle' });
  T(astar, '实际代价 +', { x: 0, y: 80, size: 18, fill: '#fff', anchor: 'middle' });
  T(astar, '启发估计', { x: 0, y: 110, size: 18, fill: '#fff', anchor: 'middle' });
  T(astar, '保证最优解', { x: 0, y: 160, size: 18, fill: '#fff', anchor: 'middle', weight: 600 });
  T(astar, '且更高效', { x: 0, y: 190, size: 18, fill: '#fff', anchor: 'middle' });
  tw(astar, { o: 1 }, 1);
  
  const arrow = G(p, { x: 400, y: 320, o: 0 });
  mk('line', { x1: -50, y1: 0, x2: 50, y2: 0, stroke: HIGHLIGHT, 'stroke-width': 3 }, arrow);
  mk('polygon', { points: '50,0 40,-8 40,8', fill: HIGHLIGHT }, arrow);
  T(arrow, '加入启发函数', { x: 0, y: -20, size: 20, weight: 600, fill: HIGHLIGHT, anchor: 'middle' });
  tw(arrow, { o: 1 }, 1.5);
  
  const note = T(p, '当 h(n) = 0 时，A* 退化为 Dijkstra', { 
    x: 400, y: 500, size: 22, fill: TEXT_COLOR, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, 2.5);
}],

['applications', '应用场景', () => {
  const p = panel(0);
  
  T(p, 'A* 的广泛应用', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const apps = [
    { 
      icon: '🎮', 
      title: '游戏 AI 寻路', 
      desc: 'NPC 移动、怪物追击、RTS 单位寻路',
      y: 150,
      color: START_COLOR
    },
    { 
      icon: '🗺️', 
      title: 'GPS 导航', 
      desc: '考虑路况、限速的最优路线规划',
      y: 250,
      color: VISITED_COLOR
    },
    { 
      icon: '🤖', 
      title: '机器人路径规划', 
      desc: '无人机、自动驾驶的避障寻路',
      y: 350,
      color: OPEN_COLOR
    },
    { 
      icon: '🧩', 
      title: '拼图游戏求解', 
      desc: '八数码、魔方等状态空间搜索',
      y: 450,
      color: PATH_COLOR
    }
  ];
  
  apps.forEach((app, i) => {
    const g = G(p, { x: 100, y: app.y, o: 0 });
    
    mk('rect', { x: 0, y: -30, width: 600, height: 80, fill: app.color, rx: 10, o: 0.2 }, g);
    T(g, app.icon, { x: 30, y: 10, size: 40, anchor: 'middle' });
    T(g, app.title, { x: 80, y: 0, size: 24, weight: 700, fill: TEXT_COLOR });

['optimization', '算法优化', () => {
  const p = panel(0);
  
  T(p, 'A* 优化技巧', { x: 400, y: 60, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const opts = [
    {
      name: 'Jump Point Search',
      desc: '跳过对称路径，减少节点扩展',
      benefit: '速度提升 10+ 倍',
      y: 140
    },
    {
      name: '双向 A*',
      desc: '从起点和终点同时搜索',
      benefit: '搜索空间减半',
      y: 240
    },
    {
      name: 'Hierarchical A*',
      desc: '分层规划：粗粒度 + 细粒度',
      benefit: '适合大规模地图',
      y: 340
    },
    {
      name: 'Landmark 启发',
      desc: '预计算地标点，提高估计精度',
      benefit: '更准确的启发值',
      y: 440
    }
  ];
  
  opts.forEach((opt, i) => {
    const g = G(p, { x: 80, y: opt.y, o: 0 });
    
    mk('circle', { cx: 20, cy: 0, r: 15, fill: HIGHLIGHT }, g);
    T(g, (i + 1).toString(), { x: 20, y: 0, size: 18, weight: 700, fill: '#fff', anchor: 'middle' });
    
    T(g, opt.name, { x: 50, y: -15, size: 24, weight: 700, fill: TEXT_COLOR });
    T(g, opt.desc, { x: 50, y: 15, size: 18, fill: TEXT_COLOR });
    T(g, `→ ${opt.benefit}`, { x: 50, y: 45, size: 16, fill: HIGHLIGHT, weight: 600 });
    
    tw(g, { o: 1 }, 0.5 + i * 0.4);
  });
}],

['comparison-table', '算法对比', () => {
  const p = panel(0);
  
  T(p, '搜索算法对比', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 表格
  const table = [
    ['算法', 'BFS', 'Dijkstra', 'A*', '贪心'],
    ['策略', '均匀扩展', 'g(n)', 'g(n)+h(n)', 'h(n)'],
    ['最优性', '保证', '保证', '保证*', '不保证'],
    ['效率', '低', '中', '高', '最高'],
    ['应用', '无权图', '有权图', '有目标', '快速解']
  ];
  
  const cellWidth = 130;
  const cellHeight = 50;
  const startX = 80;
  const startY = 120;
  
  table.forEach((row, i) => {
    row.forEach((cell, j) => {
      const x = startX + j * cellWidth;
      const y = startY + i * cellHeight;
      
      const g = G(p, { x, y, o: 0 });
      
      const isHeader = i === 0 || j === 0;
      const fill = isHeader ? HIGHLIGHT : GRID_COLOR;
      const textColor = isHeader ? '#fff' : TEXT_COLOR;
      const weight = isHeader ? 700 : 400;
      
      mk('rect', { 
        x: 0, y: 0, width: cellWidth - 2, height: cellHeight - 2,
        fill, stroke: '#bdc3c7', 'stroke-width': 1 
      }, g);
      
      const text = T(g, cell, { 
        x: cellWidth / 2, y: cellHeight / 2, 
        size: 16, weight, fill: textColor, anchor: 'middle' 
      });
      text.setAttribute('dominant-baseline', 'central');
      
      tw(g, { o: 1 }, 0.2 + i * 0.2);
    });
  });
  
  const note = T(p, '* 可接纳启发函数保证最优', { 
    x: 400, y: 420, size: 20, fill: TEXT_COLOR, anchor: 'middle', o: 0 
  });
  tw(note, { o: 1 }, 2.5);
  
  const summary = T(p, '有明确目标时，A* 是最佳选择', { 
    x: 400, y: 480, size: 24, weight: 700, fill: HIGHLIGHT, anchor: 'middle', o: 0 
  });
  tw(summary, { o: 1 }, 3);
}],

['finish', '总结', () => {
  const p = panel(0);
  
  T(p, 'A* 启发式搜索', { x: 400, y: 60, size: 42, weight: 700, fill: TEXT_COLOR, anchor: 'middle' });
  
  const points = [
    { icon: '📐', text: 'f(n) = g(n) + h(n)', y: 160 },
    { icon: '🎯', text: '用目标信息引导搜索', y: 240 },
    { icon: '✓', text: '可接纳启发函数保证最优', y: 320 },
    { icon: '⚡', text: '比 BFS、Dijkstra 更高效', y: 400 }
  ];
  
  points.forEach((point, i) => {
    const g = G(p, { x: 150, y: point.y, o: 0 });
    T(g, point.icon, { x: 0, y: 0, size: 40, anchor: 'middle' });
    T(g, point.text, { x: 70, y: 0, size: 28, fill: TEXT_COLOR, anchor: 'start', weight: 600 });
    tw(g, { o: 1 }, 0.5 + i * 0.4);
  });
  
  const core = T(p, '核心思想：智能 + 最优', { 
    x: 400, y: 510, size: 32, weight: 700, fill: HIGHLIGHT, anchor: 'middle', o: 0 
  });
  tw(core, { o: 1 }, 2.5);
}]

];

  const main = el('#main');
  panel(0, main);

  applyMarks(window.BEATS, window.MARKS);
  runChapter(CHAPTER, window.BEATS);
}

if (document.readyState === 'loading') {

} else {
  boot();
}
</script>

/* ---------- 颜色方案 ---------- */
const PRIMARY = '#3498db';         // 蓝色（主要）
const SECONDARY = '#e74c3c';       // 红色（强调）
const SUCCESS = '#2ecc71';         // 绿色（成功）
const WARNING = '#f39c12';         // 橙色（警告）
const PURPLE = '#9b59b6';          // 紫色（辅助）
const DARK = '#2c3e50';            // 深色（文字）
const LIGHT_BG = '#ecf0f1';        // 浅灰（背景）
const HIGHLIGHT = '#e67e22';       // 深橙（高亮）

/* ---------- 辅助函数 ---------- */
function drawMatrix(parent, x, y, rows, cols, label) {
  const g = G(parent, { x, y, o: 0 });
  
  const rect = mk('rect', {
    x: -30, y: -20, width: 60, height: 40,
    fill: PRIMARY, stroke: DARK, 'stroke-width': 2, rx: 5
  }, g);
  
  const text = T(g, label, { x: 0, y: 0, size: 20, weight: 700, fill: '#fff', anchor: 'middle' });
  text.setAttribute('dominant-baseline', 'central');
  
  const dim = T(g, `${rows}×${cols}`, { x: 0, y: 28, size: 14, fill: DARK, anchor: 'middle' });
  
  return { g, rect, text, dim };
}

function drawDPCell(parent, x, y, value, isActive = false, isResult = false) {
  const g = G(parent, { x, y, o: 0 });
  
  let fillColor = LIGHT_BG;
  if (isResult) fillColor = SUCCESS;
  else if (isActive) fillColor = WARNING;
  
  const rect = mk('rect', {
    x: -25, y: -20, width: 50, height: 40,
    fill: fillColor, stroke: DARK, 'stroke-width': 2, rx: 3
  }, g);
  
  const text = T(g, value !== undefined ? String(value) : '', { 
    x: 0, y: 0, size: 16, weight: 600, fill: DARK, anchor: 'middle' 
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return { g, rect, text };
}

function drawArrow(parent, x1, y1, x2, y2, color = DARK) {
  const g = G(parent, { o: 0 });
  
  const dx = x2 - x1;
  const dy = y2 - y1;
  const angle = Math.atan2(dy, dx);
  
  const line = mk('line', {
    x1, y1, x2: x2 - 10 * Math.cos(angle), y2: y2 - 10 * Math.sin(angle),
    stroke: color, 'stroke-width': 2, 'marker-end': 'url(#arrowhead)'
  }, g);
  
  return { g, line };
}

['implementation', '代码实现', () => {
  const p = panel(0);
  
  T(p, '代码实现', { x: 400, y: 60, size: 36, weight: 700, fill: DARK });
  
  const code = `function matrixChainOrder(p) {
  const n = p.length - 1;
  const dp = Array(n+1).fill(0)
    .map(() => Array(n+1).fill(0));
  const s = Array(n+1).fill(0)
    .map(() => Array(n+1).fill(0));
  
  // 按链长度递增
  for (let len = 2; len <= n; len++) {
    for (let i = 1; i <= n-len+1; i++) {
      const j = i + len - 1;
      dp[i][j] = Infinity;
      
      // 枚举分割点
      for (let k = i; k < j; k++) {
        const cost = dp[i][k] + 
                     dp[k+1][j] + 
                     p[i-1] * p[k] * p[j];
        if (cost < dp[i][j]) {
          dp[i][j] = cost;
          s[i][j] = k;
        }
      }
    }
  }
  
  return { minCost: dp[1][n], splits: s };
}`;
  
  const codeText = T(p, code, { 
    x: 50, y: 120, size: 14, fill: DARK, 
    font: 'Monaco, Courier, monospace', o: 0 
  });
  tw(codeText, { o: 1 }, 0.5);

  if (i === j) {
    return 'A' + i;
  }
  
  const k = s[i][j];
  const left = printOptimal(s, i, k);
  const right = printOptimal(s, k+1, j);
  
  return '(' + left + '×' + right + ')';
}`;

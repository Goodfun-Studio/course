'use strict';
const CHAPTER = { number: 28, title: '矩阵链乘法', language: 'zh', minutes: 11 };

/* ---------- 颜色方案 ---------- */
const PRIMARY   = '#3498db';
const SECONDARY = '#e74c3c';
const SUCCESS   = '#2ecc71';
const WARNING   = '#f39c12';
const PURPLE    = '#9b59b6';
const DARK      = '#2c3e50';
const LIGHT_BG  = '#ecf0f1';
const HIGHLIGHT = '#e67e22';

/* ---------- 辅助函数 ---------- */
function drawMatrix(parent, x, y, rows, cols, label, initO) {
  const g = G(parent, { x, y, o: initO !== undefined ? initO : 0 });
  mk('rect', {
    x: -30, y: -22, width: 60, height: 44,
    fill: PRIMARY, stroke: DARK, 'stroke-width': 2, rx: 5
  }, g);
  const lbl = T(g, label, { x: 0, y: -4, size: 20, weight: 700, fill: '#fff', anchor: 'middle' });
  lbl.setAttribute('dominant-baseline', 'central');
  T(g, `${rows}×${cols}`, { x: 0, y: 16, size: 13, fill: '#fff', anchor: 'middle' });
  return g;
}

function drawDPCell(parent, x, y, value, color) {
  color = color || LIGHT_BG;
  const g = G(parent, { x, y, o: 0 });
  const rect = mk('rect', {
    x: -26, y: -20, width: 52, height: 40,
    fill: color, stroke: DARK, 'stroke-width': 1.5, rx: 3
  }, g);
  const txt = T(g, value !== undefined ? String(value) : '', {
    x: 0, y: 0, size: 14, weight: 600, fill: DARK, anchor: 'middle'
  });
  txt.setAttribute('dominant-baseline', 'central');
  return { g, rect, txt };
}

['implementation', '代码实现', (m, dur) => {

  // 看代码 — m('code')
  const codeLines = [
    'function matrixChainOrder(p) {',
    '  const n = p.length - 1;',
    '  const dp = Array(n+1).fill(0).map(() => Array(n+1).fill(0));',
    '  const s  = Array(n+1).fill(0).map(() => Array(n+1).fill(0));',
    '  for (let len = 2; len <= n; len++) {',
    '    for (let i = 1; i <= n-len+1; i++) {',
    '      const j = i + len - 1;',
    '      dp[i][j] = Infinity;',
    '      for (let k = i; k < j; k++) {',
    '        const cost = dp[i][k] + dp[k+1][j]',
    '                   + p[i-1] * p[k] * p[j];',
    '        if (cost < dp[i][j]) {',
    '          dp[i][j] = cost;  s[i][j] = k;',
    '        }',
    '      }',
    '    }',
    '  }',
    '  return { minCost: dp[1][n], splits: s };',
    '}',
  ];
  const codeGrp = G(p, { o: 0 });

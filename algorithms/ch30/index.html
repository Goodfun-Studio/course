/* ---------- 颜色方案 ---------- */
const POINT_COLOR = '#3498db';      // 蓝色（普通点）
const START_COLOR = '#e74c3c';      // 红色（起点）
const HULL_COLOR = '#2ecc71';       // 绿色（凸包点）
const LINE_COLOR = '#2c3e50';       // 深色（线段）
const HIGHLIGHT = '#f39c12';        // 橙色（高亮）
const PURPLE = '#9b59b6';           // 紫色
const CYAN = '#1abc9c';             // 青色
const BACKGROUND = '#ecf0f1';       // 浅灰（背景）
const TEXT_COLOR = '#2c3e50';       // 深色文字
const STACK_COLOR = '#e67e22';      // 棕橙色（栈）

/* ---------- 辅助函数 ---------- */
function drawPoint(parent, x, y, label, color = POINT_COLOR, size = 8) {
  const g = G(parent, { x, y, o: 0 });
  const circle = mk('circle', { 
    cx: 0, cy: 0, r: size, 
    fill: color, 
    stroke: TEXT_COLOR, 
    'stroke-width': 2 
  }, g);
  if (label) {
    const text = T(g, label, { x: 0, y: -20, size: 16, weight: 600, fill: color, anchor: 'middle' });
  }
  return { g, circle };
}

function drawLine(parent, x1, y1, x2, y2, color = LINE_COLOR, width = 2) {
  const line = mk('line', { 
    x1, y1, x2, y2, 
    stroke: color, 
    'stroke-width': width,
    o: 0
  }, parent);
  return line;
}

function drawArrow(parent, x1, y1, x2, y2, color = LINE_COLOR) {
  const g = G(parent, { o: 0 });
  const line = mk('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': 2 }, g);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const arrowSize = 8;
  const ax1 = x2 - arrowSize * Math.cos(angle - Math.PI / 6);
  const ay1 = y2 - arrowSize * Math.sin(angle - Math.PI / 6);
  const ax2 = x2 - arrowSize * Math.cos(angle + Math.PI / 6);
  const ay2 = y2 - arrowSize * Math.sin(angle + Math.PI / 6);
  mk('line', { x1: x2, y1: y2, x2: ax1, y2: ay1, stroke: color, 'stroke-width': 2 }, g);
  mk('line', { x1: x2, y1: y2, x2: ax2, y2: ay2, stroke: color, 'stroke-width': 2 }, g);
  return g;
}

function crossProduct(p0, p1, p2) {
  return (p1.x - p0.x) * (p2.y - p0.y) - (p1.y - p0.y) * (p2.x - p0.x);
}

['polar_sort', '极角排序动画', () => {
  const p = panel(0);
  
  T(p, '步骤1：极角排序', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 12个随机点
  const points = [
    { x: 250, y: 450 }, { x: 400, y: 200 }, { x: 600, y: 300 },
    { x: 350, y: 350 }, { x: 500, y: 450 }, { x: 300, y: 250 },
    { x: 550, y: 200 }, { x: 200, y: 300 }, { x: 450, y: 380 },
    { x: 320, y: 480 }, { x: 580, y: 400 }, { x: 380, y: 280 }
  ];
  
  // 绘制原始点
  const pointElems = points.map((pt, i) => {
    const elem = drawPoint(p, pt.x, pt.y, '', POINT_COLOR, 7);
    tw(elem.g, { o: 1 }, 0.3 + i * 0.1);
    return elem;
  });
  
  // 找到最低点
  let lowestIdx = 0;
  for (let i = 1; i < points.length; i++) {
    if (points[i].y > points[lowestIdx].y || 
        (points[i].y === points[lowestIdx].y && points[i].x < points[lowestIdx].x)) {
      lowestIdx = i;
    }
  }
  
  const p0 = points[lowestIdx];
  tw(pointElems[lowestIdx].circle, { fill: START_COLOR, r: 10 }, 2);
  const p0Label = T(p, 'p0 (起点)', { 
    x: p0.x, y: p0.y + 30, size: 18, weight: 600, fill: START_COLOR, anchor: 'middle', o: 0 
  });
  tw(p0Label, { o: 1 }, 2);
  
  // 计算极角并排序
  const polarPoints = points.map((pt, i) => ({
    ...pt,
    idx: i,
    angle: i === lowestIdx ? -Math.PI : Math.atan2(pt.y - p0.y, pt.x - p0.x),
    dist: Math.hypot(pt.x - p0.x, pt.y - p0.y)
  })).filter((_, i) => i !== lowestIdx);
  
  polarPoints.sort((a, b) => {
    if (Math.abs(a.angle - b.angle) < 0.001) return a.dist - b.dist;
    return a.angle - b.angle;
  });
  
  // 绘制从p0到每个点的射线（分批显示）
  polarPoints.forEach((pt, i) => {
    const ray = drawLine(p, p0.x, p0.y, pt.x, pt.y, PURPLE, 1);
    ray.setAttribute('stroke-dasharray', '4,4');
    tw(ray, { o: 0.3 }, 3 + i * 0.15);
  });
  
  // 标注排序后的序号
  polarPoints.forEach((pt, i) => {
    const label = T(p, String(i + 1), { 
      x: pt.x, y: pt.y - 20, size: 16, weight: 700, fill: HIGHLIGHT, anchor: 'middle', o: 0 
    });
    tw(label, { o: 1 }, 4.5 + i * 0.15);
  });
  
  // 显示极角值
  const angleText = T(p, '按极角逆时针排序', { 
    x: 400, y: 550, size: 24, weight: 600, fill: PURPLE, anchor: 'middle', o: 0 
  });
  tw(angleText, { o: 1 }, 6.5);
}],

['build_hull', '凸包构建动画', () => {
  const p = panel(800);
  
  T(p, '步骤2：栈维护凸包', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  // 使用排序后的点
  const p0 = { x: 250, y: 450 };
  const sortedPoints = [
    p0,
    { x: 200, y: 300 }, { x: 300, y: 250 }, { x: 400, y: 200 },
    { x: 550, y: 200 }, { x: 600, y: 300 }, { x: 580, y: 400 },
    { x: 500, y: 450 }, { x: 450, y: 380 }, { x: 380, y: 280 },
    { x: 350, y: 350 }, { x: 320, y: 480 }
  ];
  
  // 绘制所有点
  sortedPoints.forEach((pt, i) => {
    const color = i === 0 ? START_COLOR : POINT_COLOR;
    const elem = drawPoint(p, pt.x, pt.y, String(i), color, 7);
    elem.g.setAttribute('opacity', 1);
  });
  
  // 栈可视化区域
  const stackX = 50;
  const stackY = 100;
  T(p, '栈', { x: stackX, y: stackY, size: 20, weight: 600, fill: STACK_COLOR });
  
  let time = 0.5;
  const stack = [0, 1]; // 初始栈：p0, p1
  const hullLines = [];
  
  // 显示初始栈
  [0, 1].forEach((idx, i) => {
    const stackItem = T(p, `p${idx}`, { 
      x: stackX, y: stackY + 40 + i * 25, 
      size: 18, fill: STACK_COLOR, o: 0 
    });
    tw(stackItem, { o: 1 }, time);
  });
  time += 0.5;
  
  // 初始连线
  let line = drawLine(p, sortedPoints[0].x, sortedPoints[0].y, 
                      sortedPoints[1].x, sortedPoints[1].y, HULL_COLOR, 3);
  tw(line, { o: 1 }, time);
  hullLines.push(line);
  time += 0.5;
  
  // 处理每个后续点
  for (let i = 2; i < sortedPoints.length; i++) {
    const current = sortedPoints[i];
    
    // 高亮当前点
    const currentHighlight = mk('circle', { 
      cx: current.x, cy: current.y, r: 12, 
      fill: 'none', stroke: HIGHLIGHT, 'stroke-width': 3, o: 0 
    }, p);
    tw(currentHighlight, { o: 1 }, time);
    time += 0.3;
    
    // 检查并弹栈
    while (stack.length >= 2) {
      const top = stack[stack.length - 1];
      const second = stack[stack.length - 2];
      const cross = crossProduct(sortedPoints[second], sortedPoints[top], current);
      
      if (cross <= 0) {
        // 右转，弹栈
        stack.pop();
        
        // 移除最后一条线
        if (hullLines.length > 0) {
          const removeLine = hullLines.pop();
          tw(removeLine, { o: 0 }, time);
        }
        
        // 栈可视化更新（淡出）
        const removeItem = T(p, `p${top} ✗`, { 
          x: stackX + 60, y: stackY + 40 + stack.length * 25, 
          size: 18, fill: START_COLOR, o: 0 
        });
        tw(removeItem, { o: 1 }, time);
        tw(removeItem, { o: 0 }, time + 0.3);
        
        time += 0.4;
      } else {
        break;
      }
    }
    
    // 压入新点
    stack.push(i);
    
    // 添加新连线
    if (stack.length >= 2) {
      const prevIdx = stack[stack.length - 2];
      line = drawLine(p, sortedPoints[prevIdx].x, sortedPoints[prevIdx].y, 
                      current.x, current.y, HULL_COLOR, 3);
      tw(line, { o: 1 }, time);
      hullLines.push(line);
    }
    
    // 栈可视化更新
    const stackItem = T(p, `p${i}`, { 
      x: stackX, y: stackY + 40 + (stack.length - 1) * 25, 
      size: 18, fill: HULL_COLOR, o: 0 
    });
    tw(stackItem, { o: 1 }, time);
    
    tw(currentHighlight, { o: 0 }, time + 0.2);
    time += 0.5;
  }
  
  // 闭合凸包
  const firstIdx = stack[0];
  const lastIdx = stack[stack.length - 1];
  const closeLine = drawLine(p, sortedPoints[lastIdx].x, sortedPoints[lastIdx].y,
                              sortedPoints[firstIdx].x, sortedPoints[firstIdx].y, 
                              HULL_COLOR, 3);
  tw(closeLine, { o: 1 }, time);
  
  // 最终标注
  const finalText = T(p, `凸包完成！${stack.length} 个顶点`, { 
    x: 400, y: 550, size: 26, weight: 600, fill: HULL_COLOR, anchor: 'middle', o: 0 
  });
  tw(finalText, { o: 1 }, time + 0.5);
}],

['implementation', '代码实现', () => {
  const p = panel(0);
  
  T(p, '代码实现', { x: 400, y: 50, size: 36, weight: 700, fill: TEXT_COLOR });
  
  const code = `function grahamScan(points) {
  // 1. 找最低点
  let p0 = points[0];
  for (let p of points) {
    if (p.y > p0.y || (p.y === p0.y && p.x < p0.x))
      p0 = p;
  }
  
  // 2. 极角排序
  const sorted = points
    .filter(p => p !== p0)
    .sort((a, b) => {
      const angle1 = Math.atan2(a.y - p0.y, a.x - p0.x);
      const angle2 = Math.atan2(b.y - p0.y, b.x - p0.x);
      return angle1 - angle2;
    });
  
  // 3. 栈维护凸包
  const stack = [p0, sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    while (stack.length >= 2) {
      const top = stack[stack.length - 1];
      const second = stack[stack.length - 2];
      if (crossProduct(second, top, sorted[i]) <= 0)
        stack.pop();
      else break;
    }
    stack.push(sorted[i]);
  }
  return stack;
}`;
  
  const codeElem = T(p, code, { 
    x: 50, y: 120, size: 14, family: 'monospace', fill: TEXT_COLOR, o: 0 
  });
  codeElem.setAttribute('white-space', 'pre');
  tw(codeElem, { o: 1 }, 0.5);
  
  const notes = [
    { text: '• O(n log n) 主要是排序', y: 500, color: PURPLE },
    { text: '• 每个点最多入栈、出栈各一次', y: 530, color: HULL_COLOR }
  ];
  notes.forEach(({ text, y, color }, i) => {
    const note = T(p, text, { x: 50, y, size: 20, fill: color, o: 0 });
    tw(note, { o: 1 }, 1.5 + i * 0.3);
  });
}],

['cross_calculation', '叉积的几何意义', () => {

               size: 24, weight: 600, fill: CYAN, o: 0 });
  
  // 平行四边形
  const parallelogram = [
    drawLine(p, v1_end.x, v1_end.y, v1_end.x + (v2_end.x - origin.x), 
             v1_end.y + (v2_end.y - origin.y), HIGHLIGHT, 2),
    drawLine(p, v2_end.x, v2_end.y, v1_end.x + (v2_end.x - origin.x), 
             v1_end.y + (v2_end.y - origin.y), HIGHLIGHT, 2)
  ];
  parallelogram.forEach((line, i) => {
    line.setAttribute('stroke-dasharray', '5,5');
    tw(line, { o: 0.5 }, 1.5 + i * 0.2);
  });
  
  // 面积标注
  const areaLabel = T(p, '有向面积', { 
    x: (origin.x + v1_end.x + v2_end.x) / 3, 
    y: (origin.y + v1_end.y + v2_end.y) / 3, 
    size: 22, weight: 600, fill: HIGHLIGHT, anchor: 'middle', o: 0 
  });
  tw(areaLabel, { o: 1 }, 2);
  
  // 公式和说明
  const formula = T(p, 'v₁ × v₂ = x₁y₂ - y₁x₂', { 
    x: 550, y: 250, size: 24, family: 'monospace', fill: TEXT_COLOR, o: 0 
  });
  tw(formula, { o: 1 }, 2.5);
  
  const explanations = [
    { text: '> 0：逆时针（左转）', y: 300, color: HULL_COLOR },
    { text: '< 0：顺时针（右转）', y: 340, color: START_COLOR },
    { text: '= 0：共线', y: 380, color: TEXT_COLOR }
  ];
  explanations.forEach(({ text, y, color }, i) => {
    const note = T(p, text, { x: 550, y, size: 20, fill: color, o: 0 });
    tw(note, { o: 1 }, 3 + i * 0.3);
  });
}],

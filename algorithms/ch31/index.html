/* ---------- beats ---------- */
let BEATS = [

['intro', '问题引入', () => {

}],

['naive-power', '朴素幂运算', () => {
  const p = panel(0);
  
  const title = T(p, '朴素方法', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const problem = T(p, '计算 a^n mod m', { x: 800, y: 190, size: 36, fill: POWER_COLOR, anchor: 'middle', o: 0 });
  tw(problem, { o: 1 }, 2, 0.5);

  tw(naive, { o: 1 }, 4, 0.6);
  
  const code = T(p, 'result = 1', { x: 450, y: 350, size: 28, fill: BASE_COLOR, family: 'monospace', o: 0 });

  tw(loop, { o: 1 }, 6.5, 0.5);
  
  const multiply = T(p, '    result *= a', { x: 470, y: 470, size: 28, fill: BASE_COLOR, family: 'monospace', o: 0 });

  const tooslow = T(p, '✗ 太慢了！', { x: 800, y: 700, size: 36, fill: '#e74c3c', anchor: 'middle', weight: 700, o: 0 });

}],

['fast-power-concept', '快速幂思想', () => {
  const p = panel(0);
  
  const title = T(p, '快速幂算法', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const subtitle = T(p, 'Fast Exponentiation / Binary Exponentiation', { x: 800, y: 170, size: 26, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(subtitle, { o: 1 }, 1, 0.5);
  
  const key = T(p, '核心思想：二进制分解', { x: 400, y: 250, size: 36, fill: BINARY_COLOR, weight: 600, o: 0 });
  tw(key, { o: 1 }, 3, 0.6);
  
  const example = T(p, '例如：3^13 = 3^(8+4+1)', { x: 450, y: 330, size: 32, fill: COL.chalk, o: 0 });

  tw(binary, { o: 1 }, 6.5, 0.5);
  
  const breakdown = T(p, '= 1×2³ + 1×2² + 0×2¹ + 1×2⁰', { x: 450, y: 470, size: 28, fill: BINARY_COLOR, o: 0 });
  tw(breakdown, { o: 1 }, 8, 0.6);
  
  const power = T(p, '所以：3^13 = 3^8 × 3^4 × 3^1', { x: 450, y: 540, size: 30, fill: POWER_COLOR, weight: 600, o: 0 });
  tw(power, { o: 1 }, 10, 0.7);
  
  const trick = T(p, '技巧：每次平方可以快速得到 3^(2k)', { x: 400, y: 620, size: 28, fill: COL.chalk, o: 0 });
  tw(trick, { o: 1 }, 12, 0.6);
  
  const efficient = T(p, '只需要 O(log n) 次乘法！', { x: 800, y: 700, size: 34, fill: GCD_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(efficient, { o: 1 }, 14, 0.7);
}],

['fast-power-animation', '快速幂动画', () => {
  const p = panel(0);
  
  const title = T(p, '快速幂演示：3^13 mod 1000', { x: 800, y: 80, size: 44, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  // Binary representation
  const binaryLabel = T(p, '13 的二进制：', { x: 300, y: 150, size: 28, fill: BINARY_COLOR, o: 0 });
  tw(binaryLabel, { o: 1 }, 1, 0.5);
  
  const bits = ['1', '1', '0', '1'];
  const bitLabels = ['2³=8', '2²=4', '2¹=2', '2⁰=1'];
  bits.forEach((bit, i) => {
    const x = 550 + i * 80;
    const box = mk('rect', { x: x, y: 130, width: 60, height: 60, rx: 5, fill: bit === '1' ? BINARY_COLOR : DIM_COLOR, o: 0 }, p);
    tw(box, { o: 0.8 }, 2 + i * 0.2, 0.4);
    
    const bitText = T(p, bit, { x: x + 30, y: 165, size: 32, fill: 'white', anchor: 'middle', weight: 700, o: 0 });
    tw(bitText, { o: 1 }, 2 + i * 0.2, 0.4);
    
    const label = T(p, bitLabels[i], { x: x + 30, y: 210, size: 20, fill: COL.chalk, anchor: 'middle', o: 0 });
    tw(label, { o: 1 }, 2.5 + i * 0.2, 0.4);
  });
  
  // Powers table
  const tableY = 270;
  const headers = ['步骤', '幂次', '值 (mod 1000)', '累积结果'];
  headers.forEach((header, i) => {
    const x = 300 + i * 240;
    const text = T(p, header, { x: x, y: tableY, size: 24, fill: COL.dim, weight: 600, o: 0 });
    tw(text, { o: 1 }, 4, 0.5);
  });
  
  // Step-by-step computation
  const steps = [
    { step: '初始', power: '3^0', value: '1', result: '1', t: 5.5 },
    { step: '平方', power: '3^1', value: '3', result: '1', t: 7 },
    { step: '乘入', power: '3^1', value: '3', result: '1×3=3', t: 8.5, highlight: true },
    { step: '平方', power: '3^2', value: '9', result: '3', t: 10.5 },
    { step: '平方', power: '3^4', value: '81', result: '3', t: 12 },
    { step: '乘入', power: '3^4', value: '81', result: '3×81=243', t: 14, highlight: true },
    { step: '平方', power: '3^8', value: '561', result: '243', t: 16 },
    { step: '乘入', power: '3^8', value: '561', result: '243×561=367', t: 18.5, highlight: true }
  ];
  
  let rowY = tableY + 60;
  steps.forEach(({ step, power, value, result, t, highlight }) => {
    const stepText = T(p, step, { x: 300, y: rowY, size: 26, fill: highlight ? POWER_COLOR : COL.chalk, weight: highlight ? 600 : 400, o: 0 });
    tw(stepText, { o: 1 }, t, 0.5);
    
    const powerText = T(p, power, { x: 540, y: rowY, size: 26, fill: BASE_COLOR, family: 'monospace', o: 0 });
    tw(powerText, { o: 1 }, t + 0.1, 0.5);
    
    const valueText = T(p, value, { x: 780, y: rowY, size: 26, fill: BINARY_COLOR, family: 'monospace', o: 0 });
    tw(valueText, { o: 1 }, t + 0.2, 0.5);
    
    const resultText = T(p, result, { x: 1020, y: rowY, size: 26, fill: highlight ? RESULT_COLOR : COL.chalk, family: 'monospace', weight: highlight ? 600 : 400, o: 0 });
    tw(resultText, { o: 1 }, t + 0.3, 0.5);
    
    if (highlight) {
      const arrow = T(p, '←', { x: 1280, y: rowY, size: 32, fill: POWER_COLOR, weight: 700, o: 0 });
      tw(arrow, { o: 1 }, t + 0.4, 0.4);
      tw(arrow, { o: 0 }, t + 1.2, 0.3);
    }
    
    rowY += 45;
  });
  
  // Final result with emphasis
  const finalBox = mk('rect', { x: 280, y: 665, width: 1040, height: 70, rx: 10, fill: RESULT_COLOR, o: 0 }, p);
  tw(finalBox, { o: 0.2 }, 21, 0.6);
  
  const finalLabel = T(p, '最终结果：3^13 mod 1000 = ', { x: 400, y: 705, size: 32, fill: COL.chalk, weight: 600, o: 0 });
  tw(finalLabel, { o: 1 }, 21.5, 0.6);
  
  const finalValue = T(p, '367', { x: 900, y: 705, size: 40, fill: RESULT_COLOR, weight: 700, anchor: 'middle', o: 0 });
  tw(finalValue, { o: 1 }, 22.5, 0.7);
  tw(finalValue, { s: 1.2 }, 23, 0.3);
  tw(finalValue, { s: 1.0 }, 23.3, 0.3);
  
  const operations = T(p, '仅需 7 次运算！', { x: 1100, y: 705, size: 26, fill: GCD_COLOR, weight: 600, o: 0 });
  tw(operations, { o: 1 }, 24, 0.6);
}],

['fast-power-code', '快速幂实现', () => {
  const p = panel(0);
  
  const title = T(p, '快速幂代码', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const recursive = T(p, '递归版本', { x: 350, y: 180, size: 32, fill: BASE_COLOR, weight: 600, o: 0 });
  tw(recursive, { o: 1 }, 2, 0.5);
  
  const recCode = [
    'def power(a, n, m):',
    '  if n == 0:',
    '    return 1',
    '  half = power(a, n//2, m)',
    '  half = (half * half) % m',
    '  if n % 2 == 1:',
    '    half = (half * a) % m',
    '  return half'
  ];
  
  let codeY = 240;
  recCode.forEach((line, i) => {
    const text = T(p, line, { x: 350, y: codeY, size: 24, fill: COL.chalk, family: 'monospace', o: 0 });
    tw(text, { o: 1 }, 3 + i * 0.8, 0.5);
    codeY += 40;
  });
  
  const iterative = T(p, '迭代版本', { x: 850, y: 180, size: 32, fill: POWER_COLOR, weight: 600, o: 0 });
  tw(iterative, { o: 1 }, 2, 0.5);
  
  const iterCode = [
    'def power(a, n, m):',
    '  result = 1',
    '  base = a % m',
    '  while n > 0:',
    '    if n & 1:',
    '      result = (result*base)%m',
    '    base = (base * base) % m',
    '    n >>= 1',
    '  return result'
  ];
  
  codeY = 240;
  iterCode.forEach((line, i) => {
    const text = T(p, line, { x: 850, y: codeY, size: 24, fill: COL.chalk, family: 'monospace', o: 0 });
    tw(text, { o: 1 }, 10 + i * 0.7, 0.5);
    codeY += 40;
  });
  
  const note = T(p, '两者时间复杂度相同，迭代版更省栈空间', { x: 800, y: 650, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(note, { o: 1 }, 17, 0.6);
}],

['euclidean-intro', '欧几里得算法', () => {
  const p = panel(0);
  
  const title = T(p, '欧几里得算法', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const subtitle = T(p, 'Euclidean Algorithm - 辗转相除法', { x: 800, y: 170, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(subtitle, { o: 1 }, 1, 0.5);
  
  const purpose = T(p, '目标：求两个数的最大公约数（GCD）', { x: 400, y: 260, size: 32, fill: GCD_COLOR, weight: 600, o: 0 });
  tw(purpose, { o: 1 }, 3, 0.6);
  
  const theorem = T(p, '核心定理', { x: 400, y: 340, size: 34, fill: RESULT_COLOR, weight: 600, o: 0 });
  tw(theorem, { o: 1 }, 5, 0.5);
  
  const formula = T(p, 'gcd(a, b) = gcd(b, a mod b)', { x: 450, y: 410, size: 36, fill: BASE_COLOR, family: 'monospace', weight: 600, o: 0 });
  tw(formula, { o: 1 }, 6.5, 0.7);
  
  const explain = T(p, '为什么成立？', { x: 400, y: 500, size: 30, fill: COL.chalk, o: 0 });
  tw(explain, { o: 1 }, 9, 0.5);
  
  const reason1 = T(p, '设 d 是 a 和 b 的公约数', { x: 450, y: 570, size: 28, fill: COL.chalk, o: 0 });
  tw(reason1, { o: 1 }, 10.5, 0.5);
  
  const reason2 = T(p, '则 d | a 且 d | b', { x: 450, y: 630, size: 28, fill: COL.chalk, o: 0 });
  tw(reason2, { o: 1 }, 12, 0.5);
  
  const reason3 = T(p, '因为 a = bq + r，所以 d | r', { x: 450, y: 690, size: 28, fill: COL.chalk, o: 0 });
  tw(reason3, { o: 1 }, 13.5, 0.6);
  
  const conclusion = T(p, '→ d 也是 b 和 r 的公约数', { x: 450, y: 750, size: 28, fill: GCD_COLOR, weight: 600, o: 0 });
  tw(conclusion, { o: 1 }, 15, 0.6);
}],

['gcd-animation', 'GCD 动画演示', () => {
  const p = panel(0);
  
  const title = T(p, 'GCD 演示：gcd(48, 18)', { x: 800, y: 80, size: 44, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  // Visualization area
  const steps = [
    { a: 48, b: 18, operation: '48 mod 18', result: 12, t: 2 },
    { a: 18, b: 12, operation: '18 mod 12', result: 6, t: 6 },
    { a: 12, b: 6, operation: '12 mod 6', result: 0, t: 10 },
    { a: 6, b: 0, operation: 'b = 0, 停止', result: 6, t: 14 }
  ];
  
  let stepY = 180;
  steps.forEach(({ a, b, operation, result, t }, index) => {
    // Step label
    const stepLabel = T(p, `步骤 ${index + 1}:`, { x: 280, y: stepY, size: 28, fill: BINARY_COLOR, weight: 600, o: 0 });
    tw(stepLabel, { o: 1 }, t, 0.5);
    
    // Visual representation with bars
    const barX = 450;
    const barY = stepY - 30;
    const maxWidth = 400;
    
    // Bar for a
    const aWidth = (a / 48) * maxWidth;
    const aBar = mk('rect', { x: barX, y: barY, width: 0, height: 35, rx: 4, fill: BASE_COLOR, o: 0 }, p);
    tw(aBar, { o: 0.8 }, t + 0.2, 0.4);
    tw(aBar, { width: aWidth }, t + 0.3, 0.6);
    
    const aText = T(p, `a = ${a}`, { x: barX + aWidth + 20, y: barY + 25, size: 26, fill: BASE_COLOR, weight: 600, o: 0 });
    tw(aText, { o: 1 }, t + 0.5, 0.5);
    
    // Bar for b
    const bWidth = b > 0 ? (b / 48) * maxWidth : 0;
    const bBar = mk('rect', { x: barX, y: barY + 50, width: 0, height: 35, rx: 4, fill: GCD_COLOR, o: 0 }, p);
    tw(bBar, { o: 0.8 }, t + 0.6, 0.4);
    if (bWidth > 0) {
      tw(bBar, { width: bWidth }, t + 0.7, 0.6);
    }
    
    const bText = T(p, `b = ${b}`, { x: barX + Math.max(bWidth, 30) + 20, y: barY + 75, size: 26, fill: GCD_COLOR, weight: 600, o: 0 });
    tw(bText, { o: 1 }, t + 0.9, 0.5);
    
    // Operation
    const opText = T(p, operation, { x: 1000, y: stepY, size: 28, fill: POWER_COLOR, family: 'monospace', o: 0 });
    tw(opText, { o: 1 }, t + 1.2, 0.5);
    
    // Arrow pointing to result
    const arrow = T(p, '→', { x: 1250, y: stepY, size: 36, fill: RESULT_COLOR, weight: 700, o: 0 });
    tw(arrow, { o: 1 }, t + 1.5, 0.4);
    
    // Result
    const isLast = index === steps.length - 1;
    const resultText = T(p, isLast ? `GCD = ${result}` : `${result}`, { 
      x: 1320, y: stepY, size: isLast ? 32 : 28, 
      fill: isLast ? RESULT_COLOR : BINARY_COLOR, 
      weight: isLast ? 700 : 600, o: 0 
    });
    tw(resultText, { o: 1 }, t + 1.8, 0.6);
    
    if (isLast) {
      tw(resultText, { s: 1.3 }, t + 2.2, 0.4);
      tw(resultText, { s: 1.0 }, t + 2.6, 0.3);
    }
    
    // Connecting line to next step
    if (index < steps.length - 1) {
      const line = mk('line', { 
        x1: 280, y1: stepY + 40, x2: 280, y2: stepY + 100, 
        stroke: DIM_COLOR, 'stroke-width': 2, 'stroke-dasharray': '5,5', o: 0 
      }, p);
      tw(line, { o: 0.5 }, t + 2, 0.5);
    }
    
    stepY += 135;
  });
  
  // Summary box
  const summaryBox = mk('rect', { x: 250, y: 700, width: 1100, height: 80, rx: 10, fill: GCD_COLOR, o: 0 }, p);
  tw(summaryBox, { o: 0.15 }, 18, 0.6);
  
  const summaryText = T(p, '递归过程：gcd(48,18) → gcd(18,12) → gcd(12,6) → gcd(6,0) = 6', { 
    x: 800, y: 735, size: 28, fill: COL.chalk, anchor: 'middle', weight: 600, o: 0 
  });
  tw(summaryText, { o: 1 }, 19, 0.7);
  
  const efficient = T(p, '只需 3 步！复杂度 O(log min(a,b))', { x: 800, y: 770, size: 24, fill: BINARY_COLOR, anchor: 'middle', o: 0 });
  tw(efficient, { o: 1 }, 20.5, 0.6);
}],

['gcd-code', 'GCD 代码实现', () => {
  const p = panel(0);
  
  const title = T(p, 'GCD 代码', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const recursive = T(p, '递归版本（最简洁）', { x: 400, y: 200, size: 32, fill: GCD_COLOR, weight: 600, o: 0 });
  tw(recursive, { o: 1 }, 2, 0.5);
  
  const recCode = [
    'def gcd(a, b):',
    '  if b == 0:',
    '    return a',
    '  return gcd(b, a % b)'
  ];
  
  let codeY = 270;
  recCode.forEach((line, i) => {
    const text = T(p, line, { x: 420, y: codeY, size: 28, fill: COL.chalk, family: 'monospace', o: 0 });
    tw(text, { o: 1 }, 3 + i * 0.8, 0.5);
    codeY += 50;
  });
  
  const oneline = T(p, '→ 只需 4 行代码！', { x: 450, y: codeY + 20, size: 26, fill: RESULT_COLOR, weight: 600, o: 0 });
  tw(oneline, { o: 1 }, 6.5, 0.6);
  
  const iterative = T(p, '迭代版本', { x: 400, y: 530, size: 32, fill: BASE_COLOR, weight: 600, o: 0 });
  tw(iterative, { o: 1 }, 9, 0.5);
  
  const iterCode = [
    'def gcd(a, b):',
    '  while b != 0:',
    '    a, b = b, a % b',
    '  return a'
  ];
  
  codeY = 600;
  iterCode.forEach((line, i) => {
    const text = T(p, line, { x: 420, y: codeY, size: 28, fill: COL.chalk, family: 'monospace', o: 0 });
    tw(text, { o: 1 }, 10 + i * 0.8, 0.5);
    codeY += 50;
  });
  
  const pythonic = T(p, '→ Python 的同时赋值很优雅', { x: 450, y: codeY + 20, size: 26, fill: BINARY_COLOR, o: 0 });
  tw(pythonic, { o: 1 }, 13.5, 0.6);
}],

['extended-euclidean', '扩展欧几里得算法', () => {
  const p = panel(0);

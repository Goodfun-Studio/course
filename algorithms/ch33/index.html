let BEATS = [

  const solution = T(p, '后缀数组：用空间换时间的利器', { x: 800, y: 640, size: 36, fill: STRING_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(solution, { o: 1 }, 14, 0.7);
  
  const advantage = T(p, '比后缀树更省空间，查询同样高效', { x: 800, y: 710, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(advantage, { o: 1 }, 16, 0.6);
}],

['suffix-definition', '后缀的定义', () => {
  const p = panel(0);
  
  const title = T(p, '什么是后缀？', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const definition = T(p, '后缀：从某个位置到字符串末尾的子串', { x: 400, y: 200, size: 32, fill: SUFFIX_COLOR, weight: 600, o: 0 });
  tw(definition, { o: 1 }, 2, 0.6);
  
  const example = T(p, '示例字符串："banana"', { x: 400, y: 280, size: 36, fill: STRING_COLOR, weight: 600, o: 0 });
  tw(example, { o: 1 }, 4, 0.6);
  
  // Display all suffixes
  const str = "banana";
  const suffixes = [];
  for (let i = 0; i < str.length; i++) {
    suffixes.push({ index: i, text: str.substring(i) });
  }
  
  let suffixY = 360;
  suffixes.forEach(({ index, text }, i) => {
    const indexLabel = T(p, `后缀 ${index}:`, { x: 400, y: suffixY, size: 30, fill: INDEX_COLOR, weight: 600, o: 0 });
    tw(indexLabel, { o: 1 }, 5.5 + i * 0.8, 0.5);
    
    const suffixText = T(p, text, { x: 600, y: suffixY, size: 32, fill: SUFFIX_COLOR, family: 'monospace', weight: 600, o: 0 });
    tw(suffixText, { o: 1 }, 5.5 + i * 0.8 + 0.2, 0.5);
    
    // Highlight individual characters
    const charX = 600;
    for (let j = 0; j < text.length; j++) {
      const char = text[j];
      const box = mk('rect', { 
        x: charX + j * 40, y: suffixY - 25, 
        width: 35, height: 45, rx: 4, 
        fill: 'none', stroke: SUFFIX_COLOR, 'stroke-width': 2, o: 0 
      }, p);
      tw(box, { o: 0.6 }, 5.5 + i * 0.8 + 0.3, 0.4);
    }
    
    suffixY += 65;
  });
  
  const count = T(p, `共 ${str.length} 个后缀`, { x: 400, y: suffixY + 20, size: 28, fill: COL.dim, o: 0 });
  tw(count, { o: 1 }, 11, 0.5);
}],

['suffix-array-definition', '后缀数组定义', () => {

  tw(purpose, { o: 1 }, 6, 0.5);

  const comparison = T(p, '对比', { x: 400, y: 640, size: 36, fill: LCP_COLOR, weight: 600, o: 0 });
  tw(comparison, { o: 1 }, 12.5, 0.5);
  
  const vs = T(p, '后缀树：功能强大但占用 O(n) 空间', { x: 450, y: 710, size: 26, fill: DIM_COLOR, o: 0 });

  const current = T(p, '后缀数组：只需 O(n) 整数，更紧凑', { x: 450, y: 760, size: 26, fill: ARRAY_COLOR, weight: 600, o: 0 });

}],

['banana-example', 'banana 示例', () => {
  const p = panel(0);
  
  const title = T(p, '示例："banana"', { x: 800, y: 80, size: 48, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  // Original string with indices
  const str = "banana";
  const indexY = 150;
  const suffixY = 210;
  
  for (let i = 0; i < str.length; i++) {
    const x = 400 + i * 70;
    
    // Index
    const indexBox = mk('rect', { x: x, y: indexY, width: 60, height: 40, rx: 4, fill: INDEX_COLOR, o: 0 }, p);
    tw(indexBox, { o: 0.8 }, 1 + i * 0.15, 0.4);
    
    const indexText = T(p, i.toString(), { x: x + 30, y: indexY + 28, size: 24, fill: 'white', anchor: 'middle', weight: 700, o: 0 });
    tw(indexText, { o: 1 }, 1 + i * 0.15, 0.4);
    
    // Character
    const charBox = mk('rect', { x: x, y: suffixY, width: 60, height: 50, rx: 5, fill: STRING_COLOR, o: 0 }, p);
    tw(charBox, { o: 0.8 }, 2 + i * 0.15, 0.4);
    
    const char = T(p, str[i], { x: x + 30, y: suffixY + 35, size: 32, fill: 'white', anchor: 'middle', weight: 700, family: 'monospace', o: 0 });
    tw(char, { o: 1 }, 2 + i * 0.15, 0.4);
  }
  
  // All suffixes listed
  const suffixListY = 310;
  const label = T(p, '所有后缀（未排序）：', { x: 300, y: suffixListY, size: 28, fill: SUFFIX_COLOR, weight: 600, o: 0 });
  tw(label, { o: 1 }, 4, 0.5);
  
  const suffixes = [
    { i: 0, text: 'banana' },
    { i: 1, text: 'anana' },
    { i: 2, text: 'nana' },
    { i: 3, text: 'ana' },
    { i: 4, text: 'na' },
    { i: 5, text: 'a' }
  ];
  
  let listY = suffixListY + 60;
  suffixes.forEach(({ i, text }, idx) => {
    const idxText = T(p, `[${i}]`, { x: 350, y: listY, size: 26, fill: INDEX_COLOR, weight: 600, family: 'monospace', o: 0 });
    tw(idxText, { o: 1 }, 5 + idx * 0.6, 0.4);
    
    const suffixText = T(p, text, { x: 450, y: listY, size: 26, fill: COL.chalk, family: 'monospace', o: 0 });
    tw(suffixText, { o: 1 }, 5 + idx * 0.6 + 0.1, 0.4);
    
    listY += 45;
  });
  
  const arrow = T(p, '↓ 按字典序排序', { x: 900, y: 480, size: 32, fill: SORT_COLOR, weight: 700, o: 0 });
  tw(arrow, { o: 1 }, 9, 0.6);
}],

['suffix-array-construction', '后缀数组构建动画', () => {
  const p = panel(0);
  
  const title = T(p, '构建后缀数组', { x: 800, y: 70, size: 44, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const subtitle = T(p, 'banana → 排序后的后缀索引', { x: 800, y: 130, size: 26, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(subtitle, { o: 1 }, 0.8, 0.5);
  
  // Unsorted suffixes on left
  const leftX = 250;
  const leftLabel = T(p, '未排序', { x: leftX + 80, y: 180, size: 28, fill: DIM_COLOR, weight: 600, o: 0 });
  tw(leftLabel, { o: 1 }, 1.5, 0.5);
  
  const unsorted = [
    { i: 0, text: 'banana', sortKey: 'banana' },
    { i: 1, text: 'anana', sortKey: 'anana' },
    { i: 2, text: 'nana', sortKey: 'nana' },
    { i: 3, text: 'ana', sortKey: 'ana' },
    { i: 4, text: 'na', sortKey: 'na' },
    { i: 5, text: 'a', sortKey: 'a' }
  ];
  
  let leftY = 230;
  const leftBoxes = [];
  unsorted.forEach(({ i, text }, idx) => {
    const box = mk('rect', { x: leftX, y: leftY, width: 220, height: 50, rx: 5, fill: SUFFIX_COLOR, o: 0 }, p);
    tw(box, { o: 0.7 }, 2 + idx * 0.3, 0.4);
    leftBoxes.push({ box, y: leftY, i, text });
    
    const indexLabel = T(p, `[${i}]`, { x: leftX + 20, y: leftY + 33, size: 24, fill: 'white', weight: 700, family: 'monospace', o: 0 });
    tw(indexLabel, { o: 1 }, 2 + idx * 0.3, 0.4);
    
    const suffixText = T(p, text, { x: leftX + 80, y: leftY + 33, size: 24, fill: 'white', family: 'monospace', o: 0 });
    tw(suffixText, { o: 1 }, 2 + idx * 0.3 + 0.1, 0.4);
    
    leftY += 65;
  });
  
  // Sorting process arrow
  const arrowY = 450;
  const arrow1 = mk('line', { x1: 500, y1: arrowY, x2: 620, y2: arrowY, stroke: SORT_COLOR, 'stroke-width': 4, o: 0 }, p);
  tw(arrow1, { o: 1 }, 5, 0.5);
  
  const arrowHead = mk('polygon', { points: '620,440 650,450 620,460', fill: SORT_COLOR, o: 0 }, p);
  tw(arrowHead, { o: 1 }, 5, 0.5);
  
  const sortLabel = T(p, '字典序排序', { x: 560, y: 430, size: 26, fill: SORT_COLOR, weight: 600, o: 0 });
  tw(sortLabel, { o: 1 }, 5.2, 0.5);
  
  // Sorted suffixes on right
  const rightX = 680;
  const rightLabel = T(p, '排序后', { x: rightX + 80, y: 180, size: 28, fill: ARRAY_COLOR, weight: 600, o: 0 });
  tw(rightLabel, { o: 1 }, 1.5, 0.5);
  
  const sorted = [
    { i: 5, text: 'a', rank: 0 },
    { i: 3, text: 'ana', rank: 1 },
    { i: 1, text: 'anana', rank: 2 },
    { i: 0, text: 'banana', rank: 3 },
    { i: 4, text: 'na', rank: 4 },
    { i: 2, text: 'nana', rank: 5 }
  ];
  
  let rightY = 230;
  sorted.forEach(({ i, text, rank }, idx) => {
    const startTime = 6 + idx * 1.5;
    
    // Highlight in left
    const leftItem = leftBoxes.find(item => item.i === i);
    if (leftItem) {
      tw(leftItem.box, { fill: SORT_COLOR }, startTime, 0.3);
      tw(leftItem.box, { fill: SUFFIX_COLOR }, startTime + 1.2, 0.3);
    }
    
    // Animated curve from left to right
    const startX = leftX + 220;
    const startY = leftItem.y + 25;
    const endX = rightX;
    const endY = rightY + 25;
    
    const curve = mk('path', {
      d: `M ${startX},${startY} Q ${(startX+endX)/2},${(startY+endY)/2 - 60} ${endX},${endY}`,
      stroke: SORT_COLOR, 'stroke-width': 3, fill: 'none', 'stroke-dasharray': '8,4', o: 0
    }, p);
    tw(curve, { o: 0.8 }, startTime + 0.2, 0.5);
    tw(curve, { o: 0 }, startTime + 1, 0.3);
    
    // Right box appears
    const box = mk('rect', { x: rightX, y: rightY, width: 220, height: 50, rx: 5, fill: ARRAY_COLOR, o: 0 }, p);
    tw(box, { o: 0.8 }, startTime + 0.6, 0.5);
    
    const indexLabel = T(p, `[${i}]`, { x: rightX + 20, y: rightY + 33, size: 24, fill: 'white', weight: 700, family: 'monospace', o: 0 });
    tw(indexLabel, { o: 1 }, startTime + 0.7, 0.4);
    
    const suffixText = T(p, text, { x: rightX + 80, y: rightY + 33, size: 24, fill: 'white', family: 'monospace', o: 0 });
    tw(suffixText, { o: 1 }, startTime + 0.8, 0.4);
    
    const rankLabel = T(p, `#${rank}`, { x: rightX + 190, y: rightY + 33, size: 20, fill: '#ffd700', weight: 700, o: 0 });
    tw(rankLabel, { o: 1 }, startTime + 0.9, 0.4);
    
    rightY += 65;
  });
  
  // Final suffix array
  const saY = 680;
  const saLabel = T(p, '后缀数组 SA =', { x: 300, y: saY, size: 30, fill: ARRAY_COLOR, weight: 600, o: 0 });
  tw(saLabel, { o: 1 }, 16, 0.5);
  
  const saValues = sorted.map(s => s.i);
  saValues.forEach((val, idx) => {
    const x = 550 + idx * 80;
    const box = mk('rect', { x: x, y: saY - 30, width: 70, height: 55, rx: 5, fill: ARRAY_COLOR, o: 0 }, p);
    tw(box, { o: 0.8 }, 16.5 + idx * 0.3, 0.4);
    
    const valText = T(p, val.toString(), { x: x + 35, y: saY + 5, size: 32, fill: 'white', anchor: 'middle', weight: 700, o: 0 });
    tw(valText, { o: 1 }, 16.5 + idx * 0.3, 0.4);
  });
  
  const result = T(p, '[5, 3, 1, 0, 4, 2]', { x: 800, y: 760, size: 36, fill: ARRAY_COLOR, anchor: 'middle', weight: 700, family: 'monospace', o: 0 });
  tw(result, { o: 1 }, 18.5, 0.7);
  tw(result, { s: 1.15 }, 19, 0.3);
  tw(result, { s: 1.0 }, 19.3, 0.3);
}],

['naive-construction', '朴素构建方法', () => {

['lcp-definition', 'LCP 数组定义', () => {
  const p = panel(0);
  
  const title = T(p, 'LCP 数组', { x: 800, y: 100, size: 56, weight: 700, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.6, out);
  
  const subtitle = T(p, 'Longest Common Prefix', { x: 800, y: 170, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(subtitle, { o: 1 }, 0.8, 0.5);
  
  const definition = T(p, '定义：相邻排序后缀的最长公共前缀', { x: 400, y: 250, size: 32, fill: LCP_COLOR, weight: 600, o: 0 });
  tw(definition, { o: 1 }, 2.5, 0.6);
  
  const notation = T(p, 'LCP[i] = lcp(suffix[SA[i-1]], suffix[SA[i]])', { x: 450, y: 330, size: 28, fill: STRING_COLOR, family: 'monospace', o: 0 });
  tw(notation, { o: 1 }, 4.5, 0.6);
  
  const meaning = T(p, '意义：衡量相邻后缀的相似度', { x: 400, y: 410, size: 30, fill: COL.chalk, weight: 600, o: 0 });
  tw(meaning, { o: 1 }, 6.5, 0.5);
  
  const example = T(p, '示例（banana）', { x: 400, y: 490, size: 34, fill: INDEX_COLOR, weight: 600, o: 0 });
  tw(example, { o: 1 }, 8, 0.5);
  
  const cases = [
    { pair: 'a, ana', lcp: 1 },
    { pair: 'ana, anana', lcp: 3 },
    { pair: 'anana, banana', lcp: 0 },

['lcp-computation', 'LCP 计算动画', () => {

  let rowY = 230;
  data.forEach(({ rank, index, suffix, lcp, prev, common }, i) => {
    const startTime = 2.5 + i * 2;

    const indexText = T(p, index.toString(), { x: 470, y: rowY + 5, size: 26, fill: 'white', anchor: 'middle', weight: 700, o: 0 });
    tw(indexText, { o: 1 }, startTime + 0.2, 0.4);
    
    // Suffix with character boxes
    const suffixX = 620;
    for (let j = 0; j < suffix.length; j++) {
      const charBox = mk('rect', { 
        x: suffixX + j * 38, y: rowY - 25, 
        width: 35, height: 40, rx: 4, 
        fill: common && j < common.length ? LCP_COLOR : SUFFIX_COLOR, 
        o: 0 
      }, p);
      tw(charBox, { o: 0.8 }, startTime + 0.4 + j * 0.08, 0.3);
      
      const char = T(p, suffix[j], { 
        x: suffixX + j * 38 + 17, y: rowY + 5, 
        size: 24, fill: 'white', anchor: 'middle', 
        weight: common && j < common.length ? 700 : 400,
        family: 'monospace', o: 0 
      });
      tw(char, { o: 1 }, startTime + 0.4 + j * 0.08, 0.3);
    }
    
    // Previous suffix comparison (if not first)
    if (prev) {
      const prevLabel = T(p, `前：${prev}`, { x: 900, y: rowY, size: 22, fill: DIM_COLOR, o: 0 });
      tw(prevLabel, { o: 1 }, startTime + 0.7, 0.4);
      tw(prevLabel, { o: 0 }, startTime + 1.5, 0.3);

    tw(lcpText, { o: 1 }, startTime + 1.2, 0.5);
    
    // Highlight common prefix
    if (common && common.length > 0) {
      const highlight = mk('rect', {
        x: suffixX - 5, y: rowY - 30,
        width: common.length * 38, height: 50, rx: 6,
        fill: 'none', stroke: LCP_COLOR, 'stroke-width': 3, o: 0
      }, p);
      tw(highlight, { o: 0.8 }, startTime + 0.9, 0.4);
      tw(highlight, { o: 0 }, startTime + 1.6, 0.3);
    }
    
    rowY += 60;
  });

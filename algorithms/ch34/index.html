/* ---------- helper functions ---------- */
function drawArrow(panel, x1, y1, x2, y2, color, initialOpacity) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const angle = Math.atan2(dy, dx);
  const length = Math.sqrt(dx * dx + dy * dy);
  
  // Shorten line to not overlap with target circle
  const shortLength = length - 30;
  const x2Short = x1 + shortLength * Math.cos(angle);
  const y2Short = y1 + shortLength * Math.sin(angle);
  
  const line = L(panel, x1, y1, x2Short, y2Short, {
    stroke: color,
    'stroke-width': 2,
    'stroke-dasharray': '5,5',
    o: initialOpacity
  });
  
  // Arrow head
  const headSize = 8;
  const angle1 = angle + Math.PI * 0.8;
  const angle2 = angle - Math.PI * 0.8;
  const hx1 = x2Short + headSize * Math.cos(angle1);
  const hy1 = y2Short + headSize * Math.sin(angle1);
  const hx2 = x2Short + headSize * Math.cos(angle2);
  const hy2 = y2Short + headSize * Math.sin(angle2);
  
  const head = PO(panel, [x2Short, y2Short, hx1, hy1, hx2, hy2], {
    fill: color,
    o: initialOpacity
  });
  
  return { line, head };
}

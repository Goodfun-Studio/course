['mcmf-animation', '最小费用流演示', () => {
  const p = panel(0);
  
  const title = T(p, '算法演示', { x: 800, y: 80, size: 48, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });
  tw(title, { o: 1 }, 0.1, 0.5, out);
  
  // 节点位置
  const nodes = {
    S: { x: 250, y: 350, label: 'S' },
    A: { x: 500, y: 250, label: 'A' },
    B: { x: 500, y: 450, label: 'B' },
    C: { x: 750, y: 250, label: 'C' },
    D: { x: 750, y: 450, label: 'D' },
    T: { x: 1000, y: 350, label: 'T' }
  };
  
  // 绘制节点
  const nodeCircles = {};
  const nodeLabels = {};
  Object.entries(nodes).forEach(([id, pos]) => {
    const color = id === 'S' ? SOURCE_COLOR : id === 'T' ? SINK_COLOR : EDGE_COLOR;
    nodeCircles[id] = C(p, pos.x, pos.y, 30, { fill: color, o: 0 });
    tw(nodeCircles[id], { o: 1 }, 0.5, 0.4);
    nodeLabels[id] = T(p, pos.label, { x: pos.x, y: pos.y + 8, size: 24, fill: COL.bg, anchor: 'middle', weight: 700, o: 0 });
    tw(nodeLabels[id], { o: 1 }, 0.5, 0.4);
  });
  
  // 边的定义：[from, to, capacity, cost]
  const edges = [
    ['S', 'A', 3, 1],
    ['S', 'B', 4, 2],
    ['A', 'C', 2, 2],
    ['A', 'B', 2, 1],
    ['B', 'D', 3, 1],
    ['C', 'T', 2, 1],
    ['D', 'T', 4, 2]
  ];
  
  // 绘制边
  const edgeLines = [];
  const edgeLabels = [];
  edges.forEach(([from, to, cap, cost], idx) => {
    const fromPos = nodes[from];
    const toPos = nodes[to];
    
    // 计算箭头位置
    const dx = toPos.x - fromPos.x;
    const dy = toPos.y - fromPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const ux = dx / dist;
    const uy = dy / dist;
    
    const startX = fromPos.x + ux * 30;
    const startY = fromPos.y + uy * 30;
    const endX = toPos.x - ux * 30;
    const endY = toPos.y - uy * 30;
    
    const line = L(p, startX, startY, endX, endY, { stroke: EDGE_COLOR, width: 2, o: 0 });
    tw(line, { o: 0.5 }, 1 + idx * 0.1, 0.3);
    edgeLines.push(line);
    
    // 箭头
    const arrowSize = 8;
    const arrowX = endX - ux * arrowSize;
    const arrowY = endY - uy * arrowSize;
    const perpX = -uy * arrowSize * 0.5;
    const perpY = ux * arrowSize * 0.5;
    
    const arrow = PO(p, [
      [endX, endY],
      [arrowX + perpX, arrowY + perpY],
      [arrowX - perpX, arrowY - perpY]
    ], { fill: EDGE_COLOR, o: 0 });
    tw(arrow, { o: 0.5 }, 1 + idx * 0.1, 0.3);
    
    // 标签：容量/费用
    const midX = (startX + endX) / 2;
    const midY = (startY + endY) / 2;
    const offsetX = -uy * 15;
    const offsetY = ux * 15;
    
    const label = T(p, `0/${cap}(${cost})`, { 
      x: midX + offsetX, 
      y: midY + offsetY, 
      size: 18, 
      fill: DIM_COLOR, 
      anchor: 'middle',
      o: 0 
    });
    tw(label, { o: 1 }, 2 + idx * 0.1, 0.3);
    edgeLabels.push({ t: label, from, to, cap, cost, flow: 0 });
  });
  
  const status = T(p, '初始流量：0，总费用：0', { x: 800, y: 600, size: 28, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(status, { o: 1 }, 3, 0.5);
  
  // 第一轮增广：S -> A -> C -> T
  const round1 = T(p, '第1轮：S→A→C→T (费用3)', { x: 800, y: 650, size: 26, fill: PATH_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(round1, { o: 1 }, 4, 0.6);
  
  // 高亮路径
  tw(edgeLabels[0].t, { fill: PATH_COLOR }, 4.5, 0.3);
  tw(edgeLabels[2].t, { fill: PATH_COLOR }, 5, 0.3);
  tw(edgeLabels[5].t, { fill: PATH_COLOR }, 5.5, 0.3);
  
  // 更新流量：增加2
  tw(edgeLabels[0].t, { text: '2/3(1)' }, 6.5, 0.4);
  tw(edgeLabels[2].t, { text: '2/2(2)' }, 6.5, 0.4);
  tw(edgeLabels[5].t, { text: '2/2(1)' }, 6.5, 0.4);
  edgeLabels[0].flow = 2;
  edgeLabels[2].flow = 2;
  edgeLabels[5].flow = 2;
  
  tw(status, { text: '流量：2，总费用：8' }, 7, 0.5);
  tw(round1, { o: 0 }, 7.5, 0.3);
  
  // 恢复颜色
  tw(edgeLabels[0].t, { fill: DIM_COLOR }, 8, 0.3);
  tw(edgeLabels[2].t, { fill: DIM_COLOR }, 8, 0.3);
  tw(edgeLabels[5].t, { fill: DIM_COLOR }, 8, 0.3);
  
  // 第二轮增广：S -> B -> D -> T
  const round2 = T(p, '第2轮：S→B→D→T (费用5)', { x: 800, y: 650, size: 26, fill: PATH_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(round2, { o: 1 }, 9, 0.6);
  
  tw(edgeLabels[1].t, { fill: PATH_COLOR }, 9.5, 0.3);
  tw(edgeLabels[4].t, { fill: PATH_COLOR }, 10, 0.3);
  tw(edgeLabels[6].t, { fill: PATH_COLOR }, 10.5, 0.3);
  
  // 更新流量：增加3
  tw(edgeLabels[1].t, { text: '3/4(2)' }, 11.5, 0.4);
  tw(edgeLabels[4].t, { text: '3/3(1)' }, 11.5, 0.4);
  tw(edgeLabels[6].t, { text: '3/4(2)' }, 11.5, 0.4);
  edgeLabels[1].flow = 3;
  edgeLabels[4].flow = 3;
  edgeLabels[6].flow = 3;
  
  tw(status, { text: '流量：5，总费用：23' }, 12, 0.5);
  tw(round2, { o: 0 }, 12.5, 0.3);
  
  tw(edgeLabels[1].t, { fill: DIM_COLOR }, 13, 0.3);
  tw(edgeLabels[4].t, { fill: DIM_COLOR }, 13, 0.3);
  tw(edgeLabels[6].t, { fill: DIM_COLOR }, 13, 0.3);
  
  // 第三轮增广：S -> A -> B -> D -> T
  const round3 = T(p, '第3轮：S→A→B→D→T (费用6)', { x: 800, y: 650, size: 26, fill: PATH_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(round3, { o: 1 }, 14, 0.6);
  
  tw(edgeLabels[0].t, { fill: PATH_COLOR }, 14.5, 0.3);
  tw(edgeLabels[3].t, { fill: PATH_COLOR }, 15, 0.3);
  tw(edgeLabels[4].t, { fill: PATH_COLOR }, 15.5, 0.3);
  tw(edgeLabels[6].t, { fill: PATH_COLOR }, 16, 0.3);
  
  // 更新流量：增加1
  tw(edgeLabels[0].t, { text: '3/3(1)' }, 17, 0.4);
  tw(edgeLabels[3].t, { text: '1/2(1)' }, 17, 0.4);
  tw(edgeLabels[6].t, { text: '4/4(2)' }, 17, 0.4);
  edgeLabels[0].flow = 3;
  edgeLabels[3].flow = 1;
  edgeLabels[6].flow = 4;
  
  tw(status, { text: '流量：6，总费用：29' }, 17.5, 0.5);
  tw(round3, { o: 0 }, 18, 0.3);
  
  tw(edgeLabels[0].t, { fill: DIM_COLOR }, 18.5, 0.3);
  tw(edgeLabels[3].t, { fill: DIM_COLOR }, 18.5, 0.3);
  tw(edgeLabels[6].t, { fill: DIM_COLOR }, 18.5, 0.3);
  
  // 终止
  const done = T(p, '无更多增广路径，算法终止', { x: 800, y: 680, size: 28, fill: HIGHLIGHT_COLOR, anchor: 'middle', weight: 600, o: 0 });
  tw(done, { o: 1 }, 19.5, 0.7);
  
  const final = T(p, '最大流：6，最小费用：29', { x: 800, y: 730, size: 32, fill: SOURCE_COLOR, anchor: 'middle', weight: 700, o: 0 });
  tw(final, { o: 1 }, 21, 0.8);
}],

['complexity-analysis', '复杂度分析', () => {

  const title = T(p, '复杂度分析', { x: 800, y: 100, size: 52, weight: 600, fill: COL.chalk, anchor: 'middle', o: 0 });

  const params = T(p, 'f = 最大流，V = 节点数，E = 边数', { x: 800, y: 200, size: 30, fill: COL.dim, anchor: 'middle', o: 0 });
  tw(params, { o: 1 }, 2, 0.5);
  
  const time1 = T(p, '每次增广：O(V·E) SPFA时间', { x: 400, y: 290, size: 32, fill: COL.chalk, o: 0 });
  tw(time1, { o: 1 }, 3.5, 0.6);
  
  const time2 = T(p, '最多增广：f 次', { x: 400, y: 360, size: 32, fill: COL.chalk, o: 0 });
  tw(time2, { o: 1 }, 5, 0.5);
  
  const total = T(p, '总复杂度：O(f · V · E)', { x: 800, y: 460, size: 40, fill: COST_COLOR, anchor: 'middle', weight: 700, family: 'monospace', o: 0 });
  tw(total, { o: 1 }, 7, 0.8);

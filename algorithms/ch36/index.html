const POINT_COLOR = '#e74c3c';        // 红色（端点）
const VECTOR_COLOR = '#f39c12';       // 橙色（向量）
const CROSS_COLOR = '#2ecc71';        // 绿色（叉积/相交）

/* ---------- helper functions ---------- */
function drawSegment(p, x1, y1, x2, y2, color, width = 3) {
  return L(p, x1, y1, x2, y2, { stroke: color, 'stroke-width': width, o: 0 });
}

function drawPoint(p, x, y, color, r = 6) {
  return C(p, x, y, r, { fill: color, o: 0 });
}

function drawArrow(p, x1, y1, x2, y2, color) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / len;
  const uy = dy / len;
  
  const arrowLen = 12;
  const arrowWidth = 8;
  
  const line = L(p, x1, y1, x2, y2, { stroke: color, 'stroke-width': 2, o: 0 });
  
  const ax = x2 - arrowLen * ux + arrowWidth * uy;
  const ay = y2 - arrowLen * uy - arrowWidth * ux;
  const bx = x2 - arrowLen * ux - arrowWidth * uy;
  const by = y2 - arrowLen * uy + arrowWidth * ux;
  
  const arrow = Poly(p, [x2, y2, ax, ay, bx, by], { fill: color, o: 0 });
  
  return { line, arrow };
}

function drawBBox(p, x1, y1, x2, y2, color) {
  const minX = Math.min(x1, x2);
  const maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2);
  const maxY = Math.max(y1, y2);
  
  return R(p, minX, minY, maxX - minX, maxY - minY, { 
    stroke: color, 
    'stroke-width': 2, 
    'stroke-dasharray': '5,5',
    fill: 'none',
    o: 0 
  });
}

const CHAPTER = { number: 38, title: '布隆过滤器（Bloom Filter）', language: 'zh', minutes: 10 };

/* ---------- 颜色方案 ---------- */
const PRIMARY = '#3498db';      // 蓝色（主色）
const SUCCESS = '#2ecc71';      // 绿色（成功/存在）
const DANGER = '#e74c3c';       // 红色（失败/误判）
const WARNING = '#f39c12';      // 橙色（警告/哈希）
const PURPLE = '#9b59b6';       // 紫色（高亮）
const CYAN = '#1abc9c';         // 青色（辅助）
const DARK = '#2c3e50';         // 深色（文字）
const LIGHT = '#ecf0f1';        // 浅灰（背景）
const PINK = '#e91e63';         // 粉色（第三哈希）

/* ---------- 辅助函数 ---------- */
function drawBitArray(parent, x, y, size, highlightIndices = [], label = true) {
  const g = G(parent, { x, y, o: 0 });
  const cellWidth = 35;
  const cellHeight = 40;
  
  for (let i = 0; i < size; i++) {
    const cellX = i * cellWidth;
    const isHighlighted = highlightIndices.includes(i);
    const color = isHighlighted ? SUCCESS : LIGHT;
    
    // 绘制单元格
    const rect = mk('rect', {
      x: cellX, y: 0,
      width: cellWidth - 2, height: cellHeight,
      fill: color,
      stroke: DARK,
      'stroke-width': 2,
      rx: 3
    }, g);
    
    // 绘制值（0或1）
    const value = isHighlighted ? '1' : '0';
    const text = T(g, value, {
      x: cellX + cellWidth / 2 - 1,
      y: cellHeight / 2,
      size: 20,
      weight: 700,
      fill: isHighlighted ? '#fff' : DARK,
      anchor: 'middle'
    });
    text.setAttribute('dominant-baseline', 'central');
    
    // 绘制索引
    if (label) {
      const indexText = T(g, String(i), {
        x: cellX + cellWidth / 2 - 1,
        y: cellHeight + 20,
        size: 14,
        fill: DARK,
        anchor: 'middle'
      });
    }
  }
  
  return g;
}

function drawHashFunction(parent, x, y, name, color, input, output) {
  const g = G(parent, { x, y, o: 0 });
  
  // 哈希函数框
  mk('rect', {
    x: 0, y: 0,
    width: 120, height: 60,
    fill: color,
    stroke: DARK,
    'stroke-width': 2,
    rx: 8
  }, g);
  
  // 函数名
  const text = T(g, name, {
    x: 60, y: 30,
    size: 18,
    weight: 700,
    fill: '#fff',
    anchor: 'middle'
  });
  text.setAttribute('dominant-baseline', 'central');
  
  return g;
}

function drawArrow(parent, x1, y1, x2, y2, color = DARK, label = '') {
  const g = G(parent, { o: 0 });
  
  // 箭头线
  mk('line', {
    x1, y1, x2, y2,
    stroke: color,
    'stroke-width': 3
  }, g);
  
  // 箭头头部
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const arrowSize = 10;
  const ax1 = x2 - arrowSize * Math.cos(angle - Math.PI / 6);
  const ay1 = y2 - arrowSize * Math.sin(angle - Math.PI / 6);
  const ax2 = x2 - arrowSize * Math.cos(angle + Math.PI / 6);
  const ay2 = y2 - arrowSize * Math.sin(angle + Math.PI / 6);
  
  mk('line', { x1: x2, y1: y2, x2: ax1, y2: ay1, stroke: color, 'stroke-width': 3 }, g);
  mk('line', { x1: x2, y1: y2, x2: ax2, y2: ay2, stroke: color, 'stroke-width': 3 }, g);
  
  // 标签
  if (label) {
    const labelText = T(g, label, {
      x: (x1 + x2) / 2,
      y: (y1 + y2) / 2 - 15,
      size: 16,
      weight: 600,
      fill: color,
      anchor: 'middle'
    });
  }
  
  return g;
}

  const bitArrayY = 400;
  const bitArray = drawBitArray(p, 100, bitArrayY, m, [], true);
  tw(bitArray, { o: 1 }, 1);
  
  // 标签说明
  const bitLabel = T(p, '位数组（初始全为0）', { x: 400, y: 370, size: 18, fill: DARK, anchor: 'middle', o: 0 });
  tw(bitLabel, { o: 1 }, 1.5);
  
  // 哈希函数
  const hashY = 200;
  const h1 = drawHashFunction(p, 100, hashY, 'h₁(x)', WARNING);
  const h2 = drawHashFunction(p, 290, hashY, 'h₂(x)', CYAN);
  const h3 = drawHashFunction(p, 480, hashY, 'h₃(x)', PINK);

  tw(h2, { o: 1 }, 2.3);
  tw(h3, { o: 1 }, 2.6);
  
  // 模拟哈希结果
  const indices = [3, 7, 12];
  const colors = [WARNING, CYAN, PINK];
  
  let time = 3;
  
  indices.forEach((idx, i) => {
    const color = colors[i];
    const funcX = 100 + i * 190 + 60;
    const funcY = hashY + 60;
    
    // 显示哈希值
    const hashValue = T(p, `→ ${idx}`, {
      x: funcX + 70,
      y: funcY - 30,
      size: 24,
      weight: 700,
      fill: color,
      anchor: 'middle',
      o: 0
    });
    tw(hashValue, { o: 1 }, time);
    tw(hashValue, { y: funcY - 35 }, time + 0.3, 0.3);
    tw(hashValue, { y: funcY - 30 }, time + 0.6, 0.3);
    
    // 绘制箭头
    const arrow = drawArrow(p, funcX, funcY + 30, 
                           100 + idx * 35 + 17, bitArrayY - 10, color);
    tw(arrow, { o: 1 }, time + 0.9);
    
    // 高亮位数组中的位置
    const cellX = 100 + idx * 35;
    const highlight = mk('rect', {
      x: cellX, y: bitArrayY,
      width: 33, height: 40,
      fill: color,
      stroke: DARK,
      'stroke-width': 3,
      rx: 3,
      o: 0
    }, p);
    tw(highlight, { o: 0.8 }, time + 1.2);
    tw(highlight, { 'stroke-width': 4 }, time + 1.5, 0.2);
    tw(highlight, { 'stroke-width': 3 }, time + 1.7, 0.2);
    
    // 更新位的值为1
    const bitText = T(p, '1', {
      x: cellX + 16,
      y: bitArrayY + 20,
      size: 20,
      weight: 700,
      fill: '#fff',
      anchor: 'middle',
      o: 0
    });
    bitText.setAttribute('dominant-baseline', 'central');
    tw(bitText, { o: 1 }, time + 1.5);
    tw(bitText, { size: 24 }, time + 1.8, 0.2);
    tw(bitText, { size: 20 }, time + 2, 0.2);
    
    time += 2.5;

    const hashLabel = T(p, `h${i+1}("cherry") = ${idx}`, {
      x: 600,
      y: hashY + i * 30,
      size: 18,
      fill: color,
      o: 0
    });
    tw(hashLabel, { o: 1 }, time);
    tw(hashLabel, { x: 595 }, time + 0.3, 0.2);
    tw(hashLabel, { x: 600 }, time + 0.5, 0.2);
    
    // 检查箭头
    const cellX = 100 + idx * 35 + 17;
    const arrow = drawArrow(p, 650, hashY + i * 30, cellX, bitArrayY - 10, color);
    tw(arrow, { o: 1 }, time + 0.5);
    
    time += 1;
  });
  
  // 结果：误判
  const result2 = T(p, '所有位都是 1 → 可能存在 ⚠', {
    x: 600, y: 280,
    size: 22,
    weight: 600,
    fill: WARNING,
    o: 0
  });
  tw(result2, { o: 1 }, time);
  tw(result2, { size: 24 }, time + 0.3, 0.2);

    o: 0

    size: 18,

    anchor: 'middle',

  // 数学公式
  T(p, '误判率公式', { x: 400, y: 260, size: 28, weight: 600, fill: PURPLE, anchor: 'middle', o: 0 });
  
  const formula = T(p, 'P ≈ (1 - e^(-kn/m))^k', {
    x: 400, y: 320,
    size: 36,
    weight: 700,
    family: 'monospace',
    fill: DARK,
    anchor: 'middle',
    o: 0
  });
  tw(formula, { o: 1 }, 2);
  
  // 参数说明
  const params = [
    { text: 'k = 哈希函数个数', y: 390 },
    { text: 'n = 已插入元素数量', y: 430 },
    { text: 'm = 位数组大小', y: 470 }

  // 最优k值

    x: 400, y: 530,
    size: 20,
    weight: 600,
    fill: SUCCESS,
    anchor: 'middle',
    o: 0
  });

['implementation', '代码实现', () => {
  const p = panel(0);
  
  T(p, '代码实现', { x: 400, y: 50, size: 36, weight: 700, fill: DARK, anchor: 'middle' });
  
  const code = `class BloomFilter {
  constructor(size, hashCount) {
    this.size = size;
    this.hashCount = hashCount;
    this.bits = new Array(size).fill(0);
  }
  
  hash(str, seed) {
    let h = seed;
    for (let i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) % this.size;
    }
    return h;
  }
  
  add(item) {
    for (let i = 0; i < this.hashCount; i++) {
      const index = this.hash(item, i);
      this.bits[index] = 1;
    }
  }
  
  contains(item) {
    for (let i = 0; i < this.hashCount; i++) {
      const index = this.hash(item, i);
      if (this.bits[index] === 0) {
        return false;  // 一定不存在
      }
    }
    return true;  // 可能存在（或误判）
  }
}

// 使用示例
const bf = new BloomFilter(1000, 3);
bf.add("apple");
bf.contains("apple");   // true（确实存在）
bf.contains("banana");  // false（一定不存在）
bf.contains("cherry");  // 可能误判为true`;
  
  const codeElem = T(p, code, {

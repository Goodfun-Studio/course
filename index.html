<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程 · good fun 谷放</title>
<meta name="description" content="谷放工作室的课程库：一节课一页的静态课程，打开就能看、能听、能动手。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a1a'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='40' fill='%23f4f1ea'%3E%E8%B0%B7%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;--ink-soft:#3a3733;--ink-faint:#6b6660;
    --paper:#f4f1ea;--cinnabar:#a8332a;
    --line:rgba(26,26,26,.12);
    --serif:"Noto Serif SC","Songti SC","STSong",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--serif);color:var(--ink);background:var(--paper);line-height:1.9;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:860px;margin:0 auto;padding:0 28px}
  header{padding:72px 0 34px}
  .eyebrow{font-size:13px;letter-spacing:4px;color:var(--cinnabar)}
  h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:1px;margin:14px 0 12px}
  .lede{font-size:16.5px;color:var(--ink-soft);font-weight:300;max-width:640px}
  .list{margin:30px 0 90px;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
  .item{background:var(--paper);padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;transition:background .3s}
  .item:hover{background:rgba(255,255,255,.6)}
  .item h2{font-size:21px;font-weight:600;letter-spacing:1px;margin-bottom:6px}
  .item p{font-size:15px;color:var(--ink-faint);font-weight:300;margin:0}
  .go{color:var(--cinnabar);font-size:15px;white-space:nowrap}
  footer{border-top:1px solid var(--line);padding:30px 0 60px;font-size:13px;color:var(--ink-faint);text-align:center}
</style>
</head>
<body>
<header class="wrap">
  <p class="eyebrow">GOODFUN STUDIO · 课程</p>
  <h1>课程库</h1>
  <p class="lede">把知识做成一节课一页的静态课程：打开就能看、能听、能动手，不用装任何东西。</p>
</header>

<main class="wrap">
  <div class="list">
    <a class="item" href="algorithms/">
      <div>
        <h2>算法动画课 · 递归与经典算法</h2>
        <p>从汉诺塔讲起：把递归的每一步画出来，看得见它怎么拆、怎么收。（第一章）</p>
      </div>
      <span class="go">开始学习 →</span>
    </a>
    <a class="item" href="quant-ml/">
      <div>
        <h2>量化交易机器学习 · 交互动画课</h2>
        <p>从把数据洗干净、把尺度对齐讲起：残差化与归一化，含配音、字幕与随堂小测。（第四章）</p>
      </div>
      <span class="go">开始学习 →</span>
    </a>
  </div>
</main>

<footer>good fun studio · 谷放工作室 © 2026</footer>
</body>
</html>
